<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szyfr „Rewolucja” 1920</title>
<meta name="description" content="Gra na kartkę: złam szyfr „Rewolucja” z 12 sierpnia 1920 roku tak jak polscy kryptolodzy — krata, zmiennik, odejmowanie bez pożyczania i błędy bolszewickich szyfrantów. Siedem języków, z rozwiązaniami.">
<link rel="stylesheet" href="../sheet-kit/kit.css">
<style>
  .rw{font-size:12px;line-height:1.4;color:#222;}
  .rw p{margin:0 0 2mm;}
  .rw h3{font-size:13px;margin:0 0 1mm;}
  .box{border:0.3mm solid #bbb;border-radius:2mm;padding:2mm 3mm;margin:0 0 2.6mm;}
  .tip{border-color:#d29a00;background:#fff8dc;font-size:10.5px;line-height:1.32;padding:1.6mm 3mm;}
  .tip p{margin:0 0 0.8mm;}
  .cy{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.04em;}
  .small{font-size:10px;color:#555;}
  /* the base table (krata) */
  .krata{border-collapse:collapse;font:700 12px/1 ui-monospace,Menlo,Consolas,monospace;}
  .krata th,.krata td{width:5.6mm;height:5.6mm;text-align:center;border:0.3mm solid #777;padding:0;}
  .krata th{background:#ece6d6;color:#5a4b30;font-size:10.5px;}
  .krata th.corner{background:#fff;border-color:#fff #777 #777 #fff;}
  .krata td{color:#1b2a6b;font-size:13px;background:#fff;}
  .krata td.hl{background:#ffe36b;}
  .kcap{font-size:9.5px;color:#666;margin:0.8mm 0 0;}
  /* key boxes */
  .keyline{display:flex;gap:0.6mm;align-items:flex-end;flex-wrap:wrap;}
  .d{width:4.1mm;height:5mm;border:0.3mm solid #888;border-radius:0.6mm;background:#fff;text-align:center;font:700 11.5px/4.7mm ui-monospace,Menlo,Consolas,monospace;color:#1f4fbf;}
  .d.pre{color:#777;}
  .d.fw{border-bottom:0.9mm solid #2a6cb0;}
  .d.bw{border-bottom:0.9mm solid #e08a00;}
  .keyline .sep{width:1.6mm;}
  .legend{font-size:9.5px;color:#555;margin:1mm 0 0;display:flex;gap:4mm;flex-wrap:wrap;}
  .legend i{display:inline-block;width:5mm;height:0.9mm;vertical-align:middle;margin-right:1mm;}
  .top{display:grid;grid-template-columns:58mm 1fr;gap:4mm;align-items:start;margin:0 0 2.4mm;}
  .top > *{min-width:0;}
  .top .box{margin:0 0 2mm;}
  .top .box:last-child{margin:0;}
  .keybox{display:flex;align-items:center;gap:2.5mm;padding:1.4mm 3mm;}
  .keybox h3{white-space:nowrap;}
  .keybox .keyline{flex-wrap:nowrap;}
  .keybox h3{margin:0;}
  .keybox .d{width:4.8mm;height:5.6mm;line-height:5.3mm;font-size:12.5px;}
  .keybox .legend{margin:0;flex-direction:column;gap:0;line-height:1.25;}
  /* telegram */
  .tg{border:0.4mm solid #7a6a4f;background:#fbf7ec;border-radius:1.5mm;padding:1mm 2.2mm 1.4mm;margin:0 0 1.8mm;}
  .tg .th{font-size:10px;color:#5a4b30;margin:0 0 1mm;display:flex;gap:2mm;flex-wrap:wrap;align-items:baseline;}
  .tg .th b{font-size:12px;color:#222;}
  .tg .stamp{font:700 10.5px ui-monospace,Menlo,Consolas,monospace;color:#a01d22;border:0.3mm solid #a01d22;border-radius:0.8mm;padding:0 1.2mm;}
  .heard{font:700 12.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#333;word-spacing:1.4mm;margin-left:2mm;}
  .heard span{font:400 9.5px system-ui,sans-serif;color:#7a6a4f;letter-spacing:0;word-spacing:0;margin-right:1.5mm;}
  .grid{display:flex;align-items:flex-start;gap:1mm;}
  .labs{display:flex;flex-direction:column;gap:0.5mm;flex:0 0 auto;}
  .labs div{height:5.6mm;font-size:9px;line-height:5.6mm;color:#5a4b30;text-align:right;white-space:nowrap;}
  .labs div.ll{height:6.6mm;line-height:6.6mm;}
  .labs div.lc{height:5mm;line-height:5mm;}
  .blocks{display:flex;gap:2.4mm;flex-wrap:wrap;}
  .blk{display:flex;gap:0.8mm;padding:0 0.6mm;border-radius:1mm;}
  .blk:nth-child(2){background:#efe7d2;}
  .pr{display:flex;flex-direction:column;gap:0.5mm;}
  .pr .row2{display:flex;gap:0;}
  .pr .c{width:4.8mm;height:5mm;text-align:center;font:700 12.5px/5mm ui-monospace,Menlo,Consolas,monospace;color:#222;}
  .grid .pr .row2 .d{width:4.8mm;height:5.6mm;line-height:5.3mm;font-size:12.5px;}
  .pr .row2 .d{border-radius:0;}
  .pr .row2 .d + .d{border-left:0;}
  .pr .lt{height:6.6mm;border:0.4mm solid #555;border-radius:0.8mm;background:#fff;text-align:center;font:700 14px/6.2mm ui-monospace,Menlo,Consolas,monospace;color:#1f4fbf;}
  .pr .lt.pre{color:#888;}
  /* the telegrams in depth and the dials (★★★) */
  .deepbox{font-size:10.5px;line-height:1.32;}
  .deepbox ol{margin:0 0 1.6mm;padding-left:4.5mm;}
  .deepbox li{margin:0 0 0.6mm;}
  .dtop{display:grid;grid-template-columns:1fr 50mm;gap:4mm;align-items:start;}
  .dex{border:0.3mm dashed #bbb;border-radius:1.5mm;padding:1.2mm 2mm;font-size:9.5px;line-height:1.28;text-align:center;}
  .dex h4{margin:0;font-size:10.5px;}
  .dex .dial{display:block;margin:0.6mm auto;}
  .deep{border-collapse:separate;border-spacing:0;font:700 12.5px/1 ui-monospace,Menlo,Consolas,monospace;margin:0 0 0.8mm;}
  .deep td,.deep th{width:4.6mm;height:5.2mm;text-align:center;padding:0;}
  .deep td{border-bottom:0.2mm solid #ccc;}
  .deep th{font-size:10.5px;font-weight:400;color:#999;}
  .deep th.w{font-weight:700;}
  .deep th.w.fw{color:#2a6cb0;}
  .deep th.w.bw{color:#e08a00;}
  .deep .w{background:#dcdcdc;}
  .deep .np{border-left:0.9mm solid #fff;}
  .deep .nb{border-left:2.4mm solid #fff;}
  .deep td,.deep th:not(.lab){min-width:4.6mm;}
  .deep th.lab{width:auto;font:400 9px/1.1 system-ui,sans-serif;color:#5a4b30;text-align:right;padding-right:1.5mm;white-space:nowrap;background:none;}
  .dials{display:flex;justify-content:space-between;gap:1mm;margin:1.2mm 0 1mm;}
  .dials > div{text-align:center;font-size:9px;color:#5a4b30;}
  .dial{display:block;}
  .dials .d{margin:0.4mm auto 0;width:5mm;height:5.8mm;line-height:5.5mm;font-size:13px;}
  .dans{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:0.4mm 6mm;margin:1.2mm 0 0;font-size:11px;}
  .duo2{display:grid;grid-template-columns:1fr 1fr;gap:5mm;align-items:start;}
  .sw{display:inline-block;width:4mm;height:3mm;background:#dcdcdc;vertical-align:-0.4mm;margin-right:1mm;}
  /* glossary, report, map */
  .gloss{columns:2;column-gap:4mm;font-size:9px;line-height:1.2;margin:0 0 1.4mm;}
  .gloss div{break-inside:avoid;margin:0 0 0.6mm;}
  .duo{display:grid;grid-template-columns:1fr 64mm;gap:4mm;align-items:start;}
  .map svg{display:block;width:100%;height:auto;}
  .map .cap{font-size:9.5px;color:#555;text-align:center;margin-top:0.6mm;}
  .q{margin:0 0 1mm;font-size:10.5px;line-height:1.28;}
  .q .ln{display:block;border-bottom:0.3mm solid #444;height:5mm;}
  /* how it works */
  .how{font-size:11.5px;line-height:1.36;}
  .how h3{margin:1.3mm 0 0.5mm;font-size:12.5px;}
  .how p{margin:0 0 1.2mm;}
  .abc{display:flex;flex-wrap:wrap;gap:0.8mm;margin:0.6mm 0 0.6mm;}
  .abc div{width:8.6mm;border:0.3mm solid #999;border-radius:1mm;text-align:center;background:#fff;padding:0.2mm 0 0.4mm;}
  .abc b{display:block;font:700 13px/1.15 ui-monospace,Menlo,Consolas,monospace;color:#1b2a6b;}
  .abc span{display:block;font-size:9px;line-height:1.05;color:#444;}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:2mm 5mm;}
  .demo{display:grid;grid-template-columns:auto 1fr;gap:0.8mm 2mm;align-items:center;margin:1mm 0 1.4mm;}
  .demo .lab{font-size:9.5px;color:#666;text-align:right;}
  .demo .row{display:flex;gap:0.9mm;}
  .demo .p2{display:flex;}
  .demo .p2 .d{color:#222;border-radius:0;width:4mm;height:5mm;line-height:4.7mm;font-size:11.5px;}
  .demo .p2 .d + .d{border-left:0;}
  .demo .p2.hl .d{background:#ffe36b;}
  .demo .lt{width:8mm;text-align:center;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#1b2a6b;}
  .demo .lt.hl{background:#ffe36b;border-radius:1mm;}
  .how ul{margin:0 0 1.2mm;padding-left:5mm;}
  .how li{margin:0 0 0.4mm;}
  .trick{border:0.5mm solid #1f4fbf;background:#eef3ff;}
  .warm{display:grid;grid-template-columns:1fr 1fr;gap:1mm 5mm;}
  .warm .q{font-size:11px;}
  .warm .ln{display:inline-block;width:9mm;border-bottom:0.3mm solid #444;margin:0 2.5mm 0 1mm;}
  .warm .ops{display:block;margin-top:1mm;font:700 12px ui-monospace,Menlo,Consolas,monospace;}
  /* story */
  .cols{columns:2;column-gap:5mm;}
  .cols > div{break-inside:avoid;margin:0 0 2.2mm;}
  .stop{display:grid;grid-template-columns:1fr 84mm;gap:5mm;align-items:start;}
  .west{border:0.5mm solid #1f4fbf;background:#eef3ff;}
  /* the real key card */
  .realtop{display:grid;grid-template-columns:70mm 1fr;gap:5mm;align-items:start;}
  .photo{display:block;width:100%;height:auto;border:0.3mm solid #bbb;}
  .realtop .doc{font-size:10px;line-height:1.33;}
  .doc{font:10.5px/1.38 "Courier New",Courier,ui-monospace,monospace;color:#1b2a6b;background:#fdfcf6;border:0.3mm solid #999;padding:2mm 3mm;margin:0 0 2.4mm;box-shadow:0.6mm 0.6mm 0 #ddd;}
  .doc .where{font:600 9.5px system-ui,sans-serif;color:#7a6a4f;display:block;margin:0 0 0.4mm;}
  .doc p{margin:0 0 1.6mm;}
  .doc table{border-collapse:collapse;margin:0.6mm 0 0;}
  .doc td{padding:0 3mm 0 0;}
  .notes{display:grid;grid-template-columns:1fr 1fr;gap:0.6mm 5mm;font-size:10.5px;margin:0 0 2.4mm;}
  .notes b{font-family:"Courier New",Courier,monospace;color:#1b2a6b;}
  /* answers */
  .ans .tr{margin:0 0 2.4mm;font-size:12px;}
  .ans ol{margin:0;padding-left:5mm;}
  .ans li{margin:0 0 1.4mm;}
  @media (max-width:600px){
    .duo,.top,.stop,.steps,.realtop,.notes,.warm,.dtop{grid-template-columns:1fr;}
    .dials{flex-wrap:wrap;justify-content:center;}
    .deepbox{overflow-x:auto;}
    .cols,.gloss{columns:1;}
    .grid{overflow-x:auto;}
    .keybox,.keybox .keyline{flex-wrap:wrap;}
  }
  @media print{ .rw{font-size:11.5px;} .rw.how{font-size:11px;} .grid{overflow:visible;} }
</style>

<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🔐 Cud nad Wisłą — Szyfr „Rewolucja”</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false"></form>
  <div class="stage"><div id="out"></div></div>
</div>

<script src="../i18n.js"></script>
<script src="../series.js" data-part="4"></script>
<script src="../print-qr.js"></script>
<script src="../sheet-kit/kit.js"></script>
<script src="../wisla-1920/engine.js"></script>
<script src="../wisla-1920/strings.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const esc = KIT.esc;
  const d1 = (x, cls = '') => `<div class="d ${cls}">${x === undefined || x === null ? '' : x}</div>`;

  /** The base table; `hl` letters get a yellow cell. */
  const krata = (hl = '') => `<table class="krata"><tr><th class="corner"></th>${REW.GRID[0].map((_, c) => `<th>${c}</th>`).join('')}</tr>`
    + REW.GRID.map((row, r) => `<tr><th>${r}</th>${row.map(ch => `<td${hl.includes(ch) ? ' class="hl"' : ''}>${ch}</td>`).join('')}</tr>`).join('') + '</table>';

  /** The 12 key boxes: blue underline for the 6 digits, orange for the same backwards; `show(i)` → digit or ''. */
  const keyBoxes = (show, pre = () => false) => `<div class="keyline">${Array.from({ length: 12 }, (_, i) =>
    (i === 6 ? '<span class="sep"></span>' : '') + d1(show(i), (i < 6 ? 'fw' : 'bw') + (pre(i) ? ' pre' : ''))).join('')}</div>`;

  /**
   * The work grid of a telegram: blocks of 12 digits (one whole key), pairs of digits (one letter each).
   * fill: { key, plain, letters } — what is written in (answers), pre: letters printed in grey (★★).
   */
  function workGrid(t, L, fill = {}, pre = '') {
    const n = t.cipher.length, blocks = [];
    for (let b = 0; b < n; b += 12) {
      const pairs = [];
      for (let i = b; i < Math.min(b + 12, n); i += 2) {
        const li = i / 2, kcls = j => (j % 12 < 6 ? 'fw' : 'bw');
        const letter = fill.letters ? t.text[li] : (pre[li] || '');
        pairs.push(`<div class="pr">
          <div class="row2"><div class="c">${t.cipher[i]}</div><div class="c">${t.cipher[i + 1]}</div></div>
          <div class="row2">${d1(fill.key ? t.keyRow[i] : '', kcls(i))}${d1(fill.key ? t.keyRow[i + 1] : '', kcls(i + 1))}</div>
          <div class="row2">${d1(fill.plain ? t.plain[i] : '')}${d1(fill.plain ? t.plain[i + 1] : '')}</div>
          <div class="lt${!fill.letters && pre[li] ? ' pre' : ''}">${letter}</div></div>`);
      }
      blocks.push(`<div class="blk">${pairs.join('')}</div>`);
    }
    return `<div class="grid"><div class="labs"><div class="lc">${esc(L.cipher)}</div><div>${esc(L.key)}</div><div>${esc(L.plain)}</div><div class="ll">${esc(L.letters)}</div></div>
      <div class="blocks">${blocks.join('')}</div></div>`;
  }

  /**
   * ★★★: the telegrams in depth, one under another, digit by digit; over every column the number of the key digit
   * (1 2 3 4 5 6 6 5 4 3 2 1 …, blue / orange as in the key frame). Grey = row digits, the first of each pair.
   */
  function depthTable(ts, D, M) {
    const n = Math.max(...ts.map(t => t.cipher.length));
    const cls = p => [p % 2 ? '' : 'w', p % 12 < 6 ? 'fw' : 'bw', p % 12 === 0 ? (p ? 'nb' : '') : (p % 2 ? '' : 'np')].filter(Boolean).join(' ');
    const cols = Array.from({ length: n }, (_, p) => p);
    return `<table class="deep"><tr><th class="lab">${esc(D.numLab)}</th>${cols.map(p => `<th class="${cls(p)}">${REW.keyIndex(p) + 1}</th>`).join('')}</tr>`
      + ts.map((t, i) => `<tr><th class="lab">${esc(M.tg(i + 1))}</th>${cols.map(p => p < t.cipher.length
        ? `<td class="${cls(p)}">${t.cipher[p]}</td>` : `<td class="${cls(p).replace(/\bw\b/, '')}" style="border:0"></td>`).join('')}</tr>`).join('')
      + '</table>';
  }

  /** ★★★: a dial 0–9 (0 at the top, clockwise) for key digit `n`; `marks` are circled (answers, example), `k` ringed. */
  function dial(n, marks = [], k = null, size = 21) {
    const at = (d, r) => { const a = (d * 36 - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
    const f = x => x.toFixed(2);
    // the arrow: an arc over the number in the middle, clockwise
    const [x0, y0] = at(-2.2, 4.4), [x1, y1] = at(2.2, 4.4), a1 = (2.2 * 36 - 90) * Math.PI / 180;
    const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
    let s = `<svg class="dial" viewBox="-10.6 -10.6 21.2 21.2" width="${size}mm" height="${size}mm" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">`
      + `<circle r="10.2" fill="#fff" stroke="#7a6a4f" stroke-width="0.35"/>`
      + `<path d="M${f(x0)} ${f(y0)}A4.4 4.4 0 0 1 ${f(x1)} ${f(y1)}" fill="none" stroke="#888" stroke-width="0.45"/>`
      + `<path d="M${f(x1 + tx * 1.3)} ${f(y1 + ty * 1.3)}L${f(x1 + nx * 0.8)} ${f(y1 + ny * 0.8)}L${f(x1 - nx * 0.8)} ${f(y1 - ny * 0.8)}Z" fill="#888"/>`
      + `<text y="2.6" font-size="5" font-weight="700" text-anchor="middle" fill="#1b2a6b">${n}</text>`;
    for (let d = 0; d < 10; d++) {
      const [x, y] = at(d, 7.5);
      if (marks.includes(d)) s += `<circle cx="${f(x)}" cy="${f(y)}" r="2.15" fill="#ffe36b" stroke="#d29a00" stroke-width="0.35"/>`;
      if (d === k) s += `<circle cx="${f(x)}" cy="${f(y)}" r="2.45" fill="none" stroke="#1f4fbf" stroke-width="0.6"/>`;
      s += `<text x="${f(x)}" y="${f(y + 1.3)}" font-size="3.7" font-weight="700" text-anchor="middle" fill="#222">${d}</text>`;
    }
    return s + '</svg>';
  }
  /** The six empty dials under the depth table, each with a box for its key digit. */
  const dials = (d, D) => `<div class="dials">${d.key6.map((_, i) => `<div>${dial(i + 1)}${esc(D.dial)} ${i + 1}${d1('', 'fw')}</div>`).join('')}</div>`;
  /** Answers: the digits to circle on each dial, from the key digit on (k, k+1, k+2, k+3), → the key digit. */
  const dialAnswers = (d, D) => `<p class="dans">${d.key6.map((k, i) => {
    const marks = [...new Set(REW.rowDigits(d.telegrams, i))].sort((a, b) => REW.sub(a, k) - REW.sub(b, k));
    return `<span>${esc(D.dial)} ${i + 1}: <span class="cy">${marks.join(' ')}</span> → <b class="cy">${k}</b></span>`;
  }).join('')}</p>`;

  KIT.app({
    store: 'rewolucja1920.sheet',
    text: REW_TEXT,
    groups: [{ id: 'level', values: ['easy', 'mid', 'hard'], def: 'easy', label: (v, C) => C.levels[v] }],
    checks: [{ id: 'how', def: true, label: 'optHow' }, { id: 'story', def: true, label: 'optStory' }, { id: 'real', def: true, label: 'optReal' }],
    render(s, api) {
      const { C } = api, W = W20_TEXT[I18N.get()] || W20_TEXT.en;   // map labels, the Russian alphabet and the story map's title
      const d = REW.day(api.rnd('day')), M = C.mission, G = C.grid, hard = s.level === 'hard';
      const ts = d.telegrams.slice(0, hard ? 3 : 2);   // the third telegram is there to set three in depth (★★★)
      const L = { ...W.map, units: { ...W.map.units, army16: C.map.army16 } };
      const mapChoice = () => W20.mapSvg({ mode: 'choice', L,
        units: { army4: [53.15, 20.0], army16: [52.5, 23.0] },
        choices: { A: [[52.33, 22.75], [52.25, 21.4]], B: [[52.85, 19.95], [52.38, 20.82]], C: [[51.3, 20.85], [51.98, 20.95]] },
        choiceLabels: { A: [38, 12], B: [-36, -22], C: [-15, 32] } });
      const telegram = (t, i, fill) => `<div class="tg"><div class="th"><b>📻 ${esc(M.tg(i + 1))}</b><span class="stamp">РЕВОЛЮЦИЯ ${d.num}</span>
        <span class="heard"><span>📡 ${esc(M.heard)}</span>${t.groups.join(' ')}</span></div>${workGrid(t, G, fill ? { key: 1, plain: 1, letters: 1 } : {}, !fill && i === 0 && s.level === 'mid' ? d.start : '')}</div>`;
      const pages = [];

      // 0. how the cipher works
      if (s.how) {
        const H = C.how, ex = REW.EXAMPLE, pd = REW.digitsOf(ex.word), kr = REW.unfold(ex.key6), cd = REW.encrypt(ex.word, ex.key6);
        const krow = pd.map((_, i) => kr[i % 12]), isI = i => ex.word[i] === 'И';
        const pairsRow = (arr, cls = j => '') => `<div class="row">${ex.word.split('').map((_, j) =>
          `<div class="p2${isI(j) ? ' hl' : ''}">${d1(arr[2 * j], cls(2 * j))}${d1(arr[2 * j + 1], cls(2 * j + 1))}</div>`).join('')}</div>`;
        const groups = []; for (let i = 0; i < cd.length; i += 5) groups.push(cd.slice(i, i + 5).join(''));
        const A = W.abc, snd = A.sounds.split(' ');
        const w4 = REW.encrypt('МИР', ex.key6), trickC = cd.slice(0, 6), trickW = REW.digitsOf('ДИВ');
        const sec = ([h, p]) => `<h3>${esc(h)}</h3><p>${esc(p)}</p>`;
        pages.push(`<div class="sheet rw how">
          ${api.head(H.title, H.sub, false)}
          <div class="abc">${[...'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'].map((ch, i) => `<div><b>${ch}</b><span>${esc(snd[i])}</span></div>`).join('')}</div>
          <p class="small" style="margin:0 0 1.4mm">🔤 ${esc(A.title)}. ${esc(A.note)}</p>
          <p>${esc(H.intro)}</p>
          <div class="steps">
            <div>${sec(H.s1)}<div style="display:flex;gap:3mm;align-items:flex-start">${krata('И')}<p class="small" style="margin:0">${esc(G.gridNote)}</p></div></div>
            <div>${sec(H.s2)}<div class="demo">
              <span class="lab">${esc(H.word)}</span><div class="row">${ex.word.split('').map((ch, j) => `<div class="lt${isI(j) ? ' hl' : ''}">${ch}</div>`).join('')}</div>
              <span class="lab">${esc(H.step1)}</span>${pairsRow(pd)}
              <span class="lab">+ ${esc(H.keyLab)}<br>${ex.key6.join('')}</span>${pairsRow(krow, i => (i % 12 < 6 ? 'fw' : 'bw'))}
              <span class="lab">= ${esc(H.sent)}</span>${pairsRow(cd)}
            </div></div>
          </div>
          <div class="steps">
            <div>${sec(H.s3)}<p class="cy" style="font-size:12.5px;letter-spacing:.08em">РЕВОЛЮЦИЯ 2 &nbsp; ${groups.join(' ')}</p></div>
            <div>${sec(H.rcv)}</div>
          </div>
          ${sec(H.comb)}
          <h3>${esc(H.breakT)}</h3>
          <p style="margin:0 0 0.6mm">${esc(H.breakP)}</p>
          <ul>${H.mistakes.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
          <div class="box trick"><h3 style="margin-top:0">💡 ${esc(H.trickT)}</h3><p style="margin:0">${esc(H.trick(trickC.join(' '), trickW.join(' '), REW.keyFrom(trickC, 'ДИВ').join('')))}</p></div>
          <div class="box tip"><h3 style="margin-top:0">✏️ ${esc(H.warmT)}</h3><div class="warm">
            <div class="q">1. ${esc(H.w[0])}<span class="ops">7 + 5 =<span class="ln"></span>9 + 9 =<span class="ln"></span>6 + 4 =<span class="ln"></span></span></div>
            <div class="q">2. ${esc(H.w[1])}<span class="ops">3 − 8 =<span class="ln"></span>7 − 2 =<span class="ln"></span>0 − 6 =<span class="ln"></span></span></div>
            <div class="q">3. ${esc(H.w[2])}<span class="ops"><span class="ln" style="width:60mm"></span></span></div>
            <div class="q">4. ${esc(H.w[3])}<span class="ops">${w4.slice(0, 2).join('')} ${w4.slice(2, 4).join('')} ${w4.slice(4).join('')} =<span class="ln" style="width:22mm"></span></span></div>
          </div></div>
          <h3>${esc(H.levelsT)}</h3>
          <p class="small" style="margin:0">${H.levels.map(esc).join('<br>')}</p>
        </div>`);
      }

      // 1. the mission
      const hint = { easy: M.easy(d.num, d.key6.join('')), mid: M.mid(d.start), hard: M.hard }[s.level];
      const keyShown = s.level === 'easy' ? i => (i < 6 ? d.key6[i] : '') : () => '';
      const top = `${api.head(C.title, M.sub, true)}
        <p style="font-size:10.5px;line-height:1.32;margin:0 0 1.6mm">${esc(M.intro(d.num, hard))}</p>
        <div class="top">
          <div class="box"><h3>▦ ${esc(G.gridTitle)}</h3>${krata()}<p class="kcap">${esc(G.gridNote)}</p></div>
          <div>
            <div class="box tip"><h3>🔎 ${esc(M.hintTitle)}</h3><p>${esc(hint)}</p><p style="margin:0">${esc(M.then)}</p></div>
            <div class="box keybox"><h3>🔑 ${esc(M.keyTitle(d.num))}</h3>${keyBoxes(keyShown, i => s.level === 'easy' && i < 6)}
              <div class="legend"><span><i style="background:#2a6cb0"></i>${esc(G.fw)}</span><span><i style="background:#e08a00"></i>${esc(G.bw)}</span></div></div>
          </div>
        </div>`;
      const gloss = REW.VOCAB.filter(w => hard || !REW.T3.words.includes(w));
      const work = `${ts.map((t, i) => telegram(t, i, false)).join('')}
        <div class="duo">
          <div><h3>📖 ${esc(M.glossTitle)}</h3>
            <div class="gloss">${gloss.map(w => `<div><span class="cy">${w}</span> — ${esc(C.gloss[w])}</div>`).join('')}</div>
            <h3>📝 ${esc(C.report.title)}</h3>
            ${C.report.q.map((q, i) => `<div class="q">${i + 1}. ${esc(q)}${i === 1 ? '' : '<span class="ln"></span>'}</div>`).join('')}</div>
          <div class="map">${mapChoice()}</div>
        </div>`;
      if (!hard) pages.push(`<div class="sheet rw">${top}${work}</div>`);
      else {
        // ★★★: the depth sheet first, the telegrams to read on the next page
        const D = M.depth;
        pages.push(`<div class="sheet rw">${top}
          <div class="box deepbox"><h3>🧮 ${esc(D.title)}</h3>
            <div class="dtop"><ol>${D.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
              <div class="dex"><h4>${esc(D.exT)}</h4>${dial('', [7, 8, 9, 0], 7, 19)}${esc(D.ex)}</div></div>
            ${depthTable(ts, D, M)}
            <p class="small" style="margin:0"><span class="sw"></span>${esc(D.rowLab)}</p>
            ${dials(d, D, false)}
            <p class="small" style="margin:0">${esc(D.note)}</p>
          </div>
        </div>`);
        pages.push(`<div class="sheet rw">${api.head(C.title, M.sub, false)}${work}</div>`);
      }

      // 2. the story
      if (s.story) {
        const S = C.story, sec = ([h, p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`;
        pages.push(`<div class="sheet rw">
          ${api.head(S.title, S.sub, false)}
          <div class="stop">
            <div>${S.sections.slice(0, 2).map(sec).join('')}</div>
            <div class="map">${W20.mapSvg({ mode: 'story', L: W.map })}<div class="cap">${esc(W.story.mapTitle)}</div></div>
          </div>
          <div class="cols">${S.sections.slice(2).map(sec).join('')}</div>
          <div class="box west">${sec(S.today).replace(/^<div>|<\/div>$/g, '')}</div>
          <p class="small">${esc(S.simpl)}</p>
          <p class="small">${esc(S.sources)}</p>
        </div>`);
      }

      // 3. a real key card from the archive
      if (s.real) {
        const X = C.real, D = REW_DOC;
        pages.push(`<div class="sheet rw">
          ${api.head(X.title, X.sub, false)}
          <p>${esc(X.intro)}</p>
          <div class="realtop">
            <div><img class="photo" src="delegat-1919.jpg" width="490" height="720" alt="${esc(X.photoAlt)}"><p class="small" style="margin-top:1mm">${esc(X.photoCap)}</p></div>
            <div>
              <div class="doc">
                <p><span class="where">${esc(X.where[0])}</span>${esc(D.title)}</p>
                <p><span class="where">${esc(X.where[1])}</span>${esc(D.right)}</p>
                <p><span class="where">${esc(X.where[2])}</span>${esc(D.ways)}
                  <table>${D.keys.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></p>
                <p style="margin:0"><span class="where">${esc(X.where[3])}</span>${esc(D.notes)}</p>
              </div>
              <p class="small">${esc(X.readNote)}</p>
            </div>
          </div>
          <div class="box"><h3>${esc(X.translT)}</h3><p style="margin:0">${esc(X.transl)}</p></div>
          <h3>${esc(X.notesT)}</h3>
          <div class="notes">${X.notes.map(([k, v]) => `<div><b>${esc(k)}</b> — ${esc(v)}</div>`).join('')}</div>
          <h3>✏️ ${esc(X.tasksT)}</h3>
          ${X.tasks.map((q, i) => `<div class="q">${i + 1}. ${esc(q)}<span class="ln"></span></div>`).join('')}
          <p class="small">${esc(X.source)}</p>
        </div>`);
      }

      // 4. answers
      if (s.key) {
        const A = C.answers, H = C.how;
        pages.push(`<div class="sheet rw ans">
          ${api.head(api.t('keyTitle'), C.title, false)}
          <div class="box"><h3>🔑 ${esc(M.keyTitle(d.num))}: <span class="cy">${d.key6.join('')} ${d.key6.slice().reverse().join('')}</span></h3>
            <p style="margin:0">${esc(hard ? A.keyHowHard(d.start) : A.keyHow(d.start))}</p>
            ${hard ? dialAnswers(d, M.depth) : ''}</div>
          ${ts.map((t, i) => telegram(t, i, true) + `<p class="tr">➜ <span class="cy">${esc(t.words.join(' '))}</span> — ${esc([A.tr1[d.start], A.tr2[t.id], A.tr3[t.id]][i])}</p>`).join('')}
          <h3>📝 ${esc(C.report.title)}</h3>
          <ol>${A.report(d.num).map(a => `<li>${esc(a)}</li>`).join('')}</ol>
          ${hard && s.how && s.real ? '<div class="duo2"><div>' : ''}
          ${s.how ? `<h3 style="margin-top:2.5mm">${esc(H.warmT)}</h3><ol><li>2, 8, 0</li><li>5, 5, 4</li><li><span class="cy">418620 026814</span></li><li>${REW.digitsOf('МИР').join('').replace(/(..)(?=.)/g, '$1 ')} = <span class="cy">МИР</span> — ${esc(H.mir)}</li></ol>` : ''}
          ${hard && s.how && s.real ? '</div><div>' : ''}
          ${s.real ? `<h3 style="margin-top:2.5mm">${esc(C.real.title)}</h3><ol>${C.real.answers.map(a => `<li>${esc(a)}</li>`).join('')}</ol>` : ''}
          ${hard && s.how && s.real ? '</div></div>' : ''}
        </div>`);
      }
      return { html: pages.join(''), tasks: ts.length, pages: pages.length };
    },
  });
})();
</script>
</body>
</html>
