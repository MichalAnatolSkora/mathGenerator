<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prawdziwa Enigma 1932: karty pracy</title>
<meta name="description" content="Printable A4 worksheets for ages 10–14: build a paper Enigma I with three rotors, the reflector and the plugboard, and decode a message as Marian Rejewski's team did in 1932.">
<style>
  :root{
    --ink:#1b1b1f; --muted:#666; --accent:#4f5bd5; --accent-d:#3d48b8;
    --bg:#eef1f6; --panel:#ffffff; --soft:#f3f5f9; --err:#c0252b; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none !important}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;}
  button{font:inherit;}
  .appbar{padding:12px 18px;background:var(--panel);border-bottom:1px solid #e2e6ee;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .appbar .grow{flex:1 1 auto;min-width:0;}
  .appbar h1{margin:0;font-size:18px;}
  .appbar p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .navlink{display:inline-flex;align-items:center;min-height:40px;font-weight:600;font-size:14px;color:var(--accent-d);text-decoration:none;border:1px solid #ccd2dd;border-radius:999px;padding:6px 12px;background:var(--soft);white-space:nowrap;}
  .navlink:hover{border-color:var(--accent);}
  .wrap{display:flex;gap:18px;align-items:flex-start;padding:18px;max-width:1100px;margin:0 auto;}
  @media (max-width:880px){ .wrap{flex-direction:column;align-items:stretch;} .stage{width:100%;} }

  /* ---- controls ---- */
  .controls{flex:0 0 290px;background:var(--panel);border:1px solid #e2e6ee;border-radius:var(--radius);padding:14px;position:sticky;top:14px;}
  @media (max-width:880px){ .controls{position:static;flex-basis:auto;width:100%;} }
  .controls h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;}
  .grp{margin-bottom:14px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .presets button{font-size:12.5px;min-height:38px;padding:6px 12px;border:1px solid #ccd2dd;background:var(--soft);border-radius:999px;cursor:pointer;}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .presets button:hover{border-color:var(--accent);}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:2px 0;min-height:32px;}
  .check input{width:18px;height:18px;flex:0 0 auto;}
  .check b{display:inline-block;min-width:1.6em;color:var(--muted);font-weight:700;}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  button.primary{font-weight:600;padding:10px;min-height:44px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;}
  button.primary:hover{background:var(--accent-d);}
  .msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--muted);}
  .msg.error{color:var(--err);font-weight:600;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;}

  /* ---- preview: each A4 page in a frame scaled to the column ---- */
  .stage{flex:1;min-width:0;}
  .ams-frame{margin:0 auto 18px;}
  .ams-frame .ams-page{transform-origin:0 0;box-shadow:0 2px 10px rgba(20,30,60,.10);border:1px solid #e2e6ee;}

  /* ================= the A4 cards: the look of ../enigma/index.html ================= */
  .ams-page{
    width:186mm; height:272mm; box-sizing:border-box; padding:3mm;
    position:relative; overflow:hidden; background:#fff; color:#1B1B1F;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .ams-body{position:relative;height:257mm;overflow:hidden;font-size:12pt;line-height:1.32;display:flex;flex-direction:column;gap:3mm;}
  .ams-body p{margin:0;}
  .ams-body h1,.ams-body h2,.ams-body h3{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.15;}
  .ams-h1{font-size:2.1667em;font-weight:800;letter-spacing:-.01em;}
  .ams-big{font-size:2.6em;}
  .ams-body h2{font-size:1.3333em;font-weight:700;}
  .ams-body h3,.ams-h3{font-size:1.1em;font-weight:800;color:#1E3A5F;}
  .ams-sub{color:#4A4A55;margin-top:1mm !important;}
  .ams-small{font-size:max(9pt,.82em);color:#4A4A55;}
  .ams-l{font-family:"Courier New",Courier,monospace;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
  .ams-red{color:#B3261E;}
  .ams-sec{display:flex;flex-direction:column;gap:1.8mm;}
  .ams-foot{position:absolute;left:3mm;right:3mm;bottom:3mm;display:flex;justify-content:space-between;font-size:9pt;color:#4A4A55;border-top:0.3mm solid #C9C4B8;padding-top:1.2mm;}
  .ams-phead{border-bottom:0.5mm solid #1B1B1F;padding-bottom:2mm;}
  .re-qhead{display:flex;align-items:flex-end;gap:4mm;}
  .ams-over{font-size:max(9pt,.8em);font-weight:800;letter-spacing:.1em;color:#B3261E;}
  .ams-mhead{display:flex;align-items:center;gap:6mm;padding-bottom:2mm;border-bottom:0.5mm solid #1B1B1F;}
  .ams-stamp{flex:none;width:22mm;height:22mm;border:0.8mm solid #B3261E;border-radius:50%;transform:rotate(-8deg);color:#B3261E;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1;gap:.8mm;}
  .ams-stamp span{font-size:7.5pt;font-weight:800;letter-spacing:.06em;}
  .ams-stamp b{font-size:15pt;font-weight:800;}
  .ams-task{display:flex;align-items:center;gap:3mm;flex-wrap:wrap;}
  .ams-dot{flex:none;width:8mm;height:8mm;border-radius:50%;background:#1E3A5F;color:#fff;display:flex;align-items:center;justify-content:center;font:800 13pt/1 "Trebuchet MS","Segoe UI",system-ui,sans-serif;}
  .ams-crow{display:flex;flex-wrap:wrap;gap:2.5mm 5mm;}
  .ams-word{display:flex;gap:1mm;}
  .ams-cell{display:flex;flex-direction:column;align-items:center;gap:.8mm;}
  .ams-cl{font:700 15pt/1 "Courier New",Courier,monospace;height:5.5mm;display:flex;align-items:center;}
  .ams-box{flex:none;width:8.5mm;height:10mm;border:0.4mm solid #1B1B1F;border-radius:1mm;display:inline-flex;align-items:center;justify-content:center;font:700 15pt/1 "Courier New",Courier,monospace;background:#fff;}
  .ams-b-red{border-color:#B3261E;color:#B3261E;}
  .ams-b-navy{border-color:#1E3A5F;border-width:0.6mm;color:#1E3A5F;}
  .ams-erow{display:flex;align-items:center;gap:1mm;}
  .ams-elabel{flex:none;width:30mm;font-size:max(9pt,.78em);font-weight:800;letter-spacing:.05em;}
  .ams-keyline{display:flex;align-items:center;gap:2mm 3mm;flex-wrap:wrap;}
  .ams-disc{margin-top:auto;border:0.5mm dashed #1E3A5F;border-radius:2.5mm;padding:2.5mm 4mm 3mm;display:flex;flex-direction:column;gap:1.6mm;}
  .ams-frame-box{border:0.4mm solid #1E3A5F;border-radius:2.5mm;padding:2.5mm 4mm 3mm;display:flex;flex-direction:column;gap:1.4mm;}
  .ams-body ol,.ams-body ul{margin:0;padding-left:6mm;}
  .ams-body li{margin:.5mm 0;}
  .ams-cols{display:grid;grid-template-columns:1fr 1fr;gap:8mm;}
  .ams-two{display:grid;grid-template-columns:1fr 1fr;gap:3mm;}
  .ams-secret{display:inline-block;border:0.8mm solid #B3261E;color:#B3261E;padding:1.5mm 4mm;font:800 13pt/1 "Trebuchet MS","Segoe UI",system-ui,sans-serif;letter-spacing:.12em;transform:rotate(-4deg);flex:none;margin:2.5mm 2.5mm 2.5mm 0;}
  .ams-keyhead{display:flex;align-items:center;gap:5mm;border-bottom:0.5mm solid #1B1B1F;padding-bottom:2mm;}
  .ams-keyhead .ams-secret{font-size:10pt;padding:1.2mm 3mm;}
  .ams-real{border-collapse:collapse;width:100%;}
  .ams-real td{border:0.25mm solid #C9C4B8;padding:1.2mm 2mm;vertical-align:top;text-align:left;}
  .ams-real td:first-child{width:38mm;font-weight:700;}
  /* wheel pages */
  .ams-wheels{position:relative;flex:1;}
  .ams-wheels > *{position:absolute;}
  .ams-wheel{display:block;}
  .ams-wt{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;letter-spacing:.05em;}
  .ams-wt2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .ams-howto{display:flex;flex-direction:column;gap:1.5mm;}

  /* this part: the letters on the wheels and the plugboard, the assembled machine, the chain, the strips */
  .re-wl{font-family:Verdana,"DejaVu Sans",Arial,sans-serif;font-weight:700;}
  .re-big,.re-plug{display:block;margin:0 auto;}
  .re-story{flex-direction:row;align-items:center;gap:5mm;}
  .re-story > div{flex:1;display:flex;flex-direction:column;gap:1.4mm;}
  .re-story svg{flex:none;}
  .re-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:1mm 6mm;font-size:.9em;}
  .re-legend > span{display:inline-flex;align-items:center;gap:1.5mm;}
  .re-legend > .re-lw{display:inline;}
  .re-legend i{display:inline-block;width:8mm;height:0;border-top:0.7mm solid;}
  .re-chain{display:grid;grid-template-columns:repeat(11,1fr);gap:1mm;text-align:center;}
  .re-chain b{display:flex;align-items:center;justify-content:center;height:10mm;border:0.5mm solid #1E3A5F;border-radius:1mm;font:700 15pt/1 "Courier New",Courier,monospace;}
  .re-chain b.re-in{border-color:#B3261E;color:#B3261E;}
  .re-chain b.re-out{border-color:#1E5AA8;color:#1E5AA8;}
  .re-chain b.re-end{border-width:0.9mm;}
  .re-chain span{font-size:max(9pt,.74em);color:#4A4A55;line-height:1.1;overflow-wrap:anywhere;}
  .re-strip{border-collapse:collapse;width:100%;table-layout:fixed;}
  .re-strip th,.re-strip td{border:0.25mm solid #C9C4B8;text-align:center;height:7.5mm;padding:0;font:700 11pt/1 "Courier New",Courier,monospace;}
  .re-strip th{font:800 8pt/1.05 "Trebuchet MS","Segoe UI",system-ui,sans-serif;width:20mm;text-align:left;padding:0 1mm;color:#1E3A5F;}
  .re-strip td.re-sw{color:#fff;}
  .re-key{display:grid;grid-template-columns:max-content 1fr;gap:.6mm 3mm;margin:0;}
  .re-key dt{font-weight:800;color:#1E3A5F;}
  .re-key dd{margin:0;}
  .re-wide{width:62mm !important;}
  .re-trace{border-collapse:collapse;width:100%;table-layout:fixed;}
  .re-trace th,.re-trace td{border:0.25mm solid #C9C4B8;text-align:center;padding:1mm .5mm;}
  .re-trace th{font-size:max(8pt,.7em);color:#1E3A5F;font-weight:800;line-height:1.1;overflow-wrap:anywhere;}
  .re-trace td{font:700 11pt/1 "Courier New",Courier,monospace;}
  .re-trace th:nth-child(n+4):nth-child(-n+8),.re-trace td:nth-child(n+4):nth-child(-n+8){color:#B3261E;}
  .re-trace th:nth-child(n+9):nth-child(-n+12),.re-trace td:nth-child(n+9):nth-child(-n+12){color:#1E5AA8;}
  .re-trace td.re-tin,.re-trace td.re-tout{background:#F3EFE6;}
  .re-ladder,.re-fig{display:block;margin:0 auto;}
  .re-in2{display:grid;grid-template-columns:1fr 54mm;gap:4mm;align-items:start;}
  .re-figs{display:flex;flex-direction:column;gap:2mm;}
  .re-figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.8mm;}
  .re-figs figcaption{font-size:max(9pt,.76em);color:#4A4A55;text-align:center;line-height:1.2;}
  .e32-p1{gap:4mm;}
  .e32-p2{gap:1.8mm;}
  .e32-p7{gap:1.8mm;}
  .e32-p8{gap:3mm;}

  /* ---- phone ---- */
  @media (max-width:600px){
    .appbar{padding:12px 14px;}
    .wrap{padding:10px;gap:12px;}
  }

  /* ---- print ---- */
  @media print{
    @page{ size:A4; margin:12mm; }
    .appbar,.controls,.no-print{display:none !important;}
    body{background:#fff;}
    .wrap{display:block;padding:0;margin:0;max-width:none;}
    .ams-frame{width:auto !important;height:auto !important;margin:0;break-after:page;page-break-after:always;}
    .ams-frame:last-child{break-after:auto;page-break-after:auto;}
    .ams-frame .ams-page{transform:none !important;box-shadow:none;border:0;}
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🔐 Prawdziwa Enigma 1932</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false">
    <div class="grp">
      <h2 data-i18n="pagesH">Które strony</h2>
      <div class="presets" id="presets">
        <button type="button" data-preset="kid" data-i18n="presetKid">Dla dziecka</button>
        <button type="button" data-preset="cut" data-i18n="presetCut">Wycinanki</button>
        <button type="button" data-preset="key" data-i18n="presetKey">Klucz dla rodzica</button>
        <button type="button" data-preset="all" data-i18n="presetAll">Wszystko</button>
      </div>
      <div id="pageChecks"></div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="printBtn" data-i18n="print">🖨️ Drukuj</button>
    </div>
    <div class="hint" data-i18n="printHint"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>

  <div class="stage">
    <div id="out"></div>
  </div>
</div>

<script src="../i18n.js"></script>
<script src="../series.js" data-part="5"></script>
<script src="../print-qr.js"></script>
<script src="../zygalski-sheets/engine.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = 'enigma1932.pages2';   // .pages held the 7-page set
  const PRESETS = { kid: [1, 2, 3, 4, 5, 6, 7], cut: [4, 5, 6], key: [8], all: [1, 2, 3, 4, 5, 6, 7, 8] };
  const UI = {};
  for (const l of Object.keys(E32.TEXT)) UI[l] = E32.TEXT[l].ui;
  const t = (k, ...a) => I18N.t(UI, k, ...a);
  let pages = E32.DEFAULT_PAGES.slice();

  function save() { try { localStorage.setItem(STORE, E32.formatPages(pages)); } catch (_) { } }
  function load() {
    const q = new URLSearchParams(location.search).get('pages');
    if (q !== null) return E32.parsePages(q);
    try { const s = localStorage.getItem(STORE); if (s) return E32.parsePages(s); } catch (_) { }
    return E32.DEFAULT_PAGES.slice();
  }
  /** Keep ?pages= in the address in step with the choice. */
  function syncUrl() {
    const u = new URL(location.href);
    u.searchParams.set('pages', E32.formatPages(pages));
    history.replaceState(null, '', u);
  }

  function renderChecks() {
    const box = $('pageChecks');
    box.textContent = '';
    t('pageTitles').forEach((title, i) => {
      const n = i + 1, lab = document.createElement('label'), cb = document.createElement('input'), b = document.createElement('b'), s = document.createElement('span');
      lab.className = 'check';
      cb.type = 'checkbox'; cb.value = n; cb.checked = pages.includes(n);
      cb.addEventListener('change', () => {
        pages = [...box.querySelectorAll('input:checked')].map(x => +x.value);
        markPreset(); save(); syncUrl(); render();
      });
      b.textContent = n; s.textContent = title;
      lab.append(cb, b, s);
      box.appendChild(lab);
    });
  }
  function markPreset() {
    const key = E32.formatPages(pages);
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('active', E32.formatPages(PRESETS[b.dataset.preset]) === key));
  }

  /** Scale every A4 page to the width of the column (the print layout is not scaled). */
  const frames = [];
  function fitFrames() {
    const w = $('out').clientWidth;
    for (const f of frames) {
      const pg = f.firstChild, pw = pg.offsetWidth, ph = pg.offsetHeight, s = Math.min(1, w / pw);
      pg.style.transform = s < 1 ? `scale(${s})` : '';
      f.style.width = pw * s + 'px'; f.style.height = ph * s + 'px';
    }
  }

  function render() {
    const lang = I18N.get(), out = $('out'), msg = $('msg');
    out.textContent = ''; frames.length = 0;
    msg.className = 'msg';
    if (!pages.length) { msg.className = 'msg error'; msg.textContent = t('nonePicked'); return; }
    for (const n of pages) {
      const f = document.createElement('div');
      f.className = 'ams-frame';
      f.appendChild(E32.renderPage(n, lang));
      PRINTQR.stamp(f);   // before fitting, so the text is fitted around the QR code
      out.appendChild(f);
      frames.push(f);
    }
    frames.forEach(f => E32.fitPage(f.firstChild));
    fitFrames();
    msg.textContent = t('selected', pages.length, E32.TOTAL);
    document.title = t('docTitle');
  }

  function wire() {
    document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => {
      pages = PRESETS[b.dataset.preset].slice();
      renderChecks(); markPreset(); save(); syncUrl(); render();
    }));
    $('printBtn').addEventListener('click', () => window.print());
    I18N.onChange(() => { I18N.apply(UI); renderChecks(); render(); });
    PRINTQR.onChange(render);   // the code shown or hidden: fit the text again
    if (window.ResizeObserver) new ResizeObserver(fitFrames).observe($('out'));
    else window.addEventListener('resize', fitFrames);
  }

  pages = load();
  I18N.apply(UI);
  renderChecks();
  markPreset();
  wire();
  render();
  // fonts can change text widths after the first layout: fit again once they are ready
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { frames.forEach(f => E32.fitPage(f.firstChild)); fitFrames(); });
})();
</script>
</body>
</html>
