<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Płachty Zygalskiego — karta pracy</title>
<meta name="description" content="Karta pracy A4 do druku: płachty Zygalskiego — nakładaj płachty z dziurkami i znajdź jedyne pole, przez które przechodzi światło. Z rozwiązaniami.">
<link rel="stylesheet" href="../sheet-kit/kit.css">
<style>
  .story{font-size:12px;color:#333;margin:0 0 1.5mm;font-style:italic;}
  .instr{font-size:12.5px;margin-bottom:2.5mm;}
  .instr b{font-weight:700;}
  .round{border:0.3mm solid #ccc;border-radius:2mm;padding:1mm 3mm;margin:0 0 2mm;break-inside:avoid;page-break-inside:avoid;}
  .rhead{font-weight:800;font-size:13px;margin:0 0 1mm;}
  .stars{color:#d29a00;letter-spacing:1px;}
  .rbody{display:flex;align-items:center;gap:3mm;flex-wrap:wrap;}
  .sheets{display:grid;grid-template-columns:repeat(2,23mm);gap:1mm 3mm;}
  .sh .cap,.tbl .cap{font-size:9.5px;font-weight:600;color:#444;text-align:center;white-space:nowrap;}
  .sh .cap small{color:#c0252b;font-weight:800;}
  .arrow{font-size:26px;color:#999;}
  .ans{flex:1 1 30mm;font-size:12.5px;line-height:2.4;}
  .ans span{display:inline-block;border-bottom:0.3mm solid #333;width:16mm;margin-left:1mm;}
  .password{display:flex;align-items:center;gap:3mm;font-weight:800;font-size:15px;margin-top:2mm;}
  .cutgrid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;justify-items:center;}
  .keyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;text-align:center;font-size:12.5px;}
  .keyrow b{font-size:15px;}
  /* the "How did it work?" page */
  /* the worked example of the message page */
  .msgex p{font-size:11.5px;line-height:1.42;margin:0 0 2mm;}
  .msgex h3{font-size:13px;margin:3mm 0 1.5mm;}
  .wins{display:flex;flex-wrap:wrap;gap:2mm 3mm;align-items:flex-end;margin:0 0 2mm;}
  .wins .w{display:flex;flex-direction:column;align-items:center;gap:0.8mm;font-size:9.5px;color:#555;}
  .wins .w div{display:flex;gap:0.6mm;}
  .wins .w b{width:6mm;height:7mm;border:0.35mm solid #1E3A5F;border-radius:1mm;display:flex;align-items:center;justify-content:center;font:800 12px/1 ui-monospace,Menlo,Consolas,monospace;color:#222;background:#fff;}
  .wins .w b.r{border-color:#c0252b;background:#fdebe9;color:#c0252b;}
  .wins .go{color:#999;font-size:14px;padding-bottom:2mm;}
  .etab td.hit{background:#ffe36b !important;outline:0.6mm solid #c0252b;outline-offset:-0.6mm;font-weight:800;}
  .etab th.hit{background:#c0252b !important;}
  .etab td.hit sup{font-size:7px;color:#c0252b;margin-left:0.2mm;}
  .exlines{margin:1.5mm 0 2mm;padding-left:5mm;font-size:11.5px;line-height:1.45;}
  .exlines b{font-family:ui-monospace,Menlo,Consolas,monospace;}
  .mtab.filled tr.w td,.mtab.filled tr.p td{color:#1f5fbf;font-weight:800;font-size:14px;}
  .exres{font-size:14px !important;font-weight:800;}
  .extip{border:0.3mm solid #d29a00;background:#fff8dc;border-radius:2mm;padding:2mm 3mm;}
  /* the message page: a paper Enigma */
  .msgp .story{margin-bottom:1.5mm;font-size:11px;}
  .mtab{border-collapse:collapse;margin:1mm 0 2.5mm;font:12px/1.1 ui-monospace,Menlo,Consolas,monospace;}
  .mtab th{font:600 9px/1.1 system-ui,sans-serif;color:#555;text-align:right;padding:0 1.5mm 0 0;white-space:nowrap;}
  .mtab td{width:8.4mm;text-align:center;border:0.3mm solid #999;}
  .mtab tr.n td{border:0;color:#888;font-size:9px;height:3.5mm;}
  .mtab tr.c td{font-weight:800;font-size:14px;height:7mm;background:#fff8dc;}
  .mtab tr.w td{height:6mm;}
  .mtab tr.p td{height:7mm;}
  .msteps{margin:0 0 1.5mm;padding-left:5mm;font-size:11px;line-height:1.33;}
  .msteps li{margin:0 0 0.8mm;}
  .msteps .blank{display:inline-block;width:9mm;border-bottom:0.3mm solid #333;margin:0 1mm;}
  .etitle{font-weight:800;font-size:12px;margin:0 0 1mm;}
  .etab{border-collapse:collapse;width:100%;font:10.5px/1 ui-monospace,Menlo,Consolas,monospace;table-layout:fixed;}
  .etab th,.etab td{border:0.25mm solid #aaa;text-align:center;height:4.75mm;padding:0;}
  .etab tr:first-child th{background:#1E3A5F;color:#fff;font-weight:800;}
  .etab th:first-child{width:11mm;background:#f1f1f1;color:#1E3A5F;font-weight:800;font-size:11px;}
  .etab tr:first-child th:first-child{background:#f1f1f1;color:#555;font:600 8.5px/1.1 system-ui,sans-serif;}
  .etab tr:nth-child(2n+1) td{background:#f3f6fb;}
  .etab td:nth-child(5n+6){border-right:0.5mm solid #777;}
  .gloss{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6mm 4mm;font-size:10.5px;margin:1mm 0 2mm;}
  .gloss b{font-family:ui-monospace,Menlo,Consolas,monospace;}
  .mline{font-size:12px;display:flex;gap:2mm;align-items:baseline;margin:0 0 2mm;}
  .mline span{flex:1;border-bottom:0.3mm solid #333;height:5mm;}
  .mnote{font-size:10px;color:#555;margin:0;}
  .learn{font-size:11.5px;line-height:1.42;color:#222;}
  .learn h3{font-size:13.5px;margin:0 0 0.8mm;}
  .learn p{margin:0;}
  .step{display:grid;grid-template-columns:7mm 1fr 50mm;gap:1.5mm 4mm;align-items:center;padding:2mm 0;border-top:0.3mm solid #ddd;}
  .step .num{align-self:start;width:6.5mm;height:6.5mm;border-radius:50%;background:#4f5bd5;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .step .pic{text-align:center;}
  .step .pic svg{display:block;margin:0 auto;}
  .step.ex{background:#fff8dc;border:0.3mm solid #d29a00;border-radius:2mm;padding:1.6mm 2.5mm;margin-top:1mm;}
  .step.ex .body{grid-column:2 / 4;}
  .excols{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:4mm 0 3mm;}
  .excol{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;gap:1mm;}
  .excol .cap{font-weight:700;font-size:12px;}
  .excol .go{color:#999;font-size:18px;line-height:1;}
  .expage .step.ex{font-size:12.5px;line-height:1.4;padding:3mm 4mm;}
  .exans{font-weight:800;font-size:14px;margin-top:2mm !important;}
  .exshift{font-size:11.5px;color:#555;margin-top:2mm !important;}
  .piccap{font-size:9px;line-height:1.25;color:#444;margin-top:0.6mm;}
  .tltitle{font-size:12.5px;margin:2.5mm 0 1mm;}
  .timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm;font-size:10px;line-height:1.3;}
  .timeline div{border-top:0.8mm solid #4f5bd5;padding-top:1mm;}
  .timeline b{display:block;font-size:10.5px;}
  /* the real sheet page */
  .orig p{font-size:11.5px;line-height:1.42;margin:0 0 2mm;}
  .orig .realsheet{text-align:center;margin:1mm 0 2mm;}
  .orig .note{font-size:10px;color:#666;}
  @media (max-width:600px){
    .arrow{display:none;}
    .step{grid-template-columns:7mm 1fr;} .step .pic,.step.ex .body{grid-column:2;}
    .excols,.timeline{grid-template-columns:1fr;}
    .gloss{grid-template-columns:1fr 1fr;} .mwrap,.ewrap{overflow-x:auto;} .etab{min-width:560px;}
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🔦 Płachty Zygalskiego — karta pracy</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false"></form>
  <div class="stage"><div id="out"></div></div>
</div>

<script src="../i18n.js"></script>
<script src="../print-qr.js"></script>
<script src="../sheet-kit/kit.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const STARS = { easy: '★', medium: '★★', hard: '★★★' };
  /** The three rounds of a page. */
  const PLAN = {
    mix: ['easy', 'medium', 'hard'],
    easy: ['easy', 'easy', 'easy'],
    medium: ['medium', 'medium', 'medium'],
    hard: ['hard', 'hard', 'hard'],
  };
  /** A square's letters, as on Zygalski's sheets: the row is the middle rotor, the column the right rotor. */
  const L = i => String.fromCharCode(65 + i);
  const pair = (c, n) => ({ middle: L(Math.floor(c / n)), right: L(c % n) });
  const setting = (C, c, n) => { const p = pair(c, n); return `${C.middle} ${p.middle} · ${C.right} ${p.right}`; };

  /**
   * Side view of the light table: a lamp, three sheets, the light going up only where holes line up.
   * Holes (columns 0…9) from the bottom sheet up; only column 4 is a hole in all three.
   */
  function diagram(D) {
    const HOLES = [[1, 3, 4, 6, 8], [1, 4, 5, 8], [2, 4, 7]], Y = [62, 46, 30], X0 = 3, CW = 7, COLS = 10, TH = 3;
    const light = 'fill="#ffd23f" opacity="0.75"';
    let s = `<svg viewBox="0 0 100 92" style="width:100%;max-width:64mm" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">`;
    s += `<rect x="${X0}" y="${Y[0] + TH}" width="${CW * COLS}" height="${80 - Y[0] - TH}" ${light}/>`;
    let open = HOLES[0];
    for (let i = 0; i < 3; i++) {
      const y = Y[i];
      for (let c = 0; c < COLS; c++) if (!HOLES[i].includes(c)) s += `<rect x="${X0 + c * CW}" y="${y}" width="${CW}" height="${TH}" fill="#444"/>`;
      if (i > 0) open = open.filter(c => HOLES[i].includes(c));
      const top = i < 2 ? Y[i + 1] + TH : 12;
      for (const c of open) s += `<rect x="${X0 + c * CW + 1}" y="${top}" width="${CW - 2}" height="${y - top}" ${light}/>`;
      s += `<text x="${X0 + CW * COLS + 3}" y="${y + 2.4}" font-size="4.6">${KIT.esc(D.sheet(i + 1))}</text>`;
    }
    const cx = X0 + 4 * CW + CW / 2;
    s += `<text x="${cx}" y="7" font-size="5" font-weight="800" text-anchor="middle">★ ${KIT.esc(D.here)}</text>`;
    s += `<rect x="${X0}" y="80" width="${CW * COLS}" height="6" rx="1.5" fill="#f2b705" stroke="#8a6a00" stroke-width="0.4"/>`;
    s += `<text x="${X0 + CW * COLS + 3}" y="84.6" font-size="4.6">💡 ${KIT.esc(D.lamp)}</text>`;
    return s + '</svg>';
  }

  const FONT = 'font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"';

  /** Step 1: a page of the secret key list — rotor order, rings and plugs for each day of the month. */
  function keyTablePic(K) {
    const COLS = [3, 17, 41, 66], ROWS = [['16', 'I III II', 'E R B', 'AQ CT HN …'], ['17', 'II I III', 'K D P', 'BL DU FX …'], ['18', 'III II I', 'M A W', 'CJ EZ GS …']];
    const t = (x, y, txt, more = '') => `<text x="${x}" y="${y}" dominant-baseline="central" ${more}>${KIT.esc(txt)}</text>`;
    let s = `<svg viewBox="0 0 100 44" style="width:50mm;max-width:100%" xmlns="http://www.w3.org/2000/svg" ${FONT}>`;
    s += `<rect x="0.5" y="0.5" width="99" height="43" rx="2" fill="#fafafa" stroke="#333" stroke-width="0.6"/>`;
    s += t(50, 6, '🔒 ' + K.title, 'font-size="5.2" font-weight="800" text-anchor="middle"');
    [K.day, K.rotors, K.rings, K.plugs].forEach((h, i) => { s += t(COLS[i], 14, h, 'font-size="3.8" fill="#666"'); });
    s += `<path d="M2 17.5H98" stroke="#999" stroke-width="0.4"/><rect x="1.5" y="25.5" width="97" height="8" fill="#ffe36b"/>`;
    ROWS.forEach((r, j) => r.forEach((v, i) => { s += t(COLS[i], 21.5 + j * 8, v, `font-size="4.4" font-weight="${j === 1 ? 800 : 500}"`); }));
    return s + '</svg>';
  }

  /** Step 2: how an intercepted message starts — the open start letters, the doubled key enciphered, the text. */
  function msgPic(M) {
    const groups = [['RTJ', 1, '#e9e9e9', M.open, ''], ['WAHWIK', 25, '#fff8dc', M.key, 'ABC ABC'], ['PSQ…', 71, '#fff', M.text, '']];
    let s = `<svg viewBox="0 0 100 34" style="width:50mm;max-width:100%" xmlns="http://www.w3.org/2000/svg" ${FONT}>`;
    s += `<text x="0.5" y="3.5" font-size="4.8" font-weight="800" dominant-baseline="central">${KIT.esc(M.title)}</text>`;
    for (const [word, x0, fill, label, sub] of groups) {
      [...word].forEach((ch, i) => {
        s += `<rect x="${x0 + i * 7}" y="8" width="6.4" height="9" rx="0.8" fill="${fill}" stroke="#333" stroke-width="0.45"/>`;
        s += `<text x="${x0 + i * 7 + 3.2}" y="12.7" font-size="5.6" font-weight="700" text-anchor="middle" dominant-baseline="central">${ch}</text>`;
      });
      const x1 = x0 + word.length * 7 - 0.6, mid = (x0 + x1) / 2;
      s += `<path d="M${x0} 19.5V21H${x1}V19.5" fill="none" stroke="#777" stroke-width="0.45"/>`;
      s += `<text x="${mid}" y="25" font-size="4.3" font-weight="700" text-anchor="middle" dominant-baseline="central">${KIT.esc(label)}</text>`;
      if (sub) s += `<text x="${mid}" y="30.5" font-size="4" fill="#666" text-anchor="middle" dominant-baseline="central">= ${sub}</text>`;
    }
    return s + '</svg>';
  }

  /** Step 3: the key ABC ABC enciphered to WAH WIK, with the female W in places 1 and 4. */
  function femalePic(tag) {
    const x = i => 10 + i * 13 + (i >= 3 ? 3 : 0);
    const row = (word, y, hi) => [...word].map((ch, i) => `<rect x="${x(i)}" y="${y}" width="11" height="10" rx="1" fill="${hi && hi.includes(i) ? '#ffe36b' : '#fff'}" stroke="#333" stroke-width="0.5"/>`
      + `<text x="${x(i) + 5.5}" y="${y + 5.3}" font-size="6.5" font-weight="700" text-anchor="middle" dominant-baseline="central">${ch}</text>`).join('');
    let s = `<svg viewBox="0 0 100 54" style="width:44mm;max-width:100%" xmlns="http://www.w3.org/2000/svg" ${FONT}>`;
    s += row('ABCABC', 2, null) + `<text x="50" y="18" font-size="5" fill="#555" text-anchor="middle" dominant-baseline="central">↓ Enigma: RTJ ↓</text>` + row('WAHWIK', 24, [0, 3]);
    for (let i = 0; i < 6; i++) s += `<text x="${x(i) + 5.5}" y="38.5" font-size="4.2" fill="#777" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`;
    const a = x(0) + 5.5, b = x(3) + 5.5;
    s += `<path d="M${a} 42 Q${(a + b) / 2} 53 ${b} 42" fill="none" stroke="#c0252b" stroke-width="0.9"/>`;
    return s + `<text x="${b + 6}" y="48" font-size="5.6" font-weight="800" fill="#c0252b" dominant-baseline="central">${KIT.esc(tag)}</text></svg>`;
  }

  /**
   * A small n × n grid with letters A… along the sides. o: { w (mm), holes (sheet holes, big black dots), dots (dots on the
   * light table), gone (dots crossed out before, grey), crossed (dots crossed out now, red X), lit (the one square left),
   * top/left (axis captions, as on a real sheet) }.
   */
  function mini(n, o) {
    const C = 10, lab = o.top ? 7 : 0, x0 = lab + 6, y0 = lab + 6, has = (k, c) => o[k] && o[k].has(c);
    let s = `<svg viewBox="0 0 ${x0 + n * C + 0.6} ${y0 + n * C + 0.6}" style="width:${o.w}mm;max-width:100%" xmlns="http://www.w3.org/2000/svg" ${FONT}>`;
    if (o.top) {
      s += `<text x="${x0}" y="3.5" font-size="4.6" font-weight="700" fill="#444" dominant-baseline="central">${KIT.esc(o.top)}</text>`;
      s += `<text transform="translate(3.5 ${y0}) rotate(90)" font-size="4.6" font-weight="700" fill="#444" dominant-baseline="central">${KIT.esc(o.left)}</text>`;
    }
    for (let i = 0; i < n; i++) {
      s += `<text x="${x0 + i * C + C / 2}" y="${y0 - 3}" font-size="3.8" fill="#777" text-anchor="middle" dominant-baseline="central">${L(i)}</text>`;
      s += `<text x="${x0 - 3}" y="${y0 + i * C + C / 2}" font-size="3.8" fill="#777" text-anchor="middle" dominant-baseline="central">${L(i)}</text>`;
    }
    const X = (x, y, color) => `<path d="M${x + 2} ${y + 2}L${x + 8} ${y + 8}M${x + 8} ${y + 2}L${x + 2} ${y + 8}" stroke="${color}" stroke-width="1.1" stroke-linecap="round"/>`;
    for (let c = 0; c < n * n; c++) {
      const x = x0 + (c % n) * C, y = y0 + Math.floor(c / n) * C;
      s += `<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="${c === o.lit ? '#ffe36b' : '#fff'}" stroke="#999" stroke-width="0.25"/>`;
      if (has('holes', c)) s += `<circle cx="${x + 5}" cy="${y + 5}" r="3.1" fill="#222"/>`;
      if (has('dots', c) || has('crossed', c)) s += `<circle cx="${x + 5}" cy="${y + 5}" r="2" fill="#222"/>`;
      if (has('gone', c)) s += `<circle cx="${x + 5}" cy="${y + 5}" r="2" fill="#c4c4c4"/>${X(x, y, '#c4c4c4')}`;
      if (has('crossed', c)) s += X(x, y, '#c0252b');
    }
    return s + `<rect x="${x0}" y="${y0}" width="${n * C}" height="${n * C}" fill="none" stroke="#222" stroke-width="0.7"/></svg>`;
  }

  /** The worked example: three 4 × 4 sheets whose holes meet only in row B, column C. */
  const EX = { n: 4, sheets: [[1, 4, 6, 9, 11, 15], [1, 6, 8, 11, 13], [3, 6, 9, 13, 15]].map(h => new Set(h)) };

  /** Step 6, a page of its own: solve one round step by step — each sheet above the light table as it looks after that sheet. */
  function examplePage(api) {
    const { C, esc } = api, X = C.learn, { n, sheets } = EX;
    let left = new Set(sheets[0]), gone = new Set();
    const cols = sheets.map((sh, i) => {
      let state;
      if (i === 0) state = { dots: left };
      else {
        const crossed = new Set([...left].filter(c => !sh.has(c)));
        left = new Set([...left].filter(c => sh.has(c)));
        state = { dots: left, crossed, gone: new Set(gone) };
        crossed.forEach(c => gone.add(c));
      }
      if (i === sheets.length - 1) state.lit = [...left][0];
      return `<div class="excol">
        <div class="cap">${esc(C.sheet(i + 1))}</div>${mini(n, { w: 30, holes: sh })}
        <div class="go">↓</div>
        <div class="cap">💡 ${esc(X.exTable(i + 1))}</div>${mini(n, { w: 38, ...state })}
        <p>${esc(X.exSteps[i])}</p>
      </div>`;
    }).join('');
    const ans = [...left][0];
    return `<div class="sheet learn expage">
      ${api.head(X.exTitle, X.title, false)}
      <div class="step ex"><div class="num">${X.steps.length + 1}</div><div class="body">
        <p>${esc(X.exIntro)}</p>
        <div class="excols">${cols}</div>
        <p class="exans">✅ ${esc(X.exAnswer(L(Math.floor(ans / n)), L(ans % n)))}</p>
        <p class="exshift">${esc(X.exShift)}</p>
      </div></div>
    </div>`;
  }

  /** The "How did it work?" page: five numbered steps with a picture each (daily key, message key, female, sheet, light table), then the worked example on a page of its own. */
  function learnPage(api) {
    const { C, esc } = api, X = C.learn;
    const SHEET = new Set([1, 3, 4, 8, 10, 13, 17, 18, 20, 23, 26, 29, 31, 34]);
    const pics = [
      keyTablePic(X.keyTable),
      msgPic(X.msgHead),
      femalePic(X.female),
      // one sheet = one rotor order and one left rotor position; a square = the middle (row) and right (column) rotor
      mini(6, { w: 34, holes: SHEET, lit: 17, top: C.orig.axisRight, left: C.orig.axisMiddle })
        + `<div class="piccap">${esc(C.orig.sub('I-II-III', 'K'))}<br><b>${esc(X.sheetCell('K', L(2), L(5)))}</b></div>`,
      diagram(X.diagram).replace('max-width:64mm', 'max-width:42mm'),
    ];
    const steps = X.steps.map(([h, p], i) => `<div class="step"><div class="num">${i + 1}</div>
      <div><h3>${esc(h)}</h3><p>${esc(p)}</p></div><div class="pic">${pics[i]}</div></div>`).join('');
    return `<div class="sheet learn">
      ${api.head(X.title, X.sub, false)}
      ${steps}
    </div>` + examplePage(api);
  }

  /** One real sheet of 1938, recomputed (a rotor order and a left rotor position picked by the sheet code), and what happened next. */
  function origPage(api) {
    const { C, esc } = api, O = C.orig, rnd = api.rnd('orig');
    const order = KIT.shuffle(rnd, ['I', 'II', 'III']), left = String.fromCharCode(65 + Math.floor(rnd() * 26));
    const sheet = ZYG.realSheet(order, left), holes = sheet.flat().filter(Boolean).length;
    return `<div class="sheet orig">
      ${api.head(O.title, O.sub(order.join('-'), left), false)}
      <p>${esc(O.intro)}</p>
      <div class="realsheet">${ZYG.realSvg(sheet, { w: 160, right: O.axisRight, middle: O.axisMiddle })}</div>
      <p>${esc(O.twice)} ${esc(O.count(holes, Math.round(100 * holes / 676)))}</p>
      <p class="note">${esc(O.note)}</p>
      <h3 class="tltitle">${esc(C.learn.timelineTitle)}</h3>
      <div class="timeline">${C.learn.timeline.map(([d, x]) => `<div><b>${esc(d)}</b>${esc(x)}</div>`).join('')}</div>
    </div>`;
  }

  /** The worked example before the message page: HALLO from middle B, right C, read letter by letter. */
  function msgExPage(api) {
    const { C, esc } = api, M = C.msg, X = M.ex, g = ZYG.paper('HALLO', 1, 2), cols = [...g.cipher];
    const plain = [...g.plain], rowL = i => L(g.rows[i].right);
    // the windows: at the start, then before each letter (the right one turns)
    const win = (label, r) => `<div class="w">${esc(label)}<div><b>${L(g.left)}</b><b>${L(g.middle)}</b><b class="r">${L(r)}</b></div></div>`;
    const wins = [win(X.before, g.right), ...plain.map((_, i) => win(X.letter(i + 1), g.rows[i].right))].join('<span class="go">→</span>');
    // the piece of the paper Enigma, each letter's square marked
    const used = new Set(cols);
    const head = `<tr><th>${esc(M.corner)}</th>${Array.from({ length: 26 }, (_, i) => `<th${used.has(L(i)) ? ' class="hit"' : ''}>${L(i)}</th>`).join('')}</tr>`;
    const body = g.rows.map((rw, i) => `<tr><th>${L(rw.right)}</th>${rw.swap.map((x, c) => L(c) === cols[i]
      ? `<td class="hit">${L(x)}<sup>${i + 1}</sup></td>` : `<td>${L(x)}</td>`).join('')}</tr>`).join('');
    const row = (cls, label, cells) => `<tr class="${cls}"><th>${esc(label)}</th>${cells.map(x => `<td>${x}</td>`).join('')}</tr>`;
    const box = `<table class="mtab filled">${row('n', M.num, cols.map((_, i) => i + 1))}${row('c', M.cipher, cols)}${row('w', M.row, cols.map((_, i) => rowL(i)))}${row('p', M.plain, plain)}</table>`;
    const lines = cols.map((c, i) => `<li>${esc(X.line(i + 1, c, rowL(i), plain[i]))}</li>`).join('');
    return `<div class="sheet msgex">
      ${api.head(X.title, X.sub, false)}
      <p>${esc(X.intro(L(g.middle), L(g.right)))}</p>
      <h3>📡 ${esc(M.box)}</h3>
      <table class="mtab">${row('n', M.num, cols.map((_, i) => i + 1))}${row('c', M.cipher, cols)}</table>
      <h3>${esc(X.turnTitle)}</h3>
      <div class="wins">${wins}</div>
      <p>${esc(X.turn(L(g.right), rowL(0)))}</p>
      <h3>${esc(X.readTitle)}</h3>
      <p class="etitle">⚙️ ${esc(X.table)}</p>
      <div class="ewrap"><table class="etab">${head}${body}</table></div>
      <ol class="exlines">${lines}</ol>
      ${box}
      <p class="exres">✅ ${esc(X.done(g.plain))} ${esc(X.meaning)}</p>
      <p class="extip">🔁 ${esc(X.same(cols[2], cols[3]))}<br>${esc(X.back(rowL(0), plain[0], cols[0]))}</p>
      <p class="exres">${esc(X.now)}</p>
    </div>`;
  }

  /** The message page: the last round's answer sets a paper Enigma (one row per right rotor position) that reads a German message. */
  function msgPage(api, g) {
    const { C, esc } = api, M = C.msg, cols = [...g.cipher];
    const row = (cls, label, cells) => `<tr class="${cls}"><th>${esc(label)}</th>${cells.map(x => `<td>${x}</td>`).join('')}</tr>`;
    const box = `<table class="mtab">${row('n', M.num, cols.map((_, i) => i + 1))}${row('c', M.cipher, cols)}${row('w', M.row, cols.map(() => ''))}${row('p', M.plain, cols.map(() => ''))}</table>`;
    const head = `<tr><th>${esc(M.corner)}</th>${Array.from({ length: 26 }, (_, i) => `<th>${L(i)}</th>`).join('')}</tr>`;
    const body = g.rows.map(rw => `<tr><th>${L(rw.right)}</th>${rw.swap.map(x => `<td>${L(x)}</td>`).join('')}</tr>`).join('');
    const steps = M.steps.map(x => `<li>${esc(x).replace(/_/g, '<span class="blank"></span>')}</li>`).join('');
    const gloss = Object.entries(M.words).map(([w, tr]) => `<span><b>${w}</b> — ${esc(tr)}</span>`).join('');
    return `<div class="sheet msgp">
      ${api.head(M.title, M.sub, true)}
      <p class="story">${esc(M.story)}</p>
      <h3 class="etitle">📡 ${esc(M.box)}</h3>
      <div class="mwrap">${box}</div>
      <ol class="msteps">${steps}</ol>
      <p class="etitle">⚙️ ${esc(M.table(L(g.left), L(g.middle)))}</p>
      <div class="ewrap"><table class="etab">${head}${body}</table></div>
      <p class="mnote">⚠️ ${esc(M.check)}</p>
      <h3 class="etitle" style="margin-top:2mm">${esc(M.gloss)}</h3>
      <div class="gloss">${gloss}</div>
      <p class="mline">${esc(M.translate)} <span></span></p>
      <p class="mnote">${esc(M.honest)}</p>
    </div>`;
  }

  KIT.app({
    store: 'zygalski.sheet2',
    text: ZYG_TEXT,
    groups: [{ id: 'level', values: Object.keys(PLAN), def: 'mix', label: (v, C) => C.levels[v] }],
    checks: [{ id: 'learn', def: true, label: 'optLearn' }, { id: 'msg', def: true, label: 'optMsg' }, { id: 'orig', def: true, label: 'optOrig' }, { id: 'cut', def: true, label: 'optCut' }],
    render(s, api) {
      const { t, C, esc } = api;
      const rounds = PLAN[s.level].map((lv, i) => ZYG.round(api.rnd(`${s.level}|${i}`), lv));
      const anyShift = rounds.some(r => r.shift);

      const roundHtml = (r, i) => {
        const sheetW = r.n === 4 ? 20 : 22, tableW = r.n === 4 ? 42 : 48;
        const sheets = r.sheets.map((sh, j) => {
          const cells = Array.from({ length: r.n * r.n }, (_, c) => ({ hole: sh.holes.has(c) }));
          const shift = r.shift ? ` <small>${esc(C.shift(sh.dx, sh.dy))}</small>` : '';
          return `<div class="sh"><div class="cap">${esc(C.sheet(j + 1))}${shift}</div>${ZYG.svg(r.n, cells, { w: sheetW, coords: true })}</div>`;
        }).join('');
        const table = ZYG.svg(r.n, Array.from({ length: r.n * r.n }, () => ({})), { w: tableW, coords: true });
        return `<div class="round">
          <div class="rhead">${esc(C.round(i + 1))} <span class="stars">${STARS[r.level]}</span></div>
          <div class="rbody">
            <div class="sheets">${sheets}</div>
            <div class="arrow">➜</div>
            <div class="tbl"><div class="cap">💡 ${esc(t('table'))}</div>${table}</div>
            <div class="ans">${esc(t('middle'))}<span></span><br>${esc(t('right'))}<span></span></div>
          </div>
        </div>`;
      };

      const sub = C.levels[s.level];
      let html = (s.learn ? learnPage(api) : '') + `<div class="sheet">
        ${api.head(t('sheetTitle'), sub, true)}
        <p class="story">${esc(t('story'))}</p>
        <p class="instr">${esc(t('instr'))}${anyShift ? `<br><b>${esc(t('instrShift'))}</b>` : ''}</p>
        ${rounds.map(roundHtml).join('')}
      </div>`;

      // the message: read with the last round's answer
      const last = rounds[rounds.length - 1], msg = s.msg ? ZYG.message(api.rnd('msg'), last.n, last.answer) : null;
      if (msg) html += msgExPage(api) + msgPage(api, msg);

      let cut = null;
      if (s.cut) {
        cut = ZYG.cutRound(api.rnd('cut'));
        const labels = Array.from({ length: cut.n * cut.n }, (_, c) => { const p = pair(c, cut.n); return p.middle + p.right; });
        const board = ZYG.svg(cut.n, labels.map(text => ({ text })), { w: 82, top: t('cutBoard'), cut: true });
        const sheets = cut.sheets.map((sh, j) => ZYG.svg(cut.n, Array.from({ length: cut.n * cut.n }, (_, c) => ({ hole: sh.holes.has(c) })),
          { w: 82, top: C.cutSheet(j + 1), cut: true }));
        html += `<div class="sheet">
          ${api.head(t('cutTitle'), t('sheetTitle'), false)}
          <p class="instr">✂️ ${esc(t('cutInstr'))}</p>
          <div class="cutgrid">${[board, ...sheets].map(x => `<div>${x}</div>`).join('')}</div>
        </div>`;
      }

      if (s.key) {
        const keys = rounds.map((r, i) => {
          const cells = Array.from({ length: r.n * r.n }, (_, c) => ({ hi: c === r.answer }));
          return `<div>${esc(C.round(i + 1))}<br>${ZYG.svg(r.n, cells, { w: 50, coords: true })}<br><b>${esc(setting(C, r.answer, r.n))}</b></div>`;
        }).join('');
        html += `<div class="sheet key">
          ${api.head(t('keyTitle'), `${t('sheetTitle')} · ${sub}`, false)}
          <div class="keyrow">${keys}</div>
          ${cut ? `<p class="password">${esc(t('keyCut'))} ${esc(setting(C, cut.answer, cut.n))}</p>` : ''}
          ${msg ? `<p class="password">📻 ${esc(C.msg.key(L(msg.right + 1), msg.plain.replace(/X/g, ' '), C.msg.meanings[msg.plain]))}</p>` : ''}
        </div>`;
      }
      if (s.orig) html += origPage(api);   // the real sheet comes last, after the answers
      return { html, tasks: rounds.length + (cut ? 1 : 0) + (msg ? 1 : 0), pages: 1 + (s.learn ? 2 : 0) + (msg ? 2 : 0) + (s.orig ? 1 : 0) + (cut ? 1 : 0) + (s.key ? 1 : 0) };
    },
  });
})();
</script>
</body>
</html>
