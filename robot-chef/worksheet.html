<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot-kucharz — karty pracy</title>
<meta name="description" content="Karty pracy A4 do druku: wstęp do sztucznej inteligencji i algebry liniowej dla dzieci 8–12 lat. Siedem rozdziałów z rozwiązaniami.">
<style>
  :root{
    --ink:#1b1b1f; --muted:#666; --line:#2a2a2e; --accent:#4f5bd5; --accent-d:#3d48b8;
    --bg:#eef1f6; --panel:#ffffff; --soft:#f3f5f9; --err:#c0252b; --radius:10px; --ans:#c0252b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none !important}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;}
  button{font:inherit;}
  .appbar{padding:12px 18px;background:var(--panel);border-bottom:1px solid #e2e6ee;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .appbar .grow{flex:1 1 auto;}
  .appbar h1{margin:0;font-size:18px;}
  .appbar p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .navlink{display:inline-flex;align-items:center;min-height:40px;font-weight:600;font-size:14px;color:var(--accent-d);text-decoration:none;border:1px solid #ccd2dd;border-radius:999px;padding:6px 12px;background:var(--soft);white-space:nowrap;}
  .navlink:hover{border-color:var(--accent);}
  .wrap{display:flex;gap:18px;align-items:flex-start;padding:18px;max-width:1200px;margin:0 auto;}
  @media (max-width:880px){ .wrap{flex-direction:column;align-items:stretch;} .stage{width:100%;} }

  /* ---- controls ---- */
  .controls{flex:0 0 290px;background:var(--panel);border:1px solid #e2e6ee;border-radius:var(--radius);padding:14px;position:sticky;top:14px;}
  @media (max-width:880px){ .controls{position:static;flex-basis:auto;width:100%;} }
  .controls h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;}
  .grp{margin-bottom:14px;}
  .row{display:flex;gap:8px;align-items:center;}
  input[type=text]{font:inherit;padding:7px 8px;border:1px solid #ccd2dd;border-radius:8px;background:#fff;width:100%;}
  #randSeed{flex:0 0 auto;width:auto;min-height:40px;padding:7px 12px;border:1px solid #ccd2dd;border-radius:8px;background:var(--soft);cursor:pointer;font-size:15px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .presets button{font-size:12.5px;min-height:38px;padding:6px 12px;border:1px solid #ccd2dd;background:var(--soft);border-radius:999px;cursor:pointer;text-align:left;}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .presets button:hover{border-color:var(--accent);}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:6px 0;min-height:32px;}
  .check input{width:18px;height:18px;flex:0 0 auto;}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  button.primary{font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;min-height:44px;}
  button.primary:hover{background:var(--accent-d);}
  button.ghost{padding:9px;border:1px solid #ccd2dd;border-radius:9px;background:#fff;cursor:pointer;min-height:44px;}
  button.ghost:hover{border-color:var(--accent);}
  .msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--muted);}
  .msg.error{color:var(--err);font-weight:600;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---- sheets (A4: 210 × 297 mm, 12 mm margins ⇒ 186 × 273 mm) ---- */
  .stage{flex:1;min-width:0;}
  .sheet{background:#fff;border:1px solid #e2e6ee;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.07);padding:12mm;margin:0 auto 18px;width:210mm;max-width:100%;color:#111;font-size:3.6mm;line-height:1.35;}
  .sheet p{margin:0;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid var(--line);padding-bottom:2mm;margin-bottom:3mm;}
  .kicker{font-size:3mm;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);}
  .title{font-size:5.6mm;font-weight:800;line-height:1.15;}
  .subtitle{font-size:3.3mm;color:var(--muted);}
  .seedlabel{font:3mm ui-monospace,Menlo,Consolas,monospace;color:#888;margin-top:1mm;}
  .namebox{flex:0 0 56mm;border:1px solid #bbb;border-radius:6px;padding:1.5mm 3mm;font-size:3.2mm;color:#555;line-height:2.1;}
  .lesson{border:0.4mm solid #e8cf83;background:#fffaf0;border-radius:2.5mm;padding:2mm 3mm;margin-bottom:3mm;font-size:3.3mm;display:flex;flex-direction:column;gap:1mm;}
  .task{margin:0 0 3mm;}
  .task h3{margin:0 0 1.5mm;font-size:4mm;display:flex;gap:2mm;align-items:baseline;}
  .task h3 .n{display:inline-flex;width:5.6mm;height:5.6mm;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:3.3mm;flex:none;}
  .fx{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;white-space:nowrap;}
  .ans{color:var(--ans);font-weight:800;}

  .gbox{border:0.4mm solid #999;border-radius:2.5mm;padding:2mm 3mm;display:inline-flex;flex-direction:column;gap:0.8mm;min-width:58mm;vertical-align:top;background:#fff;}
  .gbox .gh{display:flex;align-items:center;gap:2mm;font-weight:800;font-size:3.8mm;}
  .gbox .gh .ge{font-size:7mm;line-height:1;}
  .gbox .wr{display:flex;align-items:center;gap:2mm;font-size:3.4mm;}
  .gbox .wr .e{font-size:5mm;width:6.5mm;text-align:center;}
  .gbox .wr .nm{flex:1;color:#555;}
  .gbox .wr b{white-space:nowrap;}
  .gbox .thr{border-top:0.3mm solid #ccc;padding-top:1mm;font-size:3.2mm;}
  .gbox.wide{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:1mm 6mm;width:100%;margin-bottom:2.5mm;}
  .gbox.wide .thr{border-top:0;padding-top:0;flex-basis:100%;}
  .gbox.robot{border-color:var(--accent);background:#f6f7ff;}
  .side{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4mm;align-items:start;}

  .plate{display:inline-flex;align-items:center;justify-content:center;gap:1.8mm;min-width:22mm;min-height:11mm;padding:1.2mm 3.5mm;border:0.4mm solid #9aa3b8;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.2mm #f1f4fa;}
  .plate .grp{display:inline-flex;gap:0.3mm;margin:0;}
  .plate .pi{font-size:5.4mm;line-height:1;}
  .plate.circ{outline:0.7mm solid var(--ans);outline-offset:1mm;}
  .tag{font-weight:800;font-size:3.8mm;min-width:4mm;display:inline-block;}
  .blank{display:inline-block;border-bottom:0.3mm solid #333;min-height:6mm;vertical-align:bottom;text-align:center;padding:0 1mm;}
  .fcs{display:inline-flex;gap:3mm;font-size:5.2mm;line-height:1;white-space:nowrap;}
  .fcs span{display:inline-flex;flex:none;align-items:center;justify-content:center;width:8mm;height:8mm;border-radius:50%;}
  .fcs span.circ{box-shadow:0 0 0 0.6mm var(--ans);}
  .dishgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 6mm;}
  .dish{display:flex;align-items:center;gap:2.5mm;border:0.3mm solid #e1e5ee;border-radius:2.5mm;padding:1.8mm 2.5mm;}
  .dish .grow{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:3mm;white-space:nowrap;}
  .dishgrid.one{grid-template-columns:1fr;gap:2mm;}
  .plates3{display:flex;gap:6mm;flex-wrap:wrap;align-items:flex-end;}
  .plates3 > div{display:flex;flex-direction:column;align-items:center;gap:1.5mm;}
  .detgrid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;}
  .det{border:0.3mm solid #e1e5ee;border-radius:2.5mm;padding:2mm 3mm;display:flex;flex-direction:column;gap:1.5mm;}
  .det .eqs{display:flex;flex-wrap:wrap;gap:1.5mm 4mm;font-size:4mm;}
  .det .eqs span{display:inline-flex;align-items:center;gap:1mm;}
  .det .eqs .e{font-size:5mm;}
  .rule{border:0.4mm solid var(--accent);background:#f6f7ff;border-radius:2.5mm;padding:1.5mm 3mm;font-size:3.3mm;display:flex;flex-direction:column;gap:0.5mm;margin-bottom:2mm;}
  .example{border:0.4mm dashed var(--accent);border-radius:2.5mm;padding:1.5mm 3mm 2mm;margin-bottom:2.5mm;font-size:3.2mm;}
  .example .ttl{font-weight:800;margin-bottom:1mm;}
  .example table.t{font-size:3.2mm;}
  .example .t td{height:auto;padding:0.5mm 1mm;color:#333;}
  .example .t .e{font-size:4mm;}
  .example .mk{color:var(--accent-d);font-weight:800;margin-left:1mm;}
  .example .legend{display:grid;grid-template-columns:1fr 1fr;gap:0.5mm 5mm;margin-top:1.5mm;}
  .nb{display:flex;gap:4mm;flex-wrap:wrap;margin-bottom:2mm;align-items:center;}
  .nb > span{display:inline-flex;align-items:center;gap:1.5mm;}
  .face{font-size:5mm;}
  table.t{border-collapse:collapse;width:100%;font-size:3.5mm;}
  .t th,.t td{border:0.3mm solid #888;padding:0.8mm 1.2mm;text-align:center;height:8.2mm;}
  .t th{background:#f1f3f8;font-size:3.1mm;height:auto;}
  .t td.l{text-align:left;}
  .t .e{font-size:4.6mm;}
  .t .pre{color:#444;}
  .t.tight td{height:7.4mm;}
  .maps{display:grid;grid-template-columns:84mm 1fr;gap:5mm;}
  .maps.small{grid-template-columns:78mm 1fr;}
  .net{max-width:108mm;margin:0 auto;}
  .t.short td{height:7mm;}
  .t td .plate{min-height:9mm;padding:0.8mm 3mm;}
  .t td .plate .pi{font-size:4.8mm;}
  .map svg,.net svg{display:block;width:100%;height:auto;}
  .quiz{margin:0;padding-left:5mm;display:flex;flex-direction:column;gap:1.5mm;font-size:3.3mm;}
  .quiz .opts{display:flex;flex-wrap:wrap;gap:0.3mm 5mm;margin-top:0.5mm;}
  .quiz .opts span{padding:0 1mm;border-radius:1mm;}
  .quiz .opts span.circ{outline:0.5mm solid var(--ans);}
  .teacher ol{margin:0;padding-left:5mm;display:flex;flex-direction:column;gap:2mm;font-size:3.7mm;}
  .note{font-size:3mm;color:#666;margin-top:1mm;}

  /* ---- phone ---- */
  @media (max-width:600px){
    .appbar{padding:12px 14px;}
    .wrap{padding:10px;gap:12px;}
    input[type=text]{font-size:16px;}
    .sheet{padding:14px 10px;font-size:13px;}
    .sheet-head{flex-wrap:wrap;gap:10px;}
    .namebox{flex:1 1 100%;}
    .dishgrid,.detgrid,.maps{grid-template-columns:1fr;}
    .side{grid-template-columns:1fr;}
    .sheet{overflow-x:auto;}
    .dish{flex-wrap:wrap;}
    .dish .grow{white-space:normal;flex-wrap:wrap;}
    .blank{max-width:40vw;}
    .maps.small{grid-template-columns:1fr;}
  }

  /* ---- print ---- */
  @media print{
    @page{ size:A4; margin:12mm; }
    body{background:#fff;}
    .appbar,.controls,.msg,.actions,.no-print{display:none !important;}
    .wrap{display:block;padding:0;margin:0;max-width:none;}
    .stage{width:100%;}
    .sheet{box-shadow:none;border:0;border-radius:0;margin:0;padding:0;width:auto;max-width:none;}
    .sheet + .sheet{page-break-before:always;break-before:page;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🤖 Robot-kucharz — karty pracy</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <a class="navlink" href="index.html" data-keep-lang data-i18n="playOnline">🎮 Graj online</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false">
    <div class="grp">
      <h2 data-i18n="seed">Kod karty</h2>
      <div class="row">
        <input type="text" id="seed" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:seed">
        <button type="button" id="randSeed" data-i18n-attr="title:randomSeed,aria-label:randomSeed">🎲</button>
      </div>
      <div class="hint" data-i18n="seedHint"></div>
    </div>
    <div class="grp">
      <h2 data-i18n="chapter">Rozdział</h2>
      <div class="presets" id="chapters"></div>
    </div>
    <div class="grp">
      <h2 data-i18n="options">Opcje</h2>
      <label class="check"><input type="checkbox" id="optKey" checked> <span data-i18n="optKey"></span></label>
      <label class="check"><input type="checkbox" id="optTeacher" checked> <span data-i18n="optTeacher"></span></label>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="newBtn" data-i18n="newWorksheet"></button>
      <button type="button" class="ghost" id="printBtn" data-i18n="print"></button>
    </div>
    <div class="msg" id="msg"></div>
  </form>

  <div class="stage">
    <div id="out"></div>
  </div>
</div>

<script src="../i18n.js"></script>
<script src="../print-qr.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const E = CHEF;
  const $ = id => document.getElementById(id);
  const esc = E.esc;
  const STORE = 'robotchef.sheet2';
  const UI = {};
  for (const l of Object.keys(CHEF_TEXT)) UI[l] = { ...CHEF_TEXT[l].common, ...CHEF_TEXT[l].game, ...CHEF_TEXT[l].sheet };
  const t = (k, ...a) => I18N.t(UI, k, ...a);
  /** Escaped text with **bold** and `formula`. */
  const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<span class="fx">$1</span>');
  const ingName = id => t('ingr')[id] || id;
  const em = id => E.ING[id].e;
  const fx = (w, x, plain) => E.formula(w, x, t('mul'), plain);
  const eqs = (w, x, plain) => { const f = fx(w, x, plain), v = E.score(w, x); return f === E.num(v) || f === E.term(v) || !f ? E.num(v) : `${f} = ${E.num(v)}`; };
  const tag = i => String.fromCharCode(65 + i);
  const CHOICES = ['all', ...E.CHAPTERS];
  let chapter = 'all';

  function randomSeed() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s + '-' + (100 + Math.floor(Math.random() * 900));
  }
  function readSettings() { return { seed: $('seed').value.trim() || 'SEED', chapter, key: $('optKey').checked, teacher: $('optTeacher').checked }; }
  function persist(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (_) { } }
  function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (!s) return false;
      $('seed').value = s.seed || randomSeed();
      if (CHOICES.includes(s.chapter)) chapter = s.chapter;
      $('optKey').checked = s.key !== false;
      $('optTeacher').checked = s.teacher !== false;
      return true;
    } catch (_) { return false; }
  }

  /* ---------- pieces ---------- */
  const blank = (ans, key, mm = 14) => `<span class="blank" style="min-width:${mm}mm">${key && ans !== '' && ans != null ? `<span class="ans">${esc(ans)}</span>` : ''}</span>`;
  const faces = (yes, key) => `<span class="fcs"><span class="${key && yes === true ? 'circ' : ''}">😋</span><span class="${key && yes === false ? 'circ' : ''}">🤢</span></span>`;
  function plate(g, x, cls = '') {
    const groups = g.ing.map((id, i) => x[i] ? `<span class="grp">${Array.from({ length: x[i] }, () => `<span class="pi">${em(id)}</span>`).join('')}</span>` : '').join('');
    return `<span class="plate ${cls}">${groups}</span>`;
  }
  /** The taste card. o: { hide, threshold, robot, w, sub, name } */
  function gbox(g, o = {}) {
    const w = o.w || g.w;
    const rows = g.ing.map((id, i) => `<div class="wr"><span class="e">${em(id)}</span><span class="nm">${esc(ingName(id))}</span><b>${o.hide ? blank(o.key ? E.signed(w[i]) : '', o.key, 12) : esc(t('ptsShort', E.signed(w[i])))}</b></div>`).join('');
    return `<div class="gbox ${o.robot ? 'robot' : ''} ${o.wide ? 'wide' : ''}"><div class="gh"><span class="ge">${o.robot ? '🤖' : g.e}</span><span>${esc(o.robot ? t('robotName') : t('guests')[g.id])}${o.sub ? ` <small style="font-weight:400;color:#666">· ${esc(o.sub)}</small>` : ''}</span></div>${rows}`
      + (o.threshold === false ? '' : `<div class="thr">${rich(o.robot ? t('robotThr') : t('threshold', E.num(g.t)))}</div>`) + '</div>';
  }
  function head(ch, s, key) {
    return `<div class="sheet-head"><div><div class="kicker">${esc(t('sheetKicker', ch))}${key ? ' · ' + esc(t('keyTitle')) : ''}</div><div class="title">${esc(t('chTitles')[ch - 1])}</div><div class="subtitle">${esc(t('chSubs')[ch - 1])} · ${esc(t('ages')[ch - 1])}</div><div class="seedlabel">${esc(t('seedLabel'))} ${esc(s.seed)}</div></div>`
      + (key ? '' : `<div class="namebox">${esc(t('name'))}<br>${esc(t('date'))}</div>`) + '</div>';
  }
  const lesson = ch => `<div class="lesson">${t('lessons')[ch - 1].map(p => `<p>${rich(p)}</p>`).join('')}</div>`;
  const task = (n, title, body) => `<div class="task"><h3><span class="n">${n}</span><span>${rich(title)}</span></h3>${body}</div>`;
  const mapLabels = () => ({ xLabel: t('axisSweet'), yLabel: t('axisSpicy') });
  const svgBox = (svg, cls = 'map') => `<div class="${cls}">${svg}</div>`;

  /** Chapter 4: a filled-in example of the training table (🍫 🧅 🧀, two steps), with ①–④ explained below it. */
  function example4() {
    const g = { ing: ['choc', 'onion', 'cheese'] }, cols = t('s4cols');
    const mk = n => `<span class="mk">${'①②③④'[n - 1]}</span>`;
    const r2 = x => `<th rowspan="2">${esc(x)}</th>`;
    const row = (n, x, w, pts, robot, guest, fix, m = {}) => `<tr><td>${n}</td><td class="e">${g.ing.filter((_, j) => x[j]).map(em).join(' ')}</td>`
      + w.map((v, j) => `<td>${v}${j === 0 && m.w ? mk(4) : ''}</td>`).join('')
      + `<td class="fx">${pts}${m.pts ? mk(1) : ''}</td><td class="e">${robot}${m.pts ? mk(2) : ''}</td><td class="e">${guest}</td><td>${fix}${m.pts ? mk(3) : ''}</td></tr>`;
    return `<div class="example"><p class="ttl">${esc(t('exSheetTitle'))}</p>`
      + `<table class="t"><thead><tr>${r2(cols.step)}${r2(cols.dish)}<th colspan="3">${esc(cols.weights)}</th>${r2(cols.pts)}${r2(cols.robot)}${r2(cols.guest)}${r2(cols.fix)}</tr>`
      + `<tr>${g.ing.map(id => `<th class="e">${em(id)}</th>`).join('')}</tr></thead><tbody>`
      + row(1, [1, 0, 1], [0, 0, 0], '0 + 0 = 0', '🤢', '😋', `${em('choc')}+1 ${em('cheese')}+1`, { pts: true })
      + row(2, [0, 1, 0], [1, 0, 1], '0', '🤢', '🤢', '—', { w: true })
      + `</tbody></table><div class="legend">${t('exLegend').map(x => `<p>${rich(x)}</p>`).join('')}</div></div>`;
  }

  /* ---------- the chapters: data ---------- */
  function data(ch, seed) {
    const rnd = E.rng(`${seed}|${ch}`);
    switch (ch) {
      case 1: return { a: E.count1(rnd, 6), b: E.best1(rnd) };
      case 2: return { a: E.count2(rnd, 6), b: E.cook2(rnd) };
      case 3: return { a: [E.detect3(rnd), E.detect3(rnd)], b: E.spoil3(rnd) };
      case 4: return E.train4(rnd, 3);
      case 5: return E.test5(rnd, 6);
      case 6: return { a: E.map6(rnd, 'full', 8), b: E.map6(rnd, 'full', 6) };
      case 7: return { a: E.xor7(rnd, 2), b: { pts: E.shuffle(rnd, E.xor7(rnd, 1).pts) } };
    }
    return null;
  }

  /* ---------- the chapters: pages ---------- */
  const PAGE = {
    1(d, key) {
      const g = d.a.g;
      const dishes = d.a.dishes.map((x, i) => `<div class="dish"><span class="tag">${tag(i)}</span>${plate(g, x)}<div class="grow"><span>${blank(key ? eqs(g.w, x) : '', key, 18)} ${esc(t('ptsUnit'))}</span>${faces(E.likes(g, x), key)}</div></div>`).join('');
      const b = d.b, bs = b.plates.map(x => E.score(b.g.w, x));
      const plates = b.plates.map((x, i) => `<div>${plate(b.g, x, key && i === b.best ? 'circ' : '')}<span>${blank(key ? eqs(b.g.w, x) : '', key, 22)} ${esc(t('ptsUnit'))}</span></div>`).join('');
      return task(1, t('s1A'), `${gbox(g, { wide: true })}<div class="dishgrid">${dishes}</div>`)
        + task(2, t('s1B'), `<div class="side">${gbox(b.g, { threshold: false })}<div class="plates3">${plates}</div></div>`)
        + (key ? `<p class="note">${esc(t('keyBest', E.num(bs[b.best])))}</p>` : '');
    },
    2(d, key) {
      const g = d.a.g;
      const dishes = d.a.dishes.map((x, i) => `<div class="dish"><span class="tag">${tag(i)}</span>${plate(g, x)}<div class="grow"><span>= ${blank(key ? eqs(g.w, x) : '', key, 60)} ${esc(t('ptsUnit'))}</span>${faces(E.likes(g, x), key)}</div></div>`).join('');
      const c = d.b, cg = c.g;
      // the answer key shows the dish with the fewest portions that works
      let sol = null;
      for (const x of E.dishes(4, c.max)) {
        if (x[c.must] !== 0) continue;
        const y = x.slice(); y[c.must] = c.mustN;
        if (E.sum(y) <= c.cap && E.likes(cg, y) && (!sol || E.sum(y) < E.sum(sol))) sol = y;
      }
      const rows = cg.ing.map((id, i) => `<span style="display:inline-flex;align-items:center;gap:1.5mm;font-size:4mm"><span style="font-size:5.4mm">${em(id)}</span> × ${i === c.must ? `<b>${c.mustN}</b> 🔒` : blank(key ? String(sol[i]) : '', key, 9)}</span>`).join('');
      return task(1, t('s2A'), `${gbox(g, { wide: true })}<div class="dishgrid one">${dishes}</div>`)
        + task(2, t('s2B', c.mustN, em(cg.ing[c.must]), E.num(cg.t), c.cap), `<div class="side">${gbox(cg)}<div style="display:flex;flex-direction:column;gap:3mm">
            <div style="display:flex;flex-wrap:wrap;gap:3mm 6mm">${rows}</div>
            <p>${esc(t('s2Bpts'))} ${blank(key ? eqs(cg.w, sol) : '', key, 40)} ${esc(t('ptsUnit'))} ${faces(key ? true : null, key)}</p>
            ${key ? `<p class="note">${esc(t('keyOneOf'))}</p>` : ''}</div></div>`);
    },
    3(d, key) {
      const det = d.a.map((P, k) => {
        const g = P.g;
        const ds = P.dishes.map((x, i) => `<div style="display:flex;align-items:center;gap:2mm">${plate(g, x)} <b>= ${esc(t('ptsShort', E.num(P.points[i])))}</b></div>`).join('');
        const eqs3 = g.ing.map((id, i) => `<span><span class="e">${em(id)}</span> = ${blank(key ? E.num(g.w[i]) : '', key, 11)}</span>`).join('');
        return `<div class="det"><div class="gbox" style="border:0;padding:0;min-width:0"><div class="gh"><span class="ge">${g.e}</span><span>${esc(t('guests')[g.id])}</span></div></div>${ds}<div class="eqs">${eqs3}</div></div>`;
      }).join('');
      const b = d.b, g = b.g;
      const ps = b.dishes.map((x, i) => `<span style="display:inline-flex;align-items:center;gap:1mm">${plate(g, x)}<span class="face">${b.likes[i] ? '😋' : '🤢'}</span></span>`).join('');
      const opts = g.ing.map((id, j) => `<span style="font-size:7mm;line-height:1;display:inline-flex;flex:none;width:11mm;height:11mm;align-items:center;justify-content:center;border-radius:50%;${key && j === b.spoiler ? 'box-shadow:0 0 0 0.7mm var(--ans)' : 'border:0.3mm dashed #999'}">${em(id)}</span>`).join(' ');
      return task(1, t('s3A'), `<div class="detgrid">${det}</div>${key ? '' : `<p class="note">${esc(t('detectHint'))}</p>`}`)
        + task(2, t('s3B'), `<p style="display:flex;align-items:center;gap:2mm;font-weight:800;margin-bottom:1.5mm"><span style="font-size:7mm">${g.e}</span>${esc(t('guests')[g.id])}</p><div class="nb">${ps}</div><p style="display:flex;flex-wrap:wrap;align-items:center;gap:2mm 4mm"><span>${esc(t('spoilQ'))}</span><span style="display:inline-flex;flex:none;gap:3mm">${opts}</span></p>`);
    },
    4(d, key) {
      const g = d.g, k = g.ing.length;
      const nb = d.dishes.map((x, i) => `<span><span class="tag">${tag(i)}</span>${plate(g, x)}<span class="face">${d.labels[i] ? '😋' : '🤢'}</span></span>`).join('');
      const rows = d.steps.map((st, n) => {
        const wcells = st.before.map(v => `<td>${n === 0 ? `<span class="pre">0</span>` : key ? `<span class="ans">${esc(E.num(v))}</span>` : ''}</td>`).join('');
        const fixTxt = st.robot === st.guest ? '—' : E.fix(st).map((v, j) => v ? `${em(g.ing[j])}${v > 0 ? '+1' : E.MINUS + '1'}` : '').filter(Boolean).join(' ');
        return `<tr><td>${n + 1}</td><td><b>${tag(st.i)}</b></td>${wcells}<td>${key ? `<span class="ans">${esc(E.num(st.sum))}</span>` : ''}</td><td>${key ? `<span class="ans">${st.robot ? '😋' : '🤢'}</span>` : ''}</td><td class="e">${st.guest ? '😋' : '🤢'}</td><td>${key ? `<span class="ans" style="font-size:3.2mm">${esc(fixTxt)}</span>` : ''}</td></tr>`;
      }).join('');
      const cols = t('s4cols');
      const r2 = x => `<th rowspan="2">${esc(x)}</th>`;
      const table = `<table class="t ${d.steps.length > 12 ? 'tight' : ''}"><thead><tr>${r2(cols.step)}${r2(cols.dish)}<th colspan="${k}">${esc(cols.weights)}</th>${r2(cols.pts)}${r2(cols.robot)}${r2(cols.guest)}${r2(cols.fix)}</tr>`
        + `<tr>${g.ing.map(id => `<th class="e">${em(id)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
      const end = g.ing.map((id, j) => `<span style="font-size:4mm">${em(id)} ${blank(key ? E.num(d.w[j]) : '', key, 10)}</span>`).join(' ');
      return `<div class="rule"><p>${rich(t('ruleTitle'))}</p><p>${rich(t('ruleUp'))}</p><p>${rich(t('ruleDown'))}</p><p>${rich(t('ruleSame'))}</p></div>`
        + (key ? '' : example4())
        + task(1, t('s4'), `<p style="margin-bottom:1mm">${esc(t('notebook'))}</p><div class="nb">${nb}</div>${table}<p style="margin-top:2mm;display:flex;gap:4mm;align-items:center;flex-wrap:wrap">${esc(t('s4end'))} ${end}</p>`)
        + (key ? `<p class="note">${esc(t('trainReveal', g.ing.map((id, j) => `${em(id)} ${E.signed(g.w[j])}`).join('  '), g.ing.map((id, j) => `${em(id)} ${E.signed(d.w[j])}`).join('  ')))}</p>` : '');
    },
    5(d, key) {
      const g = d.g, cols = t('s5cols');
      const tr = d.train.map((x, i) => `<span>${plate(g, x)}<span class="face">${d.trainLabels[i] ? '😋' : '🤢'}</span></span>`).join('');
      const rows = d.dishes.map((x, i) => {
        const pts = E.score(d.w, x), ok = d.robot[i] === d.truth[i];
        return `<tr><td><b>${tag(i)}</b></td><td class="l">${plate(g, x)}</td><td>${key ? `<span class="ans">${esc(eqs(d.w, x, true))}</span>` : ''}</td><td>${faces(d.robot[i], key)}</td><td class="e">${d.truth[i] ? '😋' : '🤢'}</td><td>${key ? `<span class="ans">${ok ? '✓' : '✗'}</span>` : '✓ / ✗'}</td></tr>`;
      }).join('');
      const quiz = t('quiz5').map(q => `<li><b>${rich(q.q)}</b><div class="opts">${q.opts.map((o, k) => `<span class="${key && k === q.ok ? 'circ' : ''}">${'abcd'[k]}) ${esc(o)}</span>`).join('')}</div></li>`).join('');
      return task(1, t('s5'), `<div class="side">${gbox(g, { robot: true, w: d.w, sub: t('robotTrained') })}<div><p style="margin-bottom:1.5mm">${esc(t('trainedOn'))}</p><div class="nb">${tr}</div></div></div>
          <table class="t" style="margin-top:2mm"><thead><tr><th></th><th>${esc(cols.dish)}</th><th>${esc(cols.pts)}</th><th>${esc(cols.robot)}</th><th>${esc(cols.guest)}</th><th>${esc(cols.ok)}</th></tr></thead><tbody>${rows}</tbody></table>
          <p style="margin-top:2mm">${esc(t('s5count', d.dishes.length))} ${key ? `<span class="ans">${d.right}</span>` : ''}</p>`)
        + task(2, t('s5quiz'), `<ol class="quiz">${quiz}</ol>`);
    },
    6(d, key) {
      const A = d.a, B = d.b;
      const mapA = E.mapSVG({ pts: A.pts, rule: key ? A.rule : null, mark: 'none', ...mapLabels() });
      const ptsB = B.pts.map((p, i) => ({ ...p, tag: tag(i) }));
      const mapB = E.mapSVG({ pts: ptsB, rule: key ? B.rule : null, mark: 'none', faces: false, ...mapLabels() });
      const r = B.rule, rule = `🍬${t('mul')}${E.term(r.a)} + 🌶️${t('mul')}${E.term(r.b)} ≥ ${E.num(r.t)}`;
      const cols = t('s6cols');
      const rows = ptsB.map((p, i) => {
        const s = r.a * p.x + r.b * p.y;
        return `<tr><td><b>${p.tag}</b></td><td>${p.x}</td><td>${p.y}</td><td>${key ? `<span class="ans">${esc(`${p.x}${t('mul')}${E.term(r.a)} + ${p.y}${t('mul')}${E.term(r.b)} = ${E.num(s)}`)}</span>` : ''}</td><td>${faces(s >= r.t, key)}</td></tr>`;
      }).join('');
      return task(1, t('s6A'), `<div class="maps">${svgBox(mapA)}<div style="display:flex;flex-direction:column;gap:2mm;justify-content:center"><p>${esc(t('s6Aq'))}</p><p>${esc(t('s6Arule'))}</p><p class="fx" style="font-size:4.2mm">🍬${esc(t('mul'))}${blank(key ? E.term(A.rule.a) : '', key, 9)} + 🌶️${esc(t('mul'))}${blank(key ? E.term(A.rule.b) : '', key, 9)} ≥ ${blank(key ? E.num(A.rule.t) : '', key, 9)}</p>${key ? `<p class="note">${esc(t('keyOneOf'))}</p>` : ''}</div></div>`)
        + task(2, t('s6B', rule), `<div class="maps">${svgBox(mapB)}<div><table class="t"><thead><tr><th>${esc(cols.dish)}</th><th>🍬</th><th>🌶️</th><th>${esc(cols.pts)}</th><th>${esc(cols.says)}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`);
    },
    7(d, key) {
      const mapA = E.mapSVG({ pts: d.a.pts, rule: null, mark: 'none', ...mapLabels() });
      const net = E.netSVG({ h1n: t('helper1'), h2n: t('helper2'), bossn: t('boss'), h1: '🍬 + 🌶️ ≥ 3', h2: '🍬 + 🌶️ ≥ 7', boss: `2${t('mul')}🤖1 − 3${t('mul')}🤖2 ≥ 1`, out: '😋 / 🤢' });
      const cols = t('s7cols');
      const rows = d.b.pts.map((p, i) => {
        const [h1, h2] = E.helpers(p), s = 2 * h1 - 3 * h2;
        const a = v => key ? `<span class="ans">${esc(String(v))}</span>` : '';
        return `<tr><td><b>${tag(i)}</b></td><td>${p.x}</td><td>${p.y}</td><td>${a(p.x + p.y)}</td><td>${a(h1)}</td><td>${a(h2)}</td><td>${a(E.num(s))}</td><td>${faces(s >= 1, key)}</td><td class="e">${p.yes ? '😋' : '🤢'}</td></tr>`;
      }).join('');
      return task(1, t('s7A'), `<div class="maps small">${svgBox(mapA)}<div style="display:flex;flex-direction:column;gap:3mm;justify-content:center"><p style="font-size:4.2mm"><b>${esc(t('s7Aq'))}</b></p><p class="fcs" style="font-size:4.2mm;gap:6mm"><span style="width:auto;padding:0 2mm" class="${key ? '' : ''}">${esc(t('yesWord'))}</span><span style="width:auto;padding:0 2mm" class="${key ? 'circ' : ''}">${esc(t('noWord'))}</span></p>${key ? `<p class="note">${esc(t('xorWhy'))}</p>` : ''}</div></div>`)
        + task(2, t('s7B'), `${svgBox(net, 'net')}<table class="t short" style="margin-top:2mm"><thead><tr><th>${esc(cols.dish)}</th><th>🍬</th><th>🌶️</th><th>🍬 + 🌶️</th><th>🤖1</th><th>🤖2</th><th>${esc(`2${t('mul')}🤖1 − 3${t('mul')}🤖2`)}</th><th>👨‍🍳</th><th>👸</th></tr></thead><tbody>${rows}</tbody></table>`)
        + `<p style="margin-top:1mm">${rich(t('s7bonus'))}</p>${key ? `<p class="note">${esc(t('keyBonus'))}</p>` : ''}`;
    },
  };

  function sheetHTML(ch, d, s, key) {
    return `<div class="sheet ${key ? 'key' : ''}">${head(ch, s, key)}${key || ch === 4 ? '' : lesson(ch)}${PAGE[ch](d, key)}</div>`;
  }
  function teacherHTML(s) {
    return `<div class="sheet teacher"><div class="sheet-head"><div><div class="kicker">${esc(t('brand'))}</div><div class="title">${esc(t('teacherTitle'))}</div><div class="subtitle">${esc(t('teacherSub'))}</div></div></div>
      <ol>${t('teacherSteps').map(p => `<li>${rich(p)}</li>`).join('')}</ol></div>`;
  }

  function regenerate() {
    const s = readSettings();
    persist(s);
    const msg = $('msg'); msg.className = 'msg';
    try {
      const chs = s.chapter === 'all' ? E.CHAPTERS : [s.chapter];
      const ds = chs.map(ch => data(ch, s.seed));
      let html = chs.map((ch, i) => sheetHTML(ch, ds[i], s, false)).join('');
      if (s.key) html += chs.map((ch, i) => sheetHTML(ch, ds[i], s, true)).join('');
      if (s.teacher) html += teacherHTML(s);
      $('out').innerHTML = html;
      document.title = `${t('title')} · ${s.seed}`;
      msg.textContent = t('summary', chs.length * (s.key ? 2 : 1) + (s.teacher ? 1 : 0));
    } catch (e) {
      msg.className = 'msg error'; msg.textContent = t('genError') + e.message;
      console.error(e);
    }
  }
  function newWorksheet() { $('seed').value = randomSeed(); regenerate(); }

  function renderControls() {
    const box = $('chapters'); box.innerHTML = '';
    for (const v of CHOICES) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = v === chapter ? 'active' : '';
      b.textContent = v === 'all' ? t('allChapters') : `${v}. ${t('chTitles')[v - 1]}`;
      b.setAttribute('aria-pressed', String(v === chapter));
      b.addEventListener('click', () => { chapter = v; renderControls(); regenerate(); });
      box.appendChild(b);
    }
  }
  function wire() {
    $('seed').addEventListener('change', regenerate);
    $('seed').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); regenerate(); } });
    $('optKey').addEventListener('change', regenerate);
    $('optTeacher').addEventListener('change', regenerate);
    $('randSeed').addEventListener('click', newWorksheet);
    $('newBtn').addEventListener('click', newWorksheet);
    $('printBtn').addEventListener('click', () => window.print());
    I18N.onChange(() => { I18N.apply(UI); renderControls(); regenerate(); });
  }
  function init() {
    const q = new URLSearchParams(location.search);
    if (!restore()) $('seed').value = randomSeed();
    if (q.get('seed')) $('seed').value = q.get('seed');
    const qc = q.get('chapter');
    if (qc === 'all') chapter = 'all';
    else if (E.CHAPTERS.includes(parseInt(qc, 10))) chapter = parseInt(qc, 10);
    if (q.has('key')) $('optKey').checked = q.get('key') === '1' || q.get('key') === 'true';
    if (q.has('teacher')) $('optTeacher').checked = q.get('teacher') === '1' || q.get('teacher') === 'true';
    wire();
    I18N.apply(UI);
    renderControls();
    regenerate();
  }
  init();
})();
</script>
</body>
</html>
