<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher Detective — Printable Worksheet</title>
<meta name="description" content="Seed-based, printable A4 Cipher Detective worksheets: a message and its secret code, tick which cipher was used. Optional guide and answer key pages.">
<style>
  :root{
    --ink:#1b1b1f; --muted:#666; --line:#2a2a2e; --accent:#4f5bd5; --accent-d:#3d48b8;
    --bg:#eef1f6; --panel:#ffffff; --soft:#f3f5f9; --err:#c0252b; --radius:10px;
    --tile:6.2mm; --tgap:0.8mm; --wgap:3mm;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none !important}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;}
  button{font:inherit;}
  .appbar{padding:12px 18px;background:var(--panel);border-bottom:1px solid #e2e6ee;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .appbar .grow{flex:1 1 auto;}
  .appbar h1{margin:0;font-size:18px;}
  .appbar p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .navlink{font-weight:600;font-size:14px;color:var(--accent-d);text-decoration:none;border:1px solid #ccd2dd;border-radius:999px;padding:6px 12px;background:var(--soft);white-space:nowrap;}
  .navlink:hover{border-color:var(--accent);}
  .wrap{display:flex;gap:18px;align-items:flex-start;padding:18px;max-width:1200px;margin:0 auto;}
  @media (max-width:880px){ .wrap{flex-direction:column;align-items:stretch;} .stage{width:100%;} }

  /* ---- controls ---- */
  .controls{flex:0 0 290px;background:var(--panel);border:1px solid #e2e6ee;border-radius:var(--radius);padding:14px;position:sticky;top:14px;}
  @media (max-width:880px){ .controls{position:static;flex-basis:auto;width:100%;} }
  .controls h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;}
  .grp{margin-bottom:14px;}
  .row{display:flex;gap:8px;align-items:center;}
  input[type=text],input[type=number]{font:inherit;padding:7px 8px;border:1px solid #ccd2dd;border-radius:8px;background:#fff;width:100%;}
  #randSeed{flex:0 0 auto;width:auto;padding:7px 10px;border:1px solid #ccd2dd;border-radius:8px;background:var(--soft);cursor:pointer;font-size:15px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .presets button{font-size:12.5px;padding:6px 10px;border:1px solid #ccd2dd;background:var(--soft);border-radius:999px;cursor:pointer;}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .presets button:hover{border-color:var(--accent);}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:6px 0;}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  button.primary{font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;}
  button.primary:hover{background:var(--accent-d);}
  button.ghost{padding:9px;border:1px solid #ccd2dd;border-radius:9px;background:#fff;cursor:pointer;}
  button.ghost:hover{border-color:var(--accent);}
  .msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--muted);}
  .msg.error{color:var(--err);font-weight:600;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---- sheets ---- */
  .stage{flex:1;min-width:0;}
  .sheetscroll{overflow-x:auto;}
  .sheet{background:#fff;border:1px solid #e2e6ee;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.07);padding:26px 28px;margin:0 auto 18px;max-width:820px;color:#111;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:10px;}
  .title{font-size:20px;font-weight:800;}
  .subtitle{font-size:12.5px;color:var(--muted);}
  .seedlabel{font:12px ui-monospace,Menlo,Consolas,monospace;color:#888;margin-top:3px;}
  .namebox{flex:0 0 220px;border:1px solid #bbb;border-radius:6px;padding:6px 12px;font-size:12.5px;color:#555;line-height:2.1;}
  .instr{font-size:12px;color:#333;margin:0 0 8px;}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 14px;font-size:11.5px;color:#333;margin:0 0 4px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;}
  .alpha-row{display:grid;gap:0.6mm;margin:4px 0 6px;}
  .alpha-row span{border:0.3mm solid #999;border-radius:1mm;text-align:center;font:800 9.5px/1.15 ui-monospace,Menlo,Consolas,monospace;padding:1mm 0 0.6mm;}
  .alpha-row small{display:block;font-size:7.5px;font-weight:600;color:#666;}
  .case{padding:6px 0 8px;border-top:1px dashed #bbb;break-inside:avoid;page-break-inside:avoid;}
  .case-top{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-bottom:4px;}
  .case-no{font-weight:800;font-size:14px;}
  .ticks{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;}
  .tick{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .cb{display:inline-block;width:4.2mm;height:4.2mm;border:0.4mm solid #222;border-radius:1mm;}
  .letters{display:flex;flex-wrap:wrap;gap:1.5mm var(--wgap);}
  .word{display:flex;flex-direction:column;gap:var(--tgap);}
  .r{display:flex;gap:var(--tgap);}
  .t{width:var(--tile);height:var(--tile);display:flex;align-items:center;justify-content:center;font:800 calc(var(--tile)*.58)/1 ui-monospace,Menlo,Consolas,monospace;border-radius:1mm;}
  .r.plain .t{border:0.35mm solid #444;background:#fff;}
  .r.code .t{border:0.5mm solid #000;background:#e4e4e4;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .r.steps .t{height:4.2mm;border:0.3mm dashed #888;font:700 2.8mm/1 ui-monospace,Menlo,Consolas,monospace;color:#333;}
  .flip{transform:rotate(180deg);margin-top:14px;padding-top:6px;border-top:1px dashed #bbb;font-size:10.5px;color:#444;line-height:1.5;}
  .flip b{margin-right:2px;}
  .muted{color:var(--muted);font-weight:400;}

  /* guide page */
  .checklist{margin:0 0 8px;padding-left:20px;font-size:11.5px;line-height:1.4;}
  .checklist li{margin:2px 0;}
  .alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(11mm,1fr));gap:0.8mm;margin:0 0 8px;}
  .alpha span{border:0.3mm solid #999;border-radius:1mm;text-align:center;font:700 11px/1.6 ui-monospace,Menlo,Consolas,monospace;}
  .gcard{border:1px solid #ccc;border-radius:6px;padding:6px 10px;margin-bottom:6px;break-inside:avoid;page-break-inside:avoid;}
  .gcard .gh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-bottom:1px;}
  .gcard .lvl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid #999;border-radius:999px;padding:0 6px;color:#555;}
  .gcard p{margin:1px 0;font-size:11px;line-height:1.4;}
  .gcard .ex{font:700 10.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#f3f3f3;border-radius:4px;padding:2px 8px;margin-top:3px;print-color-adjust:exact;-webkit-print-color-adjust:exact;}

  /* key page */
  .key .case{padding:6px 0 8px;}
  .key .kline{font-size:13px;margin-bottom:3px;}
  .key .kexp{font-size:11.5px;color:#333;margin:0 0 6px;}
  .key .letters{--tile:5mm;}

  /* ---- phone ---- */
  @media (max-width:600px){
    :root{--tile:5.4mm;}
    .appbar{padding:12px 14px;}
    .wrap{padding:10px;gap:12px;}
    input[type=text],input[type=number]{font-size:16px;}   /* >=16px stops iOS zoom-on-focus */
    .sheet{padding:14px 12px;max-width:100%;}
    .sheet-head{flex-wrap:wrap;gap:10px;}
    .namebox{flex:1 1 100%;}
  }

  /* ---- print ---- */
  @media print{
    @page{ size:A4; margin:12mm; }
    :root{--tile:6.2mm;}
    body{background:#fff;}
    .appbar,.controls,.msg,.actions,.no-print{display:none !important;}
    .wrap{display:block;padding:0;margin:0;max-width:none;}
    .stage{width:100%;}
    .sheetscroll{overflow:visible;}
    .sheet{box-shadow:none;border:0;border-radius:0;margin:0;padding:0;max-width:none;}
    .sheet + .sheet{page-break-before:always;break-before:page;}
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🕵️ Cipher Detective — Printable worksheet</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 All puzzles</a>
  <a class="navlink" href="index.html" data-keep-lang data-i18n="playOnline">🎮 Play online</a>
  <nav class="langs" aria-label="Language"></nav>
</div>

<div class="wrap">
  <!-- CONTROLS -->
  <form class="controls no-print" id="controls" onsubmit="return false">
    <div class="grp">
      <h2 data-i18n="seed">Seed</h2>
      <div class="row">
        <input type="text" id="seed" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:seed" aria-label="Seed">
        <button type="button" id="randSeed" data-i18n-attr="title:randomSeed,aria-label:randomSeed" title="Random seed">🎲</button>
      </div>
      <div class="hint" data-i18n="seedHint"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="level">Level</h2>
      <div class="presets" id="levels">
        <button type="button" data-level="easy" class="active" data-i18n="easyN">Easy · 3 ciphers</button>
        <button type="button" data-level="hard" data-i18n="hardN">Hard · 6 ciphers</button>
      </div>
    </div>

    <div class="grp">
      <h2 data-i18n="cases">Cases</h2>
      <input type="number" id="count" min="1" max="10" step="1" value="6" data-i18n-attr="aria-label:cases" aria-label="Number of cases">
      <div class="hint" data-i18n="casesHint"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="options">Options</h2>
      <label class="check"><input type="checkbox" id="optAlpha" checked> <span data-i18n="optAlpha"></span></label>
      <label class="check"><input type="checkbox" id="optSteps" checked> <span data-i18n="optSteps"></span></label>
      <label class="check"><input type="checkbox" id="optHints"> <span data-i18n="optHints"></span></label>
      <label class="check"><input type="checkbox" id="optGuide" checked> <span data-i18n="optGuide"></span></label>
      <label class="check"><input type="checkbox" id="optKey" checked> <span data-i18n="optKey"></span></label>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="newBtn" data-i18n="newWorksheet">New worksheet</button>
      <button type="button" class="ghost" id="printBtn" data-i18n="print">Print / Save PDF</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>

  <!-- SHEETS -->
  <div class="stage">
    <div class="sheetscroll" id="out"></div>
  </div>
</div>

<script src="../i18n.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STORE = 'cdw';
  let level = 'easy';

  const UI = {};
  for (const l of Object.keys(ENGINE.TEXT)) UI[l] = ENGINE.TEXT[l].sheet;
  const t = (k, ...a) => I18N.t(UI, k, ...a);
  const lang = () => I18N.get();
  const TX = () => ENGINE.textFor(lang());
  const levelName = l => TX().levels[l];
  const AL = () => ENGINE.alphabet(lang());
  function paramLabel(id, p) {
    const P = TX().params;
    if (id === 'caesar') return P.shift(p.shift);
    if (id === 'vigenere' || id === 'beaufort') return P.key(p.key);
    if (id === 'affine') return P.affine(p.a, p.b);
    return '';
  }

  function randomSeed() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s + '-' + (100 + Math.floor(Math.random() * 900));
  }
  function readSettings() {
    const n = parseInt($('count').value, 10);
    return {
      seed: $('seed').value.trim() || 'SEED',
      level,
      count: Number.isFinite(n) ? Math.max(1, Math.min(10, n)) : 6,
      alpha: $('optAlpha').checked, steps: $('optSteps').checked, hints: $('optHints').checked,
      guide: $('optGuide').checked, key: $('optKey').checked,
    };
  }
  function persist(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (_) { } }
  function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (!s) return false;
      $('seed').value = s.seed || randomSeed();
      level = ENGINE.LEVELS[s.level] ? s.level : 'easy';
      $('count').value = s.count || 6;
      $('optAlpha').checked = s.alpha !== false;
      $('optSteps').checked = s.steps !== false;
      $('optHints').checked = !!s.hints;
      $('optGuide').checked = s.guide !== false;
      $('optKey').checked = s.key !== false;
      return true;
    } catch (_) { return false; }
  }

  /** Message/code tiles for one case. mode: 'blank' (empty step boxes), 'filled' (steps shown), 'none' (no step row). */
  function tilesHTML(p, mode) {
    const A = ENGINE.alphabet(p.lang), pairs = ENGINE.letterPairs(p.plaintext, p.ciphertext, p.lang);
    let li = 0;
    const words = p.plaintext.split(' '), cwords = p.ciphertext.split(' ');
    return '<div class="letters">' + words.map((wStr, wi) => {
      const w = [...wStr], cw = [...cwords[wi]];
      let rp = '', rc = '', rs = '';
      for (let i = 0; i < w.length; i++) {
        const ch = w[i], c = cw[i], isL = A.has(ch);
        rp += `<span class="t">${esc(ch)}</span>`;
        rc += `<span class="t">${esc(c)}</span>`;
        rs += `<span class="t">${mode === 'filled' && isL ? pairs[li].s : ''}</span>`;
        if (isL) li++;
      }
      return `<div class="word"><div class="r plain">${rp}</div><div class="r code">${rc}</div>${mode === 'none' ? '' : `<div class="r steps">${rs}</div>`}</div>`;
    }).join('') + '</div>';
  }

  function headHTML(title, subtitle, seed, namebox) {
    return `<div class="sheet-head"><div><div class="title">${esc(title)}</div><div class="subtitle">${esc(subtitle)}</div><div class="seedlabel">${esc(t('seedLabel'))} ${esc(seed)}</div></div>${namebox ? `<div class="namebox">${esc(t('name'))}<br>${esc(t('date'))}</div>` : ''}</div>`;
  }

  function renderWorksheet(W, s) {
    const ids = ENGINE.LEVELS[s.level], CT = TX().ciphers;
    const ticks = ids.map(id => `<span class="tick"><span class="cb"></span>${esc(CT[id].name)}</span>`).join('');
    const legend = ids.map(id => `<div><b>${ENGINE.CIPHERS[id].icon} ${esc(CT[id].name)}</b> — ${esc(CT[id].blurb)}</div>`).join('');
    const cases = W.cases.map((p, i) =>
      `<div class="case"><div class="case-top"><span class="case-no">${esc(t('caseN', i + 1))}</span><span class="ticks">${ticks}</span></div>${tilesHTML(p, s.steps ? 'blank' : 'none')}</div>`).join('');
    const hints = s.hints
      ? `<div class="flip"><b>${esc(t('hintsFlip'))}</b> — ${W.cases.map((p, i) => `<b>${i + 1}:</b> ${esc(ENGINE.puzzleText(p, lang()).hints[0])}`).join(' ')}</div>`
      : '';
    const A = AL();
    const alpha = s.alpha ? `<div class="alpha-row" style="grid-template-columns:repeat(${A.n},1fr)">${A.letters.map((ch, i) => `<span>${ch}<small>${i}</small></span>`).join('')}</div>` : '';
    return `<div class="sheet">
      ${headHTML(t('sheetTitle'), t('sheetSub', levelName(s.level), W.cases.length), W.seed, true)}
      <p class="instr">${esc(t('instr'))}${s.steps ? esc(t('instrSteps')) : ''}</p>
      <div class="legend">${legend}</div>
      ${alpha}${cases}${hints}
    </div>`;
  }

  function renderGuide(W, s) {
    const ids = ENGINE.LEVELS[s.level], CT = TX().ciphers;
    const steps = t('checklist').slice(0, s.level === 'hard' ? 6 : 3);
    const A = AL(), G = TX().guide;
    const GUIDE_EXAMPLES = { caesar: { shift: 3 }, rot13: {}, atbash: {}, vigenere: { key: G.key }, affine: { a: 5, b: 8 }, beaufort: { key: G.key } };
    const alpha = A.letters.map((ch, i) => `<span>${ch}=${i}</span>`).join('');
    const cards = ids.map(id => {
      const c = ENGINE.CIPHERS[id], tx = CT[id], p = GUIDE_EXAMPLES[id], lbl = paramLabel(id, p);
      return `<div class="gcard"><div class="gh">${c.icon} ${esc(tx.name)} <span class="lvl">${esc(levelName(c.level))}</span></div>
        <p>${esc(tx.how)}</p><p><b>${esc(t('howToSpot'))}</b> ${esc(tx.spot)}</p>
        <div class="ex">${lbl ? `(${esc(lbl)})  ` : ''}${esc(G.sample)} → ${esc(ENGINE.encrypt(id, G.sample, p, lang()))}</div></div>`;
    }).join('');
    return `<div class="sheet guide">
      ${headHTML(t('guideTitle'), t('guideSub', levelName(s.level)), W.seed, false)}
      <ol class="checklist">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
      <div class="alpha">${alpha}</div>
      ${cards}
    </div>`;
  }

  function renderKey(W, s) {
    const CT = TX().ciphers;
    const items = W.cases.map((p, i) => {
      const c = ENGINE.CIPHERS[p.cipher_id], tx = CT[p.cipher_id], lbl = paramLabel(p.cipher_id, p.params);
      return `<div class="case"><div class="kline"><b>${esc(t('caseN', i + 1))} — ${c.icon} ${esc(tx.name)}</b>${lbl ? ` <span class="muted">(${esc(lbl)})</span>` : ''}</div>
        <p class="kexp">${esc(ENGINE.puzzleText(p, lang()).explanation)}</p>${tilesHTML(p, 'filled')}</div>`;
    }).join('');
    return `<div class="sheet key">
      ${headHTML(t('keyTitle'), t('keySub', levelName(s.level), W.cases.length), W.seed, false)}
      ${items}
    </div>`;
  }

  function regenerate() {
    const s = readSettings();
    $('count').value = s.count;
    persist(s);
    const msg = $('msg'); msg.className = 'msg';
    try {
      const W = ENGINE.generateWorksheet(s.seed, s.level, s.count, lang());
      let html = renderWorksheet(W, s);
      if (s.guide) html += renderGuide(W, s);
      if (s.key) html += renderKey(W, s);
      $('out').innerHTML = html;
      document.title = `${t('sheetTitle').replace(/^\S+\s/, '')} ${s.seed} (${levelName(s.level)})`;
      const parts = [t('partSheet')]; if (s.guide) parts.push(t('partGuide')); if (s.key) parts.push(t('partKey'));
      msg.textContent = `${t('casesCount', s.count)} · ${t('pagesCount', parts.length)} (${parts.join(' + ')}).`;
    } catch (e) {
      msg.className = 'msg error'; msg.textContent = t('genError') + e.message;
    }
  }
  function newWorksheet() { $('seed').value = randomSeed(); regenerate(); }
  function setLevel(l) {
    level = l;
    document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('active', b.dataset.level === l));
  }

  function wire() {
    $('seed').addEventListener('change', regenerate);
    $('seed').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); regenerate(); } });
    $('count').addEventListener('change', regenerate);
    ['optAlpha', 'optSteps', 'optHints', 'optGuide', 'optKey'].forEach(id => $(id).addEventListener('change', regenerate));
    document.querySelectorAll('#levels button').forEach(b => b.addEventListener('click', () => { setLevel(b.dataset.level); regenerate(); }));
    $('randSeed').addEventListener('click', newWorksheet);
    $('newBtn').addEventListener('click', newWorksheet);
    $('printBtn').addEventListener('click', () => window.print());
    I18N.onChange(() => { I18N.apply(UI); regenerate(); });
  }

  function init() {
    const q = new URLSearchParams(location.search);
    if (!restore()) $('seed').value = randomSeed();
    if (q.get('seed')) $('seed').value = q.get('seed');
    if (ENGINE.LEVELS[q.get('level')]) level = q.get('level');
    if (q.get('n')) $('count').value = q.get('n');
    for (const [k, id] of [['alpha', 'optAlpha'], ['steps', 'optSteps'], ['hints', 'optHints'], ['guide', 'optGuide'], ['key', 'optKey']]) {
      if (q.has(k)) $(id).checked = q.get(k) === '1' || q.get(k) === 'true';
    }
    setLevel(level);
    wire();
    I18N.apply(UI);
    regenerate();
  }
  init();
})();
</script>
</body>
</html>
