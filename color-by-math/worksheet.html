<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolorowanka z działaniami — karta pracy</title>
<meta name="description" content="Karty pracy A4 do druku: kolorowanka z działaniami dla dzieci — policz dodawanie i odejmowanie do 10 albo do 20, pokoloruj pola według wyników, a pojawi się obrazek. Z rozwiązaniami.">
<link rel="stylesheet" href="../sheet-kit/kit.css">
<style>
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:2mm 3mm;margin:0 0 4mm;}
  .chip{display:inline-flex;align-items:center;gap:2mm;border:0.3mm solid #c9cfda;border-radius:2.5mm;padding:1.2mm 3mm 1.2mm 2mm;font-size:13px;background:#fafbfd;}
  .chip b{font-size:19px;font-weight:800;min-width:7mm;text-align:right;}
  .chip i{display:inline-block;width:7mm;height:7mm;border-radius:1.5mm;border:0.3mm solid rgba(0,0,0,.35);}
  .chip.white i{background:#fff;border-style:dashed;}
  .pic{display:flex;justify-content:center;}
  .pic svg{max-width:100%;height:auto;}
  .answer-line{max-width:90mm;margin:4mm auto 0;font-size:14px;}
  .key .tasks{align-items:end;}
  .key .task svg{display:block;margin:0 auto;}
  .key .name{font-size:12.5px;font-weight:700;text-align:center;margin-top:1.5mm;}
  .key .legend{margin:2mm 0 0;gap:1mm 2mm;}
  .key .chip{font-size:11px;padding:0.6mm 1.8mm 0.6mm 1.2mm;gap:1.2mm;}
  .key .chip b{font-size:13px;min-width:4mm;}
  .key .chip i{width:4mm;height:4mm;}
  @media (max-width:600px){ .chip{font-size:12px;} .chip b{font-size:16px;} }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">🎨 Kolorowanka z działaniami — karta pracy</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false"></form>
  <div class="stage"><div id="out"></div></div>
</div>

<script src="../i18n.js"></script>
<script src="../print-qr.js"></script>
<script src="../sheet-kit/kit.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  // A4 inside the margins is 186 × 273 mm; the head, the instruction, the legend and "What is it?" take 70–87 mm
  // (in French both the head and the instruction take two lines), so the picture gets at most 182 mm.
  const BOX = [186, 182], MAX_SQ = 15.5;
  const KEY_W = { 1: 110, 2: 88, 3: 58 };   // width (mm) of a picture in the answer key

  KIT.app({
    store: 'color-by-math.sheet',
    text: CBM_TEXT,
    groups: [
      { id: 'math', values: Object.keys(CBM.MATH), def: 'add10', label: (v, C) => C.maths[v] },
      { id: 'fields', values: Object.keys(CBM.FIELDS), def: 'big', label: (v, C) => C.fieldSizes[v] },
      { id: 'count', values: [1, 2, 3], def: 1, label: (v, C) => C.counts(v) },
    ],
    render(s, api) {
      const { t, C, esc } = api;
      // different pictures on the pages of one sheet
      const pics = KIT.shuffle(api.rnd('pics'), CBM.PICTURES).slice(0, s.count);
      const puzzles = pics.map((pic, i) => CBM.puzzle(api.rnd(`${s.math}|${s.fields}|${i}`), pic, s.math, s.fields));
      const chip = (l, small) => `<span class="chip${l.color === '.' ? ' white' : ''}"><b>${l.value}</b>`
        + `<i style="background:${CBM.PALETTE[l.color]}"></i>${small && l.color === '.' ? esc(C.colors.white) : esc(C.colors[l.color])}</span>`;
      const legend = (p, small) => `<div class="legend">${p.legend.map(l => chip(l, small)).join('')}</div>`;
      const sub = `${C.maths[s.math]} · ${C.fieldSizes[s.fields]}`;
      let html = '', fields = 0;
      puzzles.forEach((p, i) => {
        const W = p.rows[0].length, H = p.rows.length;
        const sq = Math.min(MAX_SQ, Math.floor(2 * Math.min(BOX[0] / (W + 0.1), BOX[1] / (H + 0.1))) / 2);
        fields += p.regions.length;
        html += `<div class="sheet">
          ${api.head(t('sheetTitle') + (puzzles.length > 1 ? ` ${i + 1}` : ''), sub, true)}
          <p class="instr">${esc(t('instr'))}</p>
          ${legend(p, false)}
          <div class="pic">${CBM.svg(p, sq)}</div>
          <div class="answer-line">${esc(t('answer'))} <b></b></div>
        </div>`;
      });
      if (s.key) {
        const keys = puzzles.map((p, i) => {
          const sq = KEY_W[puzzles.length] / p.rows[0].length;
          return `<div class="task">${CBM.svg(p, sq, { solved: true })}
            <div class="name">${puzzles.length > 1 ? `${i + 1}. ` : ''}${esc(C.pics[p.id] || p.id)}</div>${legend(p, true)}</div>`;
        }).join('');
        html += `<div class="sheet key">${api.head(t('keyTitle'), `${t('sheetTitle')} · ${sub}`, false)}`
          + `<div class="tasks${puzzles.length > 1 ? ` c${puzzles.length}` : ''}">${keys}</div></div>`;
      }
      return { html, tasks: fields, pages: puzzles.length + (s.key ? 1 : 0) };
    },
  });
})();
</script>
</body>
</html>
