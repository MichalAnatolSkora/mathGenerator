<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latarnik — karty pracy z alfabetem Morse’a</title>
<meta name="description" content="Karty pracy A4 do druku z alfabetem Morse’a: telegramy do odczytania, zagadki, nadawanie, tajemniczy obrazek, hasło i drzewko Morse’a. Z rozwiązaniami.">
<style>
  :root{
    --ink:#1b1b1f; --muted:#666; --line:#2a2a2e; --accent:#4f5bd5; --accent-d:#3d48b8;
    --bg:#eef1f6; --panel:#ffffff; --soft:#f3f5f9; --err:#c0252b; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none !important}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;}
  button{font:inherit;}
  .appbar{padding:12px 18px;background:var(--panel);border-bottom:1px solid #e2e6ee;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
  .appbar .grow{flex:1 1 auto;}
  .appbar h1{margin:0;font-size:18px;}
  .appbar p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .navlink{display:inline-flex;align-items:center;min-height:40px;font-weight:600;font-size:14px;color:var(--accent-d);text-decoration:none;border:1px solid #ccd2dd;border-radius:999px;padding:6px 12px;background:var(--soft);white-space:nowrap;}
  .navlink:hover{border-color:var(--accent);}
  .wrap{display:flex;gap:18px;align-items:flex-start;padding:18px;max-width:1200px;margin:0 auto;}
  @media (max-width:880px){ .wrap{flex-direction:column;align-items:stretch;} .stage{width:100%;} }

  /* ---- controls ---- */
  .controls{flex:0 0 290px;background:var(--panel);border:1px solid #e2e6ee;border-radius:var(--radius);padding:14px;position:sticky;top:14px;}
  @media (max-width:880px){ .controls{position:static;flex-basis:auto;width:100%;} }
  .controls h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;}
  .grp{margin-bottom:14px;}
  .row{display:flex;gap:8px;align-items:center;}
  input[type=text]{font:inherit;padding:7px 8px;border:1px solid #ccd2dd;border-radius:8px;background:#fff;width:100%;}
  #randSeed{flex:0 0 auto;width:auto;min-height:40px;padding:7px 12px;border:1px solid #ccd2dd;border-radius:8px;background:var(--soft);cursor:pointer;font-size:15px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .presets button{font-size:12.5px;min-height:38px;padding:6px 12px;border:1px solid #ccd2dd;background:var(--soft);border-radius:999px;cursor:pointer;}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .presets button:hover{border-color:var(--accent);}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:4px 0;min-height:32px;}
  .check input{width:18px;height:18px;flex:0 0 auto;}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  button.primary{font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;min-height:44px;}
  button.primary:hover{background:var(--accent-d);}
  button.ghost{padding:9px;border:1px solid #ccd2dd;border-radius:9px;background:#fff;cursor:pointer;min-height:44px;}
  button.ghost:hover{border-color:var(--accent);}
  .msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--muted);}
  .msg.error{color:var(--err);font-weight:600;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---- sheets (A4: 210 × 297 mm, 12 mm margins ⇒ 186 × 273 mm to draw on) ---- */
  .stage{flex:1;min-width:0;}
  .sheet{background:#fff;border:1px solid #e2e6ee;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.07);padding:12mm;margin:0 auto 18px;width:210mm;max-width:100%;color:#111;}
  #measure{position:absolute;left:-10000px;top:0;width:186mm;padding:0;border:0;box-shadow:none;margin:0;max-width:none;visibility:hidden;}
  .u{padding-bottom:4mm;break-inside:avoid;page-break-inside:avoid;}
  .u:last-child{padding-bottom:0;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid var(--line);padding-bottom:7px;margin-bottom:2.5mm;}
  .sheet-head.slim{align-items:baseline;}
  .title{font-size:20px;font-weight:800;}
  .slim .title{font-size:15px;}
  .subtitle{font-size:12.5px;color:var(--muted);}
  .seedlabel{font:12px ui-monospace,Menlo,Consolas,monospace;color:#888;margin-top:3px;}
  .namebox{flex:0 0 230px;border:1px solid #bbb;border-radius:6px;padding:6px 12px;font-size:12.5px;color:#555;line-height:2.1;}
  .legend{display:flex;flex-wrap:wrap;gap:1mm 7mm;font-size:12px;color:#333;margin:0;}
  .legend span{display:inline-flex;align-items:center;gap:2mm;}
  .mc{display:block;flex:none;}

  /* a task */
  .bh{display:flex;align-items:center;gap:2.5mm;margin:0 0 1mm;}
  .bh h3{margin:0;font-size:15px;font-weight:800;}
  .bn{display:inline-flex;align-items:center;justify-content:center;width:6.5mm;height:6.5mm;border-radius:50%;background:#1b1b1f;color:#fff;font-weight:800;font-size:12.5px;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .bi{font-size:12.5px;color:#333;margin:0 0 2.5mm;}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;}

  /* code tiles: a code over an answer box */
  .tiles{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2.5mm 0;}
  .word{display:inline-flex;flex-wrap:wrap;align-items:flex-end;gap:2mm 1.6mm;}
  .wgap{width:6mm;flex:none;}
  .tile{display:inline-flex;flex-direction:column;align-items:center;gap:1.4mm;min-width:11mm;border:0.25mm solid #bdbdbd;border-radius:1.6mm;padding:1.2mm 1.2mm 1.1mm;}
  .tc{display:flex;align-items:center;justify-content:center;min-height:2.6mm;}
  .tl{font:800 5.2mm/1 ui-monospace,Menlo,Consolas,monospace;}
  .ab{display:flex;align-items:center;justify-content:center;width:8.5mm;height:9.5mm;border:0.35mm solid #222;border-radius:1.2mm;font:700 6mm/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#9a9a9a;}
  .ab.mark{border-width:1mm;background:#fff3c4;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .small .ab{width:7.5mm;height:8.5mm;font-size:5.4mm;}
  .small .tile{min-width:9.5mm;gap:1.1mm;padding:1.1mm 1mm 1mm;}

  /* continuous code (older): letters split by / and words by // */
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:2mm 1.8mm;padding:1mm 0;}
  .sl{font:700 4.6mm/1 ui-monospace,Menlo,Consolas,monospace;color:#555;}
  .wl{height:8.5mm;border-bottom:0.3mm solid #444;}

  /* telegram form */
  .tg{border:0.4mm solid #333;border-radius:1.5mm;padding:1.6mm 2.5mm 2.5mm;break-inside:avoid;}
  .tgh{display:flex;justify-content:space-between;gap:3mm;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;color:#444;border-bottom:0.3mm dashed #888;padding-bottom:1mm;margin-bottom:2mm;}
  .tgh b{letter-spacing:.18em;color:#111;}

  .rq{margin:0 0 2mm;font-size:13px;font-weight:600;}

  /* sending: a letter over empty circles (younger) or an empty box (older) */
  .enc{display:flex;flex-wrap:wrap;gap:3mm 4mm;align-items:flex-start;}
  .ec{display:flex;flex-direction:column;align-items:center;gap:1.5mm;}
  .ec b{font:800 6mm/1 ui-monospace,Menlo,Consolas,monospace;}
  .slots{display:flex;gap:1mm;}
  .slots i{width:5mm;height:5mm;border:0.3mm dashed #777;border-radius:50%;}
  .slot{width:21mm;height:8mm;border:0.35mm solid #222;border-radius:1.2mm;}

  .err{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2mm 8mm;}
  .err .tile{gap:1.6mm;}
  .fix{display:flex;align-items:center;gap:2mm;font-size:12px;}
  .fixbox{width:26mm;height:9mm;border:0.35mm solid #222;border-radius:1.2mm;}

  /* pairs */
  .pairs{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:18mm;row-gap:1.6mm;align-items:center;}
  .pt{display:flex;align-items:center;gap:3mm;min-height:6mm;}
  .pt b{font:800 6mm/1 ui-monospace,Menlo,Consolas,monospace;min-width:5mm;text-align:center;}
  .pt i{width:3.2mm;height:3.2mm;border-radius:50%;border:0.5mm solid #222;background:#fff;flex:none;}
  .pcode{display:inline-flex;align-items:center;border:0.3mm solid #999;border-radius:1.4mm;padding:1.6mm 2.2mm;}

  /* password */
  .pwlist{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 6mm;}
  .pwrow{display:flex;align-items:flex-end;gap:2.5mm;}
  .pwrow .no{font-weight:800;font-size:13px;min-width:4mm;padding-bottom:2.5mm;}
  .pwans{display:flex;align-items:flex-start;gap:3mm;margin-top:3mm;font-weight:700;font-size:13px;}
  .pwans .boxes{display:flex;gap:1.6mm;}
  .pwans .ab{border-width:0.7mm;}
  .pwans .ab + small{display:block;text-align:center;font-size:9px;color:#666;font-weight:600;margin-top:0.6mm;}

  /* colouring + pairs side by side */
  .duo{display:flex;gap:6mm;align-items:flex-start;}
  .duo > .picture{flex:0 0 auto;}
  .duo > .side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3.5mm;}
  .colorwrap{display:flex;gap:5mm;align-items:flex-start;}
  .cgrid{display:block;flex:none;max-width:100%;height:auto;}
  .cside{font-size:12px;min-width:42mm;}
  .cside p{margin:0 0 2mm;}
  .csteps{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6mm 7mm;margin:0 0 2.2mm;padding:0 0 0 5mm;font-size:12px;color:#222;}
  .csteps li{padding-left:0.5mm;}
  .cex{display:flex;flex-direction:column;gap:1.2mm;margin:0 0 2.5mm;}
  .exrow{display:flex;align-items:center;gap:1.8mm;font-size:12px;}
  .exrow b{font:800 4.2mm/1 ui-monospace,Menlo,Consolas,monospace;}
  .exrow .arr{color:#666;}
  .exrow small{font-size:11px;color:#444;}
  .excell{display:inline-flex;align-items:center;justify-content:center;width:10mm;height:8.5mm;border:0.3mm solid #555;}
  .excell.on{background:#ffcf5a;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .krow{display:flex;flex-wrap:wrap;align-items:center;gap:1.2mm 2mm;margin:0 0 2mm;}
  .klab{font-weight:700;white-space:nowrap;}
  .ckey{display:flex;flex-wrap:wrap;gap:1.5mm;}
  .kc{display:inline-flex;align-items:center;gap:1.4mm;border:0.3mm solid #aaa;border-radius:1.4mm;padding:0.9mm 1.5mm;}
  .kc b{font:800 4.6mm/1 ui-monospace,Menlo,Consolas,monospace;}
  .kc.yes{border:0.6mm solid #222;background:#ffe9a8;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cq{display:flex;align-items:flex-end;gap:2mm;margin-top:1mm !important;}
  .cq span{flex:1 1 auto;border-bottom:0.3mm solid #444;height:7mm;}

  .tree{display:block;max-width:100%;height:auto;}
  .treepage .seedlabel{display:none;}
  .treepage .tree{margin-top:4mm;}

  .dict{display:grid;grid-template-columns:auto 1fr auto 46mm;gap:2.4mm 3mm;align-items:end;}
  .dict .no{font-weight:800;font-size:13px;padding-bottom:1mm;}
  .dict .cbox{height:9mm;border-bottom:0.3mm solid #444;}
  .dict .arr{font-size:14px;color:#666;padding-bottom:1mm;}
  .gamecode{font-size:11.5px;color:#444;margin:2.5mm 0 0;}
  .gamecode b{font-family:ui-monospace,Menlo,Consolas,monospace;}

  .strip{display:flex;flex-wrap:wrap;align-items:center;gap:1.2mm 1.5mm;border:0.3mm solid #999;border-radius:1.5mm;padding:1.4mm 2mm;}
  .strip .stl{font-size:12px;font-weight:800;margin-right:1mm;}
  .strip .legend{font-size:11px;margin-left:auto;gap:1mm 4mm;}
  .sc{display:inline-flex;align-items:center;gap:1.2mm;border:0.25mm solid #ccc;border-radius:1mm;padding:0.6mm 1.3mm;}
  .sc b{font:800 3.6mm/1 ui-monospace,Menlo,Consolas,monospace;}

  /* answer key */
  .kb{font-size:12.5px;}
  .kb .kn{display:block;font-size:13px;margin-bottom:1.2mm;}
  .kitems{display:flex;flex-wrap:wrap;gap:1.5mm 7mm;align-items:center;}
  .kitems > span{display:inline-flex;align-items:center;gap:2mm;}
  .kw{font:800 13px/1.2 ui-monospace,Menlo,Consolas,monospace;}
  .korig{color:#666;font-size:11.5px;}

  /* cheat sheet */
  .cheat{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;gap:0 5mm;margin:2mm 0 4mm;}
  .cr{display:grid;grid-template-columns:8mm 1fr;align-items:center;gap:0 2mm;border-bottom:0.25mm solid #ddd;padding:1mm 0;min-height:9mm;}
  .cr b{font:800 5.5mm/1 ui-monospace,Menlo,Consolas,monospace;grid-row:span 2;}
  .cr small{font-size:10.5px;color:#555;}
  .note{font-size:12px;color:#333;margin:0 0 2mm;}

  /* the Titanic story */
  .story{display:flex;flex-direction:column;}
  .story .seedlabel{display:none;}
  .story .story-scene{display:block;width:100%;height:auto;max-height:46mm;margin:0 auto 2.5mm;}
  .story .st{font-size:13.5px;line-height:1.4;margin:0 0 1.3mm;}
  .story .st b{font-weight:800;}
  .story .radio{font-size:12px;line-height:1.4;border:0.3mm solid #9db6dc;background:#f2f7fd;border-radius:2mm;padding:2mm 3mm;margin:1mm 0 0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .stasks{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm 8mm;margin-top:2.5mm;padding-top:3mm;border-top:0.3mm solid #bbb;}
  .stasks .wide{grid-column:1 / -1;}
  .calls{display:flex;flex-wrap:wrap;gap:3mm 7mm;align-items:flex-end;}
  .calls .strip{flex:1 1 40mm;}
  .calls small{display:block;font-size:11px;color:#555;margin:0 0 1mm;}
  .sossig{display:flex;align-items:center;gap:3mm;margin-top:1.5mm;}
  .upside{transform:rotate(180deg);font-size:11px;color:#555;margin:auto 0 0;padding-top:2.5mm;}

  /* diploma */
  .diploma{border:2mm double #1b1b1f;border-radius:4mm;min-height:262mm;padding:10mm 12mm;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .diploma .lh{width:52mm;height:auto;margin:2mm 0 4mm;}
  .diploma h2{font-size:32px;margin:0 0 6mm;letter-spacing:.02em;}
  .diploma .for{font-size:16px;margin:0 0 2mm;}
  .diploma .line{width:120mm;border-bottom:0.4mm solid #333;height:14mm;margin:0 0 6mm;}
  .diploma .txt{font-size:16px;max-width:140mm;margin:0 0 5mm;}
  .diploma .lets{font:700 15px/1.6 ui-monospace,Menlo,Consolas,monospace;max-width:150mm;margin:0 0 6mm;}
  .diploma .bravo{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2mm 2.5mm;margin:0 0 4mm;}
  .diploma .signs{display:flex;gap:20mm;margin-top:auto;font-size:12px;color:#555;}
  .diploma .signs span{display:block;width:60mm;border-top:0.3mm solid #333;padding-top:1.5mm;}

  /* ---- phone ---- */
  @media (max-width:600px){
    .appbar{padding:12px 14px;}
    .wrap{padding:10px;gap:12px;}
    input[type=text]{font-size:16px;}   /* >=16px stops iOS zoom-on-focus */
    .sheet{padding:14px 10px;}
    .sheet-head{flex-wrap:wrap;gap:10px;}
    .namebox{flex:1 1 100%;}
    .cols2,.pwlist{grid-template-columns:1fr;}
    .duo,.colorwrap{flex-direction:column;}
    .csteps{grid-template-columns:1fr;}
    .cheat{grid-template-columns:1fr 1fr;grid-auto-flow:row;grid-template-rows:none !important;}
    .dict{grid-template-columns:auto 1fr;}
    .dict .arr{display:none;}
    .pairs{column-gap:14mm;}
    .diploma{padding:16px 10px;min-height:0;}
    .stasks{grid-template-columns:1fr;}
    .diploma .line{width:100%;}
    .diploma .signs{gap:16px;width:100%;}
    .diploma .signs span{width:auto;flex:1;}
  }

  /* ---- print ---- */
  @media print{
    @page{ size:A4; margin:12mm; }
    body{background:#fff;}
    .appbar,.controls,.msg,.actions,.no-print{display:none !important;}
    .wrap{display:block;padding:0;margin:0;max-width:none;}
    .stage{width:100%;}
    .sheet{box-shadow:none;border:0;border-radius:0;margin:0;padding:0;width:auto;max-width:none;}
    .sheet + .sheet{page-break-before:always;break-before:page;}
    .story{min-height:270mm;}
  }
</style>
</head>
<body>
<div class="appbar">
  <div class="grow">
    <h1 data-i18n="appTitle">⚓ Latarnik — karty pracy</h1>
    <p data-i18n="appSub"></p>
  </div>
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <a class="navlink" href="index.html" data-keep-lang data-i18n="playOnline">🎮 Graj online</a>
  <nav class="langs" aria-label="Język"></nav>
</div>

<div class="wrap">
  <form class="controls no-print" id="controls" onsubmit="return false">
    <div class="grp">
      <h2 data-i18n="seed">Kod karty</h2>
      <div class="row">
        <input type="text" id="seed" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:seed">
        <button type="button" id="randSeed" data-i18n-attr="title:randomSeed,aria-label:randomSeed">🎲</button>
      </div>
      <div class="hint" data-i18n="seedHint"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="level">Wiek</h2>
      <div class="presets" id="levels"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="letters">Litery</h2>
      <div class="presets" id="groups"></div>
      <label class="check" id="extraRow"><input type="checkbox" id="optExtra"> <span id="extraLabel"></span></label>
    </div>

    <div class="grp">
      <h2 data-i18n="tasksTitle">Zadania na karcie</h2>
      <div id="tasks"></div>
    </div>

    <div class="grp">
      <h2 data-i18n="options">Opcje</h2>
      <div class="hint" style="margin:0 0 4px;font-size:12.5px;color:var(--ink)" data-i18n="optAid"></div>
      <div class="presets" id="aids" style="margin-bottom:6px"></div>
      <label class="check"><input type="checkbox" id="optCheat" checked> <span data-i18n="optCheat"></span></label>
      <label class="check"><input type="checkbox" id="optKey" checked> <span data-i18n="optKey"></span></label>
      <label class="check"><input type="checkbox" id="optTreePage" checked> <span data-i18n="optTreePage"></span></label>
      <label class="check"><input type="checkbox" id="optDiploma" checked> <span data-i18n="optDiploma"></span></label>
      <label class="check"><input type="checkbox" id="optStory" checked> <span data-i18n="optStory"></span></label>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="newBtn" data-i18n="newWorksheet"></button>
      <button type="button" class="ghost" id="printBtn" data-i18n="print"></button>
      <button type="button" class="ghost" id="printTreeBtn" data-i18n="printTree"></button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <div class="stage">
    <div id="out"></div>
  </div>
</div>
<div class="sheet" id="measure" aria-hidden="true"></div>

<script src="../i18n.js"></script>
<script src="../graphic-dictation/engine.js"></script>
<script src="../graphic-dictation/strings.js"></script>
<script src="bank.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STORE = 'morse.sheet2';
  const UI = {};
  for (const l of Object.keys(MORSE_TEXT)) UI[l] = { ...MORSE_TEXT[l].common, ...MORSE_TEXT[l].sheet };
  const t = (k, ...a) => I18N.t(UI, k, ...a);
  const C = () => UI[I18N.get()] || UI.en;
  const lang = () => I18N.get();
  /** Tasks in the order of the checkboxes (the sheet always prints them in MORSE.TASKS order). */
  const TASK_LIST = ['telegram', 'riddle', 'encode', 'coloring', 'pairs', 'error', 'password', 'tree', 'dictation'];
  const CAP = 270;   // mm of the 273 mm page height that blocks may fill (a little to spare)
  const AIDS = ['none', 'strip', 'tree'];
  let level = 'young', upto = 2, tasks = new Set(MORSE.DEFAULT_TASKS.young), aid = 'strip';

  function randomSeed() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s + '-' + (100 + Math.floor(Math.random() * 900));
  }
  function readSettings() {
    return {
      seed: ($('seed').value.trim() || 'SEED').toUpperCase(), level, upto, extra: $('optExtra').checked,
      tasks: TASK_LIST.filter(x => tasks.has(x)),
      aid, treePage: $('optTreePage').checked, cheat: $('optCheat').checked, key: $('optKey').checked, diploma: $('optDiploma').checked, story: $('optStory').checked,
    };
  }
  function persist(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (_) { } }
  function applySettings(s) {
    if (s.seed) $('seed').value = s.seed;
    if (MORSE.LEVELS.includes(s.level)) level = s.level;
    if (MORSE.UPTO.includes(+s.upto)) upto = +s.upto;
    if (Array.isArray(s.tasks)) tasks = new Set(s.tasks.filter(x => TASK_LIST.includes(x)));
    if (s.extra !== undefined) $('optExtra').checked = !!s.extra;
    if (AIDS.includes(s.aid)) aid = s.aid;
    if (s.cheat !== undefined) $('optCheat').checked = !!s.cheat;
    if (s.key !== undefined) $('optKey').checked = !!s.key;
    if (s.diploma !== undefined) $('optDiploma').checked = !!s.diploma;
    if (s.story !== undefined) $('optStory').checked = !!s.story;
    if (s.treePage !== undefined) $('optTreePage').checked = !!s.treePage;
  }
  function restore() {
    try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (!s) return false; applySettings(s); return true; } catch (_) { return false; }
  }
  /** A new age resets the tasks (and the cheat strip) to that age's mix. */
  function setLevel(v) {
    level = v;
    tasks = new Set(MORSE.DEFAULT_TASKS[v]);
    aid = v === 'young' ? 'strip' : 'none';
  }

  /* ---------- pieces of a sheet ---------- */
  const code = ch => MORSE.code(ch, lang());
  const svg = (c, u) => MORSE.svg(c, { u });
  /** Code tiles: each letter's code over an answer box. o: { u, given (first letter written in), mark (index of the bold box), letters (print the letter above), wrong: { index, code } } */
  function tiles(text, o = {}) {
    let i = 0;
    const words = text.split(' ').map(w => `<span class="word">${[...w].map(ch => {
      const k = i++;
      const c = o.wrong && o.wrong.index === k ? o.wrong.code : code(ch);
      const box = o.box === false ? '' : `<span class="ab${k === o.mark ? ' mark' : ''}">${o.given && k === 0 ? esc(ch) : ''}</span>`;
      return `<span class="tile">${o.letters ? `<b class="tl">${esc(ch)}</b>` : ''}<span class="tc">${svg(c, o.u || 2.2)}</span>${box}</span>`;
    }).join('')}</span>`);
    return `<div class="tiles${o.small ? ' small' : ''}">${words.join('<span class="wgap"></span>')}</div>`;
  }
  /** Continuous code: letters split by /, words by //. */
  function chain(text, u = 1.9) {
    return `<div class="chain">${text.split(' ').map(w => [...w].map(ch => svg(code(ch), u)).join('<span class="sl">/</span>')).join('<span class="sl">//</span>')}</div>`;
  }
  const lines = n => '<div class="wl"></div>'.repeat(n);
  const head = (no, title, instr) => `<div class="bh"><span class="bn">${no}</span><h3>${esc(title)}</h3></div>${instr ? `<p class="bi">${instr}</p>` : ''}`;
  const isYoung = () => level === 'young';

  function telegramHTML(b, no) {
    const items = b.items.map(x => `<div class="tg"><div class="tgh"><b>${esc(t('telegramHead'))}</b><span>${esc(t('telegramFrom', x.ship))}</span></div>`
      + (isYoung() ? tiles(x.text, { given: x.given, u: 2 }) : chain(x.text) + lines(MORSE.len(x.text) > 20 ? 2 : 1))
      + '</div>').join('');
    return head(no, t('telegramTitle'), esc(t(isYoung() ? 'telegramYoung' : 'telegramOlder')))
      + `<div class="${isYoung() ? 'cols2' : 'stack'}" style="${isYoung() ? '' : 'display:grid;gap:3mm'}">${items}</div>`;
  }
  function riddleHTML(b, no) {
    const items = b.items.map((x, i) => `<div class="rd"><p class="rq">${i + 1}. ${esc(x.q)}</p>${isYoung() ? tiles(x.text, { u: 2 }) : chain(x.text) + lines(1)}</div>`).join('');
    return head(no, t('riddleTitle'), esc(t('riddleInstr'))) + `<div class="cols2">${items}</div>`;
  }
  function encodeHTML(b, no) {
    const item = x => `<div class="enc">${[...x.text].map(ch => ch === ' ' ? '<span class="wgap"></span>'
      : `<div class="ec"><b>${esc(ch)}</b>${isYoung() ? `<span class="slots">${'<i></i>'.repeat(code(ch).length)}</span>` : '<span class="slot"></span>'}</div>`).join('')}</div>`;
    return head(no, t('encodeTitle'), esc(t(isYoung() ? 'encodeYoung' : 'encodeOlder')))
      + `<div class="${isYoung() ? 'cols2' : ''}" style="${isYoung() ? '' : 'display:grid;gap:4mm'}">${b.items.map(item).join('')}</div>`;
  }
  function errorHTML(b, no) {
    const items = b.items.map((x, i) => `<div class="err"><span class="kw">${i + 1}.</span>${tiles(x.text, { letters: true, box: false, wrong: { index: x.index, code: x.wrong } })}`
      + `<span class="fix">${esc(t('errorFix'))} <span class="fixbox"></span></span></div>`).join('');
    return head(no, t('errorTitle'), esc(t('errorInstr'))) + `<div style="display:grid;gap:4mm">${items}</div>`;
  }
  function pairsHTML(b, no, short) {
    const rows = b.left.map((l, i) => `<span class="pt"><b>${esc(l)}</b><i></i></span><span class="pt"><i></i><span class="pcode">${svg(code(b.right[i]), 2.2)}</span></span>`).join('');
    return head(no, t('pairsTitle'), short ? '' : esc(t('pairsInstr'))) + `<div class="pairs">${rows}</div>`;
  }
  function passwordHTML(b, no) {
    const rows = b.clues.map((c, i) => `<div class="pwrow"><span class="no">${i + 1}.</span>${tiles(c.text, { u: 1.7, mark: c.pos, small: true })}</div>`).join('');
    const boxes = b.clues.map((c, i) => `<span><span class="ab"></span><small>${i + 1}</small></span>`).join('');
    return head(no, t('passwordTitle'), esc(t('passwordInstr'))) + `<div class="pwlist">${rows}</div>`
      + `<div class="pwans"><span style="padding-top:2mm">${esc(t('passwordLabel'))}</span><span class="boxes">${boxes}</span></div>`;
  }
  /** The colouring grid as SVG (1 unit = 0.1 mm); `key` fills the picture instead of printing the codes. */
  function colorSVG(b, cellMm, key) {
    const c = cellMm * 10, W = b.cols * c, H = b.rows * c, f = n => Math.round(n * 10) / 10;
    const codes = [...b.inLetters, ...b.outLetters].map(code);
    const maxW = Math.max(...codes.map(MORSE.codeWidth));
    const dot = Math.min(c * 0.15, (c * 0.7) / maxW), dash = dot * 2.6, bar = dot * 0.74, gap = dot * 0.75;
    let fill = '', marks = '', grid = '';
    for (let r = 0; r < b.rows; r++) for (let q = 0; q < b.cols; q++) {
      if (key) { if (b.inside[r][q]) fill += `M${q * c} ${r * c}h${c}v${c}h${-c}Z`; continue; }
      const cd = code(b.cells[r][q]), w = MORSE.codeWidth(cd) * dot;
      let x = q * c + (c - w) / 2;
      const cy = r * c + c / 2;
      for (const s of cd) {
        if (s === '.') { marks += `<circle cx="${f(x + dot / 2)}" cy="${f(cy)}" r="${f(dot / 2)}"/>`; x += dot; }
        else { marks += `<rect x="${f(x)}" y="${f(cy - bar / 2)}" width="${f(dash)}" height="${f(bar)}" rx="${f(bar / 2)}"/>`; x += dash; }
        x += gap;
      }
    }
    for (let q = 0; q <= b.cols; q++) grid += `M${q * c} 0V${H}`;
    for (let r = 0; r <= b.rows; r++) grid += `M0 ${r * c}H${W}`;
    return `<svg class="cgrid" viewBox="-3 -3 ${W + 6} ${H + 6}" width="${f((W + 6) / 10)}mm" height="${f((H + 6) / 10)}mm" xmlns="http://www.w3.org/2000/svg">`
      + (fill ? `<path d="${fill}" fill="#ffcf5a"/>` : '')
      + `<path d="${grid}" stroke="#555" stroke-width="${key ? 3 : 2.5}" fill="none"/><g fill="#111">${marks}</g></svg>`;
  }
  /** Squares up to 11 mm; the grid stays within 118 × 88 mm so a 60 mm column fits beside it. */
  const colorCell = b => Math.min(11, 118 / b.cols, 88 / b.rows);
  /** Beside the picture: what to do, and a key with every letter of the grid and its code
   *  (first row: colour these, second row: leave white), so the task needs no other help. */
  const colorKey = (ls, yes) => `<div class="ckey">${ls.map(l => `<span class="kc${yes ? ' yes' : ''}"><b>${esc(l)}</b>${svg(code(l), 1.8)}</span>`).join('')}</div>`;
  /** One square as on the grid (10 mm), optionally coloured, for the worked example. */
  const exCell = (c, filled) => `<span class="excell${filled ? ' on' : ''}">${svg(c, 1.3)}</span>`;
  const colorSide = b => {
    const yes = b.inLetters[0], no = b.outLetters[0];
    const ex = `<div class="cex"><span class="klab">${esc(t('coloringExample'))}</span>`
      + `<span class="exrow">${exCell(code(yes))}<b>= ${esc(yes)}</b><span class="arr">→</span>${exCell(code(yes), true)}<small>${esc(t('coloringDo'))}</small></span>`
      + `<span class="exrow">${exCell(code(no))}<b>= ${esc(no)}</b><span class="arr">→</span>${exCell(code(no))}<small>${esc(t('coloringSkip'))}</small></span></div>`;
    return `<div class="cside">${ex}`
      + `<div class="krow"><span class="klab">🖍️ ${esc(t('coloringYes'))}</span>${colorKey(b.inLetters, true)}</div>`
      + `<div class="krow"><span class="klab">⬜ ${esc(t('coloringNo'))}</span>${colorKey(b.outLetters.slice().sort((x, y) => MORSE.alphabet(lang()).indexOf(x) - MORSE.alphabet(lang()).indexOf(y)), false)}</div>`
      + `<p class="cq">${esc(t('coloringQ'))}<span></span></p></div>`;
  };
  /** The steps, numbered, across the page under the task's title. */
  const colorSteps = () => `<ol class="csteps">${C().coloringSteps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
  /** The picture with its legend (and the pairs) beside it, in a few sizes: the page takes the largest that fits. */
  function coloringHTML(b, no, pairsB, pairsNo) {
    const big = colorCell(b);
    const cells = [big, ...[9.5, 8.5, 7.5, 7].filter(c => c < big - 0.3)];
    return cells.map(cell => `${head(no, t('coloringTitle'), '')}${colorSteps()}<div class="duo"><div class="picture">${colorSVG(b, cell)}</div>`
      + `<div class="side">${colorSide(b)}${pairsB ? `<section>${pairsHTML(pairsB, pairsNo, true)}</section>` : ''}</div></div>`);
  }
  function treeHTML(b, no) {
    return head(no, t('treeTitle'), esc(t('treeInstr'))) + MORSE.treeSVG(lang(), { blanks: b.blanks, startLabel: t('treeStart') });
  }
  function dictationHTML(b, no) {
    const rows = b.items.map((x, i) => `<span class="no">${i + 1}.</span><span class="cbox"></span><span class="arr">→</span><span class="cbox"></span>`).join('');
    return head(no, t('dictationTitle'), esc(t('dictationInstr'))) + `<div class="dict">${rows}</div>`
      + `<p class="gamecode">🎮 ${esc(t('dictationGame', '')).trim()} <b>${esc(b.code)}</b></p>`;
  }
  /** The letters of the sheet in words: listed, or "whole alphabet (without Ą Ć …)". */
  function lettersLabel(M) {
    if (M.upto < 4) return M.letters.join(' ');
    const ex = MORSE.extras(M.lang);
    return !ex.length || M.extra ? t('groupAll') : t('groupAllNo', ex.join(' '));
  }
  /** The Morse tree as a cheat sheet: the letters on the sheet in black, the others grey. */
  const treeAidHTML = letters => `<div class="strip" style="display:block"><b class="stl">${esc(t('stripTitle'))}:</b> <span style="font-size:11.5px">${esc(t('cheatTree'))}</span>`
    + `${MORSE.treeSVG(lang(), { active: letters, compact: true, width: 176, startLabel: t('treeStart') })}${legend()}</div>`;
  const legend = () => `<p class="legend"><span>${svg('.', 2.2)} ${esc(t('legendDot'))}</span><span>${svg('-', 2.2)} ${esc(t('legendDash'))}</span></p>`;
  function stripHTML(letters) {
    return `<div class="strip"><b class="stl">${esc(t('stripTitle'))}:</b>${letters.map(l => `<span class="sc"><b>${esc(l)}</b>${svg(code(l), letters.length > 12 ? 1.2 : 1.4)}</span>`).join('')}${legend()}</div>`;
  }
  const RENDER = { telegram: telegramHTML, riddle: riddleHTML, encode: encodeHTML, error: errorHTML, pairs: pairsHTML, password: passwordHTML, tree: treeHTML, dictation: dictationHTML };

  function headHTML(first, M, title, sub, withLegend) {
    if (!first) return `<div class="sheet-head slim"><div class="title">${esc(title || t('contTitle'))}</div><div class="seedlabel">${esc(t('seedLabel'))} ${esc(M.seed)}</div></div>`;
    return `<div class="sheet-head"><div><div class="title">${esc(title || t('sheetTitle'))}</div><div class="subtitle">${esc(sub || t('sheetSub', C().levels[M.level], lettersLabel(M)))}</div>`
      + `<div class="seedlabel">${esc(t('seedLabel'))} ${esc(M.seed)}</div></div>${title ? '' : `<div class="namebox">${esc(t('name'))}<br>${esc(t('date'))}</div>`}</div>`
      + (withLegend ? legend() : '');
  }

  /* ---------- pages: measure every block at print width, then fill A4 pages ---------- */
  let pxPerMm = 0;
  function mm() {
    if (pxPerMm) return pxPerMm;
    const d = document.createElement('div'); d.style.cssText = 'position:absolute;width:100mm;visibility:hidden';
    document.body.appendChild(d); pxPerMm = d.getBoundingClientRect().width / 100; d.remove();
    return pxPerMm;
  }
  /** Fill A4 pages with the units (HTML strings, or arrays of variants from the largest to the smallest:
   *  the largest variant that still fits the page is used, else the unit starts a new page in its largest form). */
  function paginate(first, next, units) {
    const m = $('measure');
    const all = units.map(u => (Array.isArray(u) ? u : [u]));
    const flat = [first, next, ...all.flat()];
    m.innerHTML = flat.map(u => `<div class="u">${u}</div>`).join('');
    const h = new Map(flat.map((u, i) => [u, m.children[i].getBoundingClientRect().height / mm()]));
    m.innerHTML = '';
    const pad = 4;   // the last unit on a page has no gap below it
    const pages = []; let cur = [], used = h.get(first) - pad;
    for (const vs of all) {
      const fit = vs.find(v => used + h.get(v) <= CAP);
      if (cur.length && !fit) { pages.push(cur); cur = []; used = h.get(next) - pad; }
      const v = (cur.length && fit) || vs[0];
      cur.push(v); used += h.get(v);
    }
    pages.push(cur);
    return pages.map((p, i) => `<div class="sheet"><div class="u">${i ? next : first}</div>${p.map(u => `<div class="u">${u}</div>`).join('')}</div>`).join('');
  }

  /* ---------- the answer key ---------- */
  const shown = (x) => {   // the letters as sent, plus the normal spelling when it differs (vi, fr, it, es)
    const plain = String(x.orig).toUpperCase();
    return `<span class="kw">${esc(x.text)}</span>${plain !== x.text ? ` <span class="korig">(${esc(x.orig)})</span>` : ''}`;
  };
  function keyUnits(M, numbered) {
    const out = [];
    for (const { b, no } of numbered) {
      const title = t(b.type + 'Title');
      let body = '';
      if (b.type === 'telegram' || b.type === 'riddle') body = `<div class="kitems">${b.items.map((x, i) => `<span>${i + 1}. ${shown(x)}</span>`).join('')}</div>`;
      if (b.type === 'encode') body = `<div class="kitems">${b.items.map(x => `<span>${shown(x)} ${chain(x.text, 1.6)}</span>`).join('')}</div>`;
      if (b.type === 'error') body = `<div class="kitems">${b.items.map((x, i) => `<span>${i + 1}. <span class="kw">${esc(x.text)}</span> — ${esc(t('keyErr', x.index + 1, [...x.text][x.index]))} ${svg(x.right, 1.8)} <span class="korig">${esc(t('keyWrong'))}</span> ${svg(x.wrong, 1.6)}</span>`).join('')}</div>`;
      if (b.type === 'pairs') body = `<div class="kitems">${b.left.map(l => `<span><span class="kw">${esc(l)}</span> ${svg(code(l), 1.8)}</span>`).join('')}</div>`;
      if (b.type === 'password') body = `<div class="kitems"><span>${esc(t('keyPassword'))} ${shown({ text: b.word, orig: b.orig })}</span>${b.clues.map((c, i) => `<span>${i + 1}. <span class="kw">${esc(c.text)}</span></span>`).join('')}</div>`;
      if (b.type === 'coloring') {
        const name = ((typeof DICT_TEXT !== 'undefined' && (DICT_TEXT[lang()] || DICT_TEXT.en).common.pics[b.pic]) || b.pic);
        body = `<div class="kitems"><span>${colorSVG(b, 4.2, true)}</span><span>${esc(t('keyPicture'))} <b>${esc(`${b.emoji || ''} ${name}`.trim())}</b></span></div>`;
      }
      if (b.type === 'tree') body = MORSE.treeSVG(lang(), { width: 150, startLabel: t('treeStart') });
      if (b.type === 'dictation') body = `<p class="note">${esc(t('keyDictation'))}</p><div class="kitems">${b.items.map((x, i) => `<span>${i + 1}. ${shown(x)} ${chain(x.text, 1.6)}</span>`).join('')}</div>`;
      out.push(`<div class="kb"><b class="kn">${no}. ${esc(title)}</b>${body}</div>`);
    }
    return out;
  }

  /* ---------- extra pages ---------- */
  function cheatPage(M) {
    const L = lang();
    const rows = MORSE.alphabet(L).map(l => {
      const mn = MORSE.mnemonic(l, L);
      return `<div class="cr"><b>${esc(l)}</b>${svg(code(l), 2)}${mn ? `<small>${esc(mn)}</small>` : ''}</div>`;
    }).join('');
    const mnemo = t('cheatMnemo');
    return `<div class="sheet"><div class="u">${headHTML(true, M, t('cheatTitle'), t('cheatSub'))}</div>`
      + legend()
      + `<div class="cheat" style="grid-template-rows:repeat(${Math.ceil(MORSE.alphabet(L).length / 3)},auto)">${rows}</div>${mnemo ? `<p class="note">${esc(mnemo)}</p>` : ''}`
      + `<p class="note">${esc(t('cheatTree'))}</p>${MORSE.treeSVG(L, { startLabel: t('treeStart') })}</div>`;
  }
  /** The Morse tree as a poster: a whole A4 page, every letter with its code; letters with 5+ signs listed below. */
  function treePage(M) {
    const L = lang(), on = new Set(MORSE.treeNodes(L).map(n => n.letter));
    const others = MORSE.alphabet(L).filter(l => !on.has(l));
    return `<div class="sheet treepage"><div class="u">${headHTML(true, M, t('treeTitle'), t('cheatTree'))}</div>${legend()}`
      + MORSE.treeSVG(L, { poster: true, startLabel: t('treeStart') })
      + (others.length ? `<p class="note" style="margin-top:3mm">${esc(t('treeOthers'))}</p><div class="strip" style="border:0;padding:0">${others.map(l => `<span class="sc"><b>${esc(l)}</b>${svg(code(l), 1.6)}</span>`).join('')}</div>` : '')
      + '</div>';
  }
  /** The fun fact: the Titanic's SOS (a true story told gently), with three small tasks and the answers upside down.
   *  The calls are the Latin letters in every language, as they were sent. */
  function storyPage(M) {
    const st = C().story, en = l => MORSE.code(l, 'en');
    const bold = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const call = (codes, label) => `<div><small>${esc(label)}</small><div class="tiles">${codes.map(c => `<span class="tile"><span class="tc">${svg(c, 2)}</span><span class="ab"></span></span>`).join('')}</div></div>`;
    const strip = `<div class="strip"><b class="stl">${esc(t('stripTitle'))}:</b>${MORSE.STORY.letters.map(l => `<span class="sc"><b>${l}</b>${svg(en(l), 1.4)}</span>`).join('')}</div>`;
    return `<div class="sheet story"><div class="u">${headHTML(true, M, st.title, st.sub)}</div>`
      + MORSE.storySVG({ labels: { near: st.near, off: st.off, far: st.far } })
      + st.text.map(x => `<p class="st">${bold(x)}</p>`).join('')
      + `<div class="radio"><b>📻 ${esc(st.radioTitle)}</b> ${esc(st.radio)}</div>`
      + `<div class="stasks">`
      + `<div class="wide">${head(1, st.callTitle, esc(st.callInstr))}<div class="calls">${call(MORSE.STORY.cqd, st.old)}${call(MORSE.STORY.sos, st.new)}${strip}</div></div>`
      + `<div>${head(2, st.qTitle, '')}<p class="bi" style="font-size:13px">${esc(st.q)}</p>${lines(2)}</div>`
      + `<div>${head(3, st.lampTitle, '')}<p class="bi" style="font-size:13px">${esc(st.lamp)}</p><div class="sossig">${svg(MORSE.SOS_SIGNAL, 2.6)}</div></div>`
      + `</div><p class="upside"><b>${esc(st.keyTitle)}</b> ${esc(st.answer)}</p></div>`;
  }
  function diplomaPage(M) {
    const bravo = MORSE.norm(t('diplomaBravo'), lang());
    return `<div class="sheet"><div class="diploma">${MORSE.lighthouseSVG()}`
      + `<h2>${esc(t('diplomaTitle'))}</h2><p class="for">${esc(t('diplomaFor'))}</p><div class="line"></div>`
      + `<p class="txt">${esc(t('diplomaText'))}</p><p class="txt" style="margin:0 0 1mm">${esc(t('diplomaLetters'))}</p>`
      + `<p class="lets">${esc(M.letters.join(' '))}</p>`
      + `<div class="bravo">${chain(bravo, 2.4)}</div><p class="txt" style="font-weight:800;letter-spacing:.2em">${esc(t('diplomaBravo'))}</p>`
      + `<div class="signs"><span>${esc(t('diplomaDate'))}</span><span>${esc(t('diplomaSign'))}</span></div></div></div>`;
  }

  function regenerate() {
    const s = readSettings();
    persist(s);
    const msg = $('msg'); msg.className = 'msg';
    try {
      const M = MORSE.sheet({ seed: s.seed, lang: lang(), level: s.level, upto: s.upto, extra: s.extra, tasks: s.tasks });
      const units = [], numbered = [];
      // the tree as a cheat sheet would give away the tree task, so then the task itself is the only tree
      const aid = s.aid === 'tree' && M.blocks.some(b => b.type === 'tree') ? 'none' : s.aid;
      if (aid === 'strip') units.push(stripHTML(M.letters));
      if (aid === 'tree') units.push(treeAidHTML(M.letters));
      let no = 0;
      for (let i = 0; i < M.blocks.length; i++) {
        const b = M.blocks[i], nextB = M.blocks[i + 1];
        if (b.type === 'coloring') {
          const withPairs = nextB && nextB.type === 'pairs';
          const n1 = ++no; numbered.push({ b, no: n1 });
          if (withPairs) {
            const n2 = ++no; numbered.push({ b: nextB, no: n2 });
            units.push(coloringHTML(b, n1, nextB, n2));
            i++;
          } else units.push(coloringHTML(b, n1));
          continue;
        }
        const n = ++no; numbered.push({ b, no: n });
        units.push(RENDER[b.type](b, n));
      }
      // no tasks at all (e.g. only the tree poster or the cheat sheet wanted): no empty worksheet page
      let html = numbered.length ? paginate(headHTML(true, M, '', '', aid === 'none'), headHTML(false, M), units) : '';
      if (s.story) html += storyPage(M);
      if (s.cheat) html += cheatPage(M);
      if (s.key && numbered.length) html += paginate(headHTML(true, M, t('keyTitle'), C().levels[M.level]), headHTML(false, M, t('keyTitle')), keyUnits(M, numbered));
      if (s.treePage) html += treePage(M);
      if (s.diploma) html += diplomaPage(M);
      $('out').innerHTML = html;
      document.title = `${t('title')} · ${s.seed}`;
      const missing = s.tasks.filter(x => !M.blocks.some(b => b.type === x)).map(x => C().tasks[x]);
      msg.textContent = t('summary', $('out').querySelectorAll('.sheet').length) + (missing.length ? ' · ' + t('skipped', missing.join(', ')) : '');
    } catch (e) {
      msg.className = 'msg error'; msg.textContent = t('genError') + e.message;
      console.error(e);
    }
  }
  function newWorksheet() { $('seed').value = randomSeed(); regenerate(); }

  /* ---------- controls ---------- */
  function presets(boxId, values, current, label, onPick) {
    const box = $(boxId); box.innerHTML = '';
    for (const v of values) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label(v); b.className = v === current ? 'active' : '';
      b.setAttribute('aria-pressed', String(v === current));
      b.addEventListener('click', () => { onPick(v); renderControls(); regenerate(); });
      box.appendChild(b);
    }
  }
  function groupLabel(n) {
    if (n === 4) return t('groupAll');
    const ls = MORSE.groupLetters(lang(), n).join(' ');
    return n === 1 ? ls : '+ ' + ls;
  }
  function renderControls() {
    presets('levels', MORSE.LEVELS, level, v => C().levels[v], setLevel);
    presets('groups', MORSE.UPTO, upto, groupLabel, v => { upto = v; });
    presets('aids', AIDS, aid, v => C().aids[v], v => { aid = v; });
    const ex = MORSE.extras(lang());
    $('extraRow').hidden = !ex.length;
    $('extraLabel').textContent = ex.length ? t('extraLabel', ex.join(' ')) : '';
    const box = $('tasks'); box.innerHTML = '';
    for (const x of TASK_LIST) {
      const l = document.createElement('label'); l.className = 'check';
      const i = document.createElement('input'); i.type = 'checkbox'; i.checked = tasks.has(x);
      i.addEventListener('change', () => { if (i.checked) tasks.add(x); else tasks.delete(x); regenerate(); });
      const sp = document.createElement('span'); sp.textContent = C().tasks[x];
      l.append(i, ' ', sp); box.appendChild(l);
    }
  }

  function wire() {
    $('seed').addEventListener('change', regenerate);
    $('seed').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); regenerate(); } });
    for (const id of ['optExtra', 'optCheat', 'optKey', 'optTreePage', 'optDiploma', 'optStory']) $(id).addEventListener('change', regenerate);
    $('randSeed').addEventListener('click', newWorksheet);
    $('newBtn').addEventListener('click', newWorksheet);
    $('printBtn').addEventListener('click', () => window.print());
    // only the tree: show just that page, print it, then bring the whole set back
    $('printTreeBtn').addEventListener('click', () => {
      const M = MORSE.sheet({ seed: readSettings().seed, lang: lang(), level, upto, tasks: [] });
      $('out').innerHTML = treePage(M);
      window.addEventListener('afterprint', regenerate, { once: true });
      window.print();
    });
    I18N.onChange(() => { I18N.apply(UI); renderControls(); regenerate(); });
  }

  function init() {
    const q = new URLSearchParams(location.search);
    if (!restore()) $('seed').value = randomSeed();
    if (q.get('seed')) $('seed').value = q.get('seed');
    if (MORSE.LEVELS.includes(q.get('level')) && q.get('level') !== level) setLevel(q.get('level'));
    if (MORSE.UPTO.includes(+q.get('upto'))) upto = +q.get('upto');
    if (q.has('tasks')) tasks = new Set(q.get('tasks').split(',').filter(x => TASK_LIST.includes(x)));
    const flag = (k, id) => { if (q.has(k)) $(id).checked = q.get(k) === '1' || q.get(k) === 'true'; };
    if (AIDS.includes(q.get('aid'))) aid = q.get('aid');
    flag('extra', 'optExtra'); flag('cheat', 'optCheat'); flag('key', 'optKey'); flag('diploma', 'optDiploma'); flag('treepage', 'optTreePage'); flag('story', 'optStory');
    wire();
    I18N.apply(UI);
    renderControls();
    regenerate();
  }
  init();
})();
</script>
</body>
</html>
