<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademia Młodych Szyfrantów: gra</title>
<meta name="description" content="An online game for kids aged 8–10: from the Caesar cipher to a working Enigma with a turning wheel and a mirror.">
<style>
  :root{
    --ink:#1B1B1F; --red:#B3261E; --navy:#1E3A5F; --muted:#5b6070; --line:#dfe3ec;
    --bg:#eef1f6; --panel:#ffffff; --soft:#f5f7fb; --accent:#4f5bd5; --accent-d:#3d48b8;
    --good:#1f7a45; --good-soft:#e3f4ea; --bad:#B3261E; --bad-soft:#fdebe9; --hl:#ffe08a; --res:#bfe3cc;
    --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace; --head:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none !important}
  body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;}
  button,input{font:inherit;}
  button{cursor:pointer;color:var(--ink);}
  button:focus-visible,input:focus-visible,svg:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .l{font-family:var(--mono);font-weight:700;letter-spacing:.04em;white-space:nowrap;}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brand{font:800 20px/1.2 var(--head);flex:1 1 auto;margin:0;letter-spacing:-.01em;}
  .navlink{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:14px;color:var(--accent-d);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--soft);white-space:nowrap;}
  .navlink:hover{border-color:var(--accent);}
  .score{font-weight:700;font-size:15px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap;}

  /* ---- layout ---- */
  .wrap{max-width:1060px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 2px 10px rgba(30,40,80,.05);min-width:0;}
  .story{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 16px;}
  .story summary{cursor:pointer;font:700 16px/1.3 var(--head);color:var(--navy);padding:12px 0;min-height:44px;}
  .story p{margin:0 0 10px;font-size:15px;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  p{margin:0;}

  /* ---- mission tabs ---- */
  .tabs{display:grid;grid-template-columns:repeat(var(--tabs,8),minmax(0,1fr));gap:6px;}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;background:var(--panel);}
  .tab b{font:800 20px/1 var(--head);}
  .tab small{font-size:12px;color:var(--muted);line-height:1.15;text-align:center;overflow-wrap:anywhere;}
  .tab:hover{border-color:var(--navy);}
  .tab[aria-current="page"]{border-color:var(--navy);background:var(--navy);color:#fff;}
  .tab[aria-current="page"] small{color:#dfe7f3;}
  .tab .tick{position:absolute;top:-7px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 2px #fff;}

  /* ---- mission ---- */
  .mhead{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:14px;}
  .mhead h2{margin:0;font:800 26px/1.15 var(--head);}
  .mhead .sub{color:var(--muted);margin-top:3px;}
  .stamp{flex:none;width:72px;height:72px;border:3px solid var(--red);border-radius:50%;transform:rotate(-8deg);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--head);line-height:1;background:#fff;}
  .stamp span{font-size:10px;font-weight:800;letter-spacing:.06em;max-width:56px;text-align:center;line-height:1.05;}
  .stamp b{font-size:28px;font-weight:800;}
  .stamp.done{background:var(--red);color:#fff;}
  .stamp.pop{animation:stamp .5s ease-out;}
  @keyframes stamp{0%{transform:rotate(-30deg) scale(1.6);opacity:0}70%{transform:rotate(-6deg) scale(.95);opacity:1}100%{transform:rotate(-8deg) scale(1)}}
  .mgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;}
  @media (min-width:900px){ .mgrid.has-stage{grid-template-columns:minmax(0,400px) minmax(0,1fr);} }
  .stage{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .taskcol{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .stage h3,.task h3,.rules h3,.disc h3{margin:0;font:800 18px/1.25 var(--head);color:var(--navy);}

  /* task stepper */
  .steps{display:flex;gap:8px;flex-wrap:wrap;}
  .step{min-width:52px;min-height:46px;padding:4px 12px;border:2px solid var(--line);border-radius:999px;background:var(--panel);font:800 17px/1 var(--head);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .step.free{border-style:dashed;}
  .step[aria-current="step"]{border-color:var(--navy);background:var(--navy);color:#fff;}
  .step.ok::after{content:"✓";color:var(--good);font-weight:900;}
  .step[aria-current="step"].ok::after{color:#a8e6bf;}

  .task{display:flex;flex-direction:column;gap:12px;}
  .thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font:800 18px/1 var(--head);}
  .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:3px 9px;background:#eef1f8;color:var(--navy);}
  .warn{background:#fff6d6;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .good{color:var(--good);font-weight:600;}
  .bad{color:var(--bad);font-weight:600;}
  .fb{border:2px solid var(--good);background:var(--good-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:pop .3s ease-out;}
  .fb .cheer{font:800 20px/1.2 var(--head);color:var(--good);}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
  .disc{border:2px dashed var(--navy);border-radius:var(--radius);padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:8px;}
  .disc h3::before{content:"★ ";}
  .primary{font-weight:700;padding:12px 18px;border:0;border-radius:11px;background:var(--navy);color:#fff;min-height:48px;font-size:16px;align-self:flex-start;}
  .primary:hover{background:#15304f;}
  .primary:disabled{opacity:.5;cursor:default;}
  .ghostbtn{font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 16px;min-height:44px;}
  .ghostbtn:hover{border-color:var(--navy);}
  .ghostbtn:disabled{opacity:.5;cursor:default;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

  /* ---- letters over boxes ---- */
  .decoder{display:flex;flex-direction:column;gap:10px;container-type:inline-size;}
  .crow{display:flex;flex-wrap:wrap;gap:10px 16px;}
  .word{display:flex;gap:3px;}
  .cell{--cw:34px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  @supports (width:1cqi){ .cell{--cw:clamp(20px, calc((100cqi - 4px) / var(--L) - 3px), 42px);} }
  .ct{font:700 calc(var(--cw) * .62)/1 var(--mono);height:calc(var(--cw) * .72);display:flex;align-items:center;}
  .ct.red{color:var(--red);}
  .cb{width:var(--cw);height:calc(var(--cw) * 1.18);padding:0;border:2px solid var(--ink);border-radius:6px;background:#fff;font:700 calc(var(--cw) * .62)/1 var(--mono);display:flex;align-items:center;justify-content:center;}
  .cb.red{border-color:var(--red);color:var(--red);}
  .cb.cur{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent);background:#eef0ff;}
  .cb.ok{background:var(--good-soft);border-color:var(--good);cursor:default;}
  .cb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .dmsg{min-height:1.4em;color:var(--bad);font-weight:600;font-size:15px;}
  .pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;}
  .key{min-height:46px;border:1.5px solid #c5cbe0;border-radius:9px;background:#fff;font:700 20px/1 var(--mono);padding:0;}
  .key:hover{border-color:var(--navy);background:#f1f4fa;}
  .key.wide{grid-column:span 2;font:600 15px/1 system-ui,sans-serif;}

  /* ---- wheel ---- */
  .wheelbox{display:flex;flex-direction:column;align-items:center;gap:10px;}
  svg.wheel{width:100%;max-width:340px;height:auto;display:block;user-select:none;-webkit-user-select:none;}
  svg.wheel.drag{touch-action:none;cursor:grab;}
  .w-outer{fill:#fff;stroke:var(--ink);stroke-width:2;}
  .w-inner{fill:#fff8f7;stroke:var(--ink);stroke-width:1.5;}
  .w-sep{stroke:#9aa0ad;stroke-width:1;}
  .w-hub{fill:#fff;stroke:#c9c4b8;stroke-width:1;}
  .w-star{fill:var(--red);}
  .w-window{fill:rgba(30,58,95,.08);stroke:var(--navy);stroke-width:2.5;}
  .wt{font-family:var(--mono);font-weight:700;fill:var(--ink);}
  .wt.red{fill:var(--red);}
  .wl .hit{fill:transparent;}
  .wl.hl .hit{fill:var(--hl);}
  .wl.res .hit{fill:var(--res);}
  .dial{display:flex;align-items:center;gap:12px;justify-content:center;}
  .dialbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:26px;font-weight:700;line-height:1;}
  .dialbtn:hover{border-color:var(--navy);}
  .dialbox{display:flex;flex-direction:column;align-items:center;min-width:72px;}
  .dialbox small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .dialnum{font:800 30px/1 var(--mono);color:var(--navy);}
  .wstate{text-align:center;font-size:15px;min-height:1.4em;}

  /* ---- mission 2 table ---- */
  .subt{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;}
  .col{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:#fff;font:700 18px/1 var(--mono);min-height:58px;}
  .col b{padding:6px 0;color:var(--ink);border-bottom:1px solid var(--line);}
  .col span{padding:6px 0;color:var(--red);}
  .col:hover{border-color:var(--navy);}
  .col.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);}
  .col.sel b,.col.sel span{background:var(--hl);}

  /* ---- mission 3 cards ---- */
  .slots,.cards{display:flex;gap:10px;flex-wrap:wrap;}
  .slot,.pcard{width:60px;height:76px;border-radius:10px;font:800 32px/1 var(--mono);display:flex;align-items:center;justify-content:center;padding:0;}
  .slot{border:2px dashed #9aa0ad;background:var(--soft);}
  .slot.full{border:2px solid var(--navy);background:#fff;}
  .pcard{border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 #c9c4b8;}
  .pcard:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .found{display:flex;flex-wrap:wrap;gap:6px;}
  .found span{font:700 18px/1 var(--mono);letter-spacing:.12em;border:1.5px solid var(--good);background:var(--good-soft);border-radius:8px;padding:8px 10px;}
  .eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px/1 var(--mono);}
  .num{width:110px;min-height:46px;border:2px solid var(--navy);border-radius:8px;font:700 20px/1 var(--mono);text-align:center;padding:4px;}
  .num.ok{border-color:var(--good);background:var(--good-soft);}
  .num.no{border-color:var(--bad);background:var(--bad-soft);}
  .ftable{border-collapse:collapse;width:100%;}
  .ftable th,.ftable td{border:1px solid var(--line);padding:6px 4px;text-align:center;font:700 16px/1.2 var(--mono);}
  .ftable th{font:700 13px/1.2 system-ui,sans-serif;text-align:left;color:var(--muted);}
  .ftable .num{width:100%;min-width:0;font-size:16px;padding:2px;}
  .tscroll{max-width:100%;}
  .bigfact{font:800 20px/1.3 var(--mono);color:var(--red);overflow-wrap:anywhere;}

  /* ---- mirror ---- */
  .mirror{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
  .mirror.big{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;}
  .pair{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:5px;}
  .pair.hl{background:var(--hl);border-color:var(--navy);}
  .pair i{font-style:normal;color:var(--navy);font-weight:800;}
  .sq{min-width:44px;height:46px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:700 20px/1 var(--mono);display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}
  .mirror.big .sq{min-width:34px;height:38px;font-size:17px;}
  button.sq:hover{border-color:var(--navy);background:#f1f4fa;}
  .sq.red{border-color:var(--red);color:var(--red);}
  .sq.res{border-color:var(--navy);border-width:3px;}

  /* ---- path of a letter ---- */
  .path{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft);}
  .chain{display:flex;align-items:flex-start;gap:2px;}
  .cn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;min-width:0;max-width:84px;}
  .cn small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15;}
  .cn .sq{background:#fff;}
  .ca{flex:none;color:var(--navy);font-weight:800;padding-top:12px;}
  .rules ol,.stage ol{margin:6px 0 0;padding-left:22px;font-size:15px;}
  .rules li,.stage li{margin:3px 0;}

  /* ---- free machine ---- */
  .free{display:flex;flex-direction:column;gap:10px;}
  .flabel{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
  .free-in{width:100%;min-height:48px;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font:700 20px/1.2 var(--mono);text-transform:uppercase;}
  .free-out{min-height:48px;border:2px solid var(--red);border-radius:10px;padding:6px 10px;font:700 20px/1.4 var(--mono);color:var(--red);letter-spacing:.1em;white-space:pre-wrap;overflow-wrap:anywhere;}

  /* ---- choices / quiz ---- */
  .choice{display:flex;flex-direction:column;gap:8px;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opts.yn{flex-direction:row;}
  .opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:48px;font-size:16px;}
  .opts.yn .opt{min-width:96px;text-align:center;font-weight:800;}
  .opt:hover{border-color:var(--navy);}
  .opt[aria-pressed="true"]{border-color:var(--navy);background:#eef1f8;}
  .opt.right{border-color:var(--good);background:var(--good-soft);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);}
  .opt:disabled{cursor:default;}
  .opt:disabled:not(.right):not(.wrong){opacity:.6;}
  .qfb:empty{display:none;}
  .quiz{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:18px;}
  .quiz > li > p{font-weight:600;margin-bottom:8px;}
  .cert{border:6px double var(--navy);border-radius:var(--radius);padding:18px;background:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .cert > div:first-child{flex:1 1 240px;display:flex;flex-direction:column;gap:6px;}
  .cert h3{margin:0;font:800 24px/1.2 var(--head);color:var(--navy);}
  .bigstamp{flex:none;width:150px;height:150px;border:5px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:rotate(-10deg);font:800 17px/1 var(--head);letter-spacing:.06em;text-align:center;padding:10px;animation:stamp .6s ease-out;}
  .bigstamp svg{width:42px;height:42px;}
  .bigstamp small{font-size:10px;letter-spacing:.02em;font-weight:700;}

  .stats{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding:0 4px;}
  .stats .grow{flex:1;}
  .ghost{font-size:13px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;color:var(--muted);}
  .ghost:hover{border-color:var(--bad);color:var(--bad);}

  @media (prefers-reduced-motion:reduce){ .fb,.stamp.pop,.bigstamp,.cb.bad{animation:none;} }

  /* ---- phone ---- */
  @media (max-width:700px){
    .tabs{--tabs:4 !important;}
    .tab small{display:none;}
    .tab{min-height:50px;}
  }
  @media (max-width:600px){
    .top{padding:8px 12px;gap:6px 8px;}
    .brand{font-size:18px;flex-basis:100%;order:-1;}
    .wrap{padding:10px;gap:10px;}
    .card{padding:12px;}
    .mhead{gap:10px;}
    .mhead h2{font-size:22px;}
    .stamp{width:58px;height:58px;}
    .stamp b{font-size:22px;}
    .stamp span{font-size:8px;max-width:44px;}
    svg.wheel{max-width:360px;}
    .subt{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:3px;}
    .mirror{grid-template-columns:repeat(2,minmax(0,1fr));}
    .mirror.big{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));}
    .bigstamp{width:124px;height:124px;font-size:14px;}
  }
</style>
</head>
<body>

<header class="top">
  <a class="navlink" href="../index.html" data-keep-lang data-i18n="allPuzzles">🧩 Wszystkie zagadki</a>
  <h1 class="brand" data-i18n="brand">🔐 Akademia Młodych Szyfrantów</h1>
  <a class="navlink" href="index.html" data-keep-lang data-i18n="printSheets">🖨️ Karty do druku</a>
  <nav class="langs" aria-label="Język"></nav>
  <span class="score" id="score" aria-live="polite" data-i18n-attr="title:starsTitle" title="Zdobyte gwiazdki">⭐ 0</span>
</header>

<main class="wrap">
  <details class="story" id="story"><summary id="storyTitle"></summary><p id="story1"></p><p id="story2"></p></details>
  <nav class="tabs" id="tabs" data-i18n-attr="aria-label:tabsLabel" aria-label="Misje"></nav>
  <div id="view"></div>
  <div class="stats">
    <span id="statsText" class="grow"></span>
    <button type="button" class="ghost" id="resetBtn" data-i18n="reset">Wyczyść postępy</button>
  </div>
</main>

<script src="../i18n.js"></script>
<script src="engine.js"></script>
<script src="strings.js"></script>
<script src="play-strings.js"></script>
<script>
(() => {
  'use strict';
  const E = ENIGMA;
  const $ = q => document.querySelector(q);

  // ================= texts =================
  const DICT = {};
  I18N.LANGS.forEach(({ code }) => { DICT[code] = (E.TEXT[code] && E.TEXT[code].play) || {}; });
  const lang = () => I18N.get();
  /** French: no line break before : ; ? ! (also inside lists and quiz objects). */
  function fr(x) {
    if (lang() !== 'fr') return x;
    if (typeof x === 'string') return x.replace(/ ([:;?!»])/g, ' $1');
    if (Array.isArray(x)) return x.map(fr);
    if (x && typeof x === 'object') { const o = {}; for (const k of Object.keys(x)) o[k] = fr(x[k]); return o; }
    return x;
  }
  /** A text of the game (play-strings.js). */
  const T = (k, ...a) => fr(I18N.t(DICT, k, ...a));
  const pack = () => E.pack(lang());
  /** A text of the worksheets (strings.js): strings as they are, functions get the values of the pack. */
  function W(k, ...a) {
    const D = E.textFor(lang()), PL = E.TEXT.pl || {};
    let x = D[k] !== undefined ? D[k] : PL[k];
    if (x === undefined) return '';
    if (typeof x === 'function') { try { x = x(E.values(pack()), ...a); } catch (_) { return ''; } }
    return fr(x);
  }
  const hasBig = (() => { try { return typeof E.bigPack === 'function' && E.bigPack('pl').out.length > 8; } catch (_) { return false; } })();
  const mod = (a, m) => ((a % m) + m) % m;
  const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ================= DOM helpers (text only, never HTML) =================
  const SVGNS = 'http://www.w3.org/2000/svg';
  function mk(ns, tag, attrs, kids) {

  /** A row of letters, each over a box. The child fills the boxes; a wrong letter shakes and is not kept.

  /** Answer buttons. o: opts (texts), ok (indices), multi, yn, solved, right, wrong, onRight. */

  /** A two-ring wheel: black letters `outer` fixed, red letters `inner` on a disc that turns.

      if (!o.drag || !dn.moved) return;

      el: svg, n, setK, turn,
      get k() { return k; },
      hl(ring, ch, cls) { const g = groups[ring].get(ch); if (g) g.classList.add(cls || 'hl'); },
      clear() { svg.querySelectorAll('.wl.hl,.wl.res').forEach(g => g.classList.remove('hl', 'res')); },
      setText(t) { if (o.drag) svg.setAttribute('aria-valuetext', t); else svg.setAttribute('aria-label', `${o.label}. ${t}`); },
    };
  }

  /** Wheel + mirror + "path of one letter" for Missions 6 and 7. M: a pack or a bigPack. */
  function enigmaKit(M) {
    const wh = wheel({ outer: M.out, inner: M.inn, kind: 'enigma', label: T('wheelLabel'),
      onTap: (ring, ch) => { if (ring === 'out' && active.decoder) active.decoder.enter(ch); } });

      const el = h('div', { class: 'pair' }, h('span', { class: 'sq' }, a), h('i', { 'aria-hidden': 'true' }, '↔'), h('span', { class: 'sq' }, b));

  /** Free play: type a message, see the code at once, put the code back in. */
  function freeMachine(M, K) {
    const letters = M.out;
    const inp = h('input', { type: 'text', class: 'free-in', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', maxlength: 40, 'aria-label': T('inputLabel') });
    const out = h('div', { class: 'free-out', 'aria-live': 'polite' });
    const note = h('p', { class: 'good', hidden: true }, rich(T('swapNote')));
    const clean = str => [...str.toUpperCase().normalize('NFC')].filter(ch => ch === ' ' || letters.includes(ch)).join('').replace(/ {2,}/g, ' ').slice(0, 40);
    function upd(swapped) {
      const v = clean(inp.value);
      if (inp.value !== v) inp.value = v;
      out.textContent = E.enigma(M, v);
      K.wh.setK([...v].filter(ch => letters.includes(ch)).length, true);
      K.updSt();
      note.hidden = !swapped;
    }
    inp.addEventListener('input', () => upd(false));
    const typeIn = ch => { inp.value += ch; upd(false); };
    const keys = pad(letters, typeIn, [
      h('button', { type: 'button', class: 'key wide', onclick: () => typeIn(' ') }, T('space')),
      h('button', { type: 'button', class: 'key wide', 'aria-label': T('eraseLabel'), title: T('eraseLabel'), onclick: () => { inp.value = [...inp.value].slice(0, -1).join(''); upd(false); } }, '⌫'),
    ]);

    const clr = h('button', { type: 'button', class: 'ghostbtn', onclick: () => { inp.value = ''; upd(false); } }, T('clear'));
    upd(false);
    return h('div', { class: 'free' },
      h('label', { class: 'flabel' }, W('msgLabel') || T('inputLabel')), inp,
      h('div', { class: 'flabel' }, W('codeLabel')), out,
      h('div', { class: 'row' }, swap, clr), note, keys);
  }

  // ================= missions =================
  /** Each builder returns { title, sub, stage (node or null), tasks: { id: { title, free, build(panel, ctx) } }, disc: [texts] }.

    function notes(word) {
      const pl = [...word], cd = [...E.diskEnc(p, word)], out = [];

        if (pl[i] === pl[j] && p.out.includes(pl[i]) && cd[i] !== cd[j]) { out.push(T('m4Repeat', pl[i], cd[i], cd[j])); break outer; }
      }
      const col = E.collisions(p, word);

      if (col.self.length) out.push(T('m4Self', col.self));

    }

        onPos: (c, end) => { wh.clear(); if (c) { goTo(c.k); wh.hl('out', c.ch); } else goTo(end); },
        onSolved: () => then(true) });

  function missionView(m) {
    const def = BUILD[m]();
    const ids = TASKS[m];
    if (!S.task || !ids.includes(S.task)) S.task = ids.find(id => !FREE.has(id) && !prog.done.has(id)) || ids[0];

    const stepBtns = ids.map((id, i) => h('button', { type: 'button', class: 'step' + (FREE.has(id) ? ' free' : ''), onclick: () => open(id) }, taskLetter(i)));
    const steps = h('div', { class: 'steps', role: 'group', 'aria-label': T('tasksLabel') }, stepBtns);
    const panel = h('section', { class: 'card task' });
    const disc = h('section', { class: 'disc' });
    const nextM = m === MISSIONS[MISSIONS.length - 1] ? REPORT : MISSIONS[MISSIONS.indexOf(m) + 1];
    const nextBtn = h('button', { type: 'button', class: 'primary', onclick: () => go(nextM, true) }, T(nextM === REPORT ? 'toReport' : 'nextMission'));
    disc.append(h('h3', null, W('discovery') || 'Odkrycie'), def.disc.filter(Boolean).map(x => para(x)), nextBtn);

    function refresh() {
      stamp.classList.toggle('done', missionDone(m));
      stepBtns.forEach((b, i) => {
        const id = ids[i];
        b.classList.toggle('ok', prog.done.has(id));
        if (id === S.task) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
        b.setAttribute('aria-label', `${taskLetter(i)}: ${plain(def.tasks[id].title)}${prog.done.has(id) ? ` (${T('tabDone')})` : ''}`);
      });
      disc.hidden = !missionDone(m);
      renderTop();
    }
    /** The feedback box under a solved task, with a button to the next task still to do. */
    function feedback(id, msgs, fresh, wasDone) {
      const list = (Array.isArray(msgs) ? msgs : [msgs]).filter(Boolean);
      const cheers = T('cheers');
      const box = h('div', { class: 'fb', role: 'status' },
        fresh ? h('div', { class: 'cheer' }, Array.isArray(cheers) ? cheers[Math.floor(Math.random() * cheers.length)] : '') : null,
        list.map(x => para(x)),
        fresh && !wasDone && missionDone(m) ? para(T('missionDone'), 'good') : null);
      const i = ids.indexOf(id);
      const nx = ids.slice(i + 1).find(x => !prog.done.has(x)) || ids.slice(0, i).find(x => !FREE.has(x) && !prog.done.has(x));
      if (nx) box.appendChild(h('button', { type: 'button', class: 'primary', onclick: () => open(nx, true) }, T('next')));
      panel.appendChild(box);
      return box;
    }
    function open(id, focus) {
      S.task = id; tok++;
      active.decoder = null;
      const task = def.tasks[id], i = ids.indexOf(id);
      panel.replaceChildren(h('div', { class: 'thead' }, h('span', { class: 'dot', 'aria-hidden': 'true' }, taskLetter(i)), h('h3', null, rich(task.title)),
        task.free ? h('span', { class: 'tag' }, T('freeTag')) : null));
      let solvedNow = false;
      const ctx = {
        done: prog.done.has(id),
        solve(msgs) {
          if (solvedNow) return;
          solvedNow = true;
          const wasDone = missionDone(m);
          if (!FREE.has(id)) prog.done.add(id);
          save();
          refresh();
          if (!wasDone && missionDone(m)) { stamp.classList.remove('pop'); void stamp.offsetWidth; stamp.classList.add('pop'); }
          const box = feedback(id, msgs, true, wasDone);
          const b = box.querySelector('button');
          if (b) b.focus({ preventScroll: true });
          box.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
        },
        finish(msgs) { feedback(id, msgs, false, true); },
      };
      task.build(panel, ctx);
      refresh();
      if (focus) { const f = panel.querySelector('.cb.cur, .opt:not(:disabled), .pcard:not(:disabled), input, .primary'); if (f) f.focus({ preventScroll: true }); panel.scrollIntoView({ block: 'nearest' }); }
    }

    const grid = h('div', { class: 'mgrid' + (def.stage ? ' has-stage' : '') }, def.stage, h('div', { class: 'taskcol' }, steps, panel, disc));
    const root = h('article', { class: 'card' }, head, grid);
    open(S.task);
    return root;
  }

  function reportView() {
    const p = pack(), v = E.values(p);
    const done = prog.done.has('q');
    const qs = T('quiz', v.out0, v.crib);
    const right = new Set(done ? qs.map((_, i) => i) : []);
    const count = h('p', { class: 'muted', 'aria-live': 'polite' });
    const cert = h('section', { class: 'cert', hidden: !done });
    function paintCert() {
      const missing = MISSIONS.filter(m => !missionDone(m));
      cert.replaceChildren(
        h('div', null, h('h3', null, W('certTitle')), para(T('certText')), para(T('starsSum', starCount()), 'good'),
          para(missing.length ? T('missing', missing.join(', ')) : T('allMissions'), missing.length ? 'muted' : 'good')),
        h('div', { class: 'bigstamp' }, s('svg', { viewBox: '-5 -5 10 10', 'aria-hidden': 'true' }, s('path', { d: starPath(0, 0, 4.8, 1.9), fill: 'currentColor' })),
          h('span', null, T('certStamp')), h('small', null, W('puzzle'))));
    }
    const upd = () => { count.textContent = T('quizLeft', right.size); };
    const list = h('ol', { class: 'quiz' }, qs.map((q, i) => h('li', null, para(q.q),
      choice({ opts: q.opts, ok: q.ok, multi: q.multi, yn: q.opts.length === 2 && q.opts[0].length < 6, solved: done,
        right: `${T('quizRight')} ${q.why}`, wrong: T('quizWrong'),
        onRight: () => {
          right.add(i); upd();
          if (right.size === qs.length && !prog.done.has('q')) {
            prog.done.add('q'); save(); renderTop();
            paintCert(); cert.hidden = false;
            cert.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' });
          }
        } }))));
    upd(); paintCert();
    return h('article', { class: 'card' },
      h('header', { class: 'mhead' }, h('div', { class: 'stamp' + (done ? ' done' : ''), 'aria-hidden': 'true' }, h('b', null, '★')),
        h('div', null, h('h2', null, W('reportTitle')), h('p', { class: 'sub' }, rich(W('reportSub'))))),
      h('div', { class: 'taskcol' },
        h('section', { class: 'disc' }, h('h3', null, W('machineTitle')), para(W('machineText')), para(W('machineSmall'), 'muted small')),
        h('section', { class: 'task' }, h('h3', null, W('quizTitle')), para(T('quizIntro'), 'muted'), list, count),
        cert));
  }

  // ================= page =================
  function renderTop() {
    $('#score').textContent = `⭐ ${starCount()}`;
    $('#statsText').textContent = T('statsLine', starCount(), MISSIONS.filter(missionDone).length, MISSIONS.length);
    const tabs = $('#tabs'), names = T('tabs');
    tabs.style.setProperty('--tabs', MISSIONS.length + 1);
    tabs.replaceChildren(...[...MISSIONS, REPORT].map(m => {
      const done = m === REPORT ? prog.done.has('q') : missionDone(m);
      const name = (Array.isArray(names) && names[m - 1]) || '';
      return h('button', { type: 'button', class: 'tab', 'aria-current': m === S.m ? 'page' : null,
        'aria-label': `${m === REPORT ? '' : m + '. '}${name}${done ? ` (${T('tabDone')})` : ''}`, onclick: () => go(m) },
        h('b', { 'aria-hidden': 'true' }, m === REPORT ? '🏁' : String(m)), h('small', { 'aria-hidden': 'true' }, name),
        done ? h('span', { class: 'tick', 'aria-hidden': 'true' }, '✓') : null);
    }));
  }
  function render() {
    tok++;
    active.decoder = null;
    document.title = T('docTitle');
    I18N.apply(DICT);
    $('#storyTitle').textContent = W('historyTitle');
    $('#story1').replaceChildren(...rich(W('history1')));
    $('#story2').replaceChildren(...rich(W('history2')));
    renderTop();
    $('#view').replaceChildren(S.m === REPORT ? reportView() : missionView(S.m));
  }
  function go(m, scroll) {
    S.m = m; S.task = null; prog.last = m; save();
    try {   // keep ?mission= in step with the screen, so a reload stays here
      const u = new URL(location.href);
      if (u.searchParams.has('mission')) { u.searchParams.set('mission', m); history.replaceState(null, '', u); }
    } catch (_) { /* file:// in some browsers: ignore */ }
    render();
    if (scroll) $('#tabs').scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || !active.decoder) return;
    const t = e.target;
    if (t && t.closest && t.closest('input,textarea,select,[role=slider],summary')) return;
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(t && t.classList && t.classList.contains('cb'))) return;
    if (active.decoder.key(e)) e.preventDefault();
  });
  $('#resetBtn').addEventListener('click', () => {
    if (!window.confirm(T('resetConfirm'))) return;
    prog.done.clear(); S.keyFound = false; S.task = null; save(); render();
  });
  I18N.onChange(() => render());
  render();
})();
</script>
</body>
</html>
